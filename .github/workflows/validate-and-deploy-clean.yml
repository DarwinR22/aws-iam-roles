name: 🚀 Validate & Deploy IAM Resources

on:
  push:
    branches: [dev, qa, main]
    paths:
      - '**/*.json'
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.yaml'
      - '**/*.yml'
      - '.github/workflows/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write   # Requerido para OIDC authentication con AWS
  contents: read    # Requerido para checkout del repositorio

env:
  TF_VERSION: "1.6.0"
  PYTHON_VERSION: "3.11"

jobs:
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          download_external_modules: true
          quiet: false
          
      - name: 🔍 Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🎯 Terraform Format Check
        run: |
          echo "🎯 Checking and fixing Terraform formatting..."
          terraform fmt -recursive -write=true
          
          # Check if any files were modified
          if ! git diff --quiet; then
            echo "⚠️ Some files were reformatted:"
            git diff --name-only
            echo "📝 Auto-committing format changes..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add -A
            git commit -m "style: Auto-format Terraform files [skip ci]" || echo "No changes to commit"
            git push || echo "No changes to push"
          else
            echo "✅ All Terraform files are properly formatted"
          fi

      - name: 📏 Python Code Quality
        continue-on-error: true
        run: |
          echo "📏 Installing Python linting tools..."
          pip install flake8 black pylint
          
          echo "🔍 Running Python linting..."
          find . -name "*.py" -not -path "./.git/*" | head -10 | while read file; do
            echo "Linting: $file"
            flake8 "$file" --max-line-length=120 || echo "⚠️ Linting issues found in $file"
            black --check "$file" || echo "⚠️ Formatting issues found in $file"
          done
          echo "✅ Python code quality check completed"

  validate:
    name: ✅ Validar configuraciones
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🌍 Determine Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ github.event.inputs.environment }}"
            should_deploy="true"
          else
            case "${{ github.ref_name }}" in
              "dev")
                environment="dev"
                should_deploy="true"
                ;;
              "qa")
                environment="qa"
                should_deploy="true"
                ;;
              "main")
                environment="prod"
                should_deploy="true"
                ;;
              *)
                environment="dev"
                should_deploy="false"
                ;;
            esac
          fi
          
          echo "environment=$environment" >> $GITHUB_OUTPUT
          echo "should_deploy=$should_deploy" >> $GITHUB_OUTPUT
          
          echo "Target Environment: $environment"
          echo "Should Deploy: $should_deploy"

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-MCI-IAM-Validation
          aws-region: us-east-1

      - name: 🔍 Validate JSON Files
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" -not -path "./.git/*" | while read file; do
            echo "Validating: $file"
            python -m json.tool "$file" > /dev/null
          done
          echo "✅ All JSON files are valid"

      - name: 📏 Validate Role Naming Convention
        run: |
          echo "📏 Validating role naming conventions..."
          pip install PyYAML
          
          python -c "
          import json
          import os
          import re
          from pathlib import Path
          
          # Patrón de nomenclatura: rol-{gerencia}-{area}-{pais}-{aplicacion}
          ROLE_NAME_PATTERN = r'^rol-[a-z]{2,6}-[a-z0-9\-]{2,15}-(gt|sv|ni|cr|hn|rg)-[a-z0-9\-]{2,20}$'
          
          # Buscar todos los archivos de roles
          role_files = []
          gerencias_path = Path('gerencias')
          
          if gerencias_path.exists():
              for role_file in gerencias_path.glob('**/rol-*.json'):
                  role_files.append(role_file)
          
          validation_errors = []
          
          for role_file in role_files:
              try:
                  with open(role_file, 'r', encoding='utf-8') as f:
                      role_data = json.load(f)
                  
                  role_name = role_data.get('role_name', '')
                  file_name = role_file.stem
                  
                  # Validar que el nombre del archivo coincida con role_name
                  if role_name != file_name:
                      validation_errors.append(f'❌ {role_file}: role_name (\"{role_name}\") no coincide con nombre del archivo (\"{file_name}\")')
                  
                  # Validar patrón de nomenclatura
                  if not re.match(ROLE_NAME_PATTERN, role_name):
                      validation_errors.append(f'❌ {role_file}: Nombre \"{role_name}\" no sigue el patrón rol-{{gerencia}}-{{area}}-{{pais}}-{{aplicacion}}')
                  
                  # Validar estructura de carpetas
                  path_parts = role_file.parts
                  if len(path_parts) >= 4:
                      gerencia_folder = path_parts[1]
                      area_folder = path_parts[2]
                      
                      # Extraer gerencia y área del nombre del rol
                      role_parts = role_name.split('-')
                      if len(role_parts) >= 4:
                          role_gerencia = role_parts[1]
                          role_area = role_parts[2]
                          
                          if gerencia_folder.lower() != role_gerencia.lower():
                              validation_errors.append(f'❌ {role_file}: Gerencia en carpeta (\"{gerencia_folder}\") no coincide con rol (\"{role_gerencia}\")')
                          
                          if area_folder.lower() != role_area.lower():
                              validation_errors.append(f'❌ {role_file}: Área en carpeta (\"{area_folder}\") no coincide con rol (\"{role_area}\")')
                  
                  # Validar tags requeridos
                  tags = role_data.get('tags', {})
                  required_tags = ['ambiente', 'pais', 'gerencia', 'area', 'Equipo', 'Proyecto', 'propietario']
                  
                  for required_tag in required_tags:
                      if required_tag not in tags:
                          validation_errors.append(f'❌ {role_file}: Falta tag requerido \"{required_tag}\"')
                  
                  print(f'✅ {role_file}: Validación exitosa')
                  
              except Exception as e:
                  validation_errors.append(f'❌ {role_file}: Error de validación - {str(e)}')
          
          # Mostrar resultados
          if validation_errors:
              print('\n🚨 ERRORES DE VALIDACIÓN ENCONTRADOS:')
              for error in validation_errors:
                  print(error)
              exit(1)
          else:
              print('\n✅ Todos los roles cumplen con las convenciones de nomenclatura')
          "
          echo "✅ Role naming validation completed"

      - name: 🔍 Validate Terraform Syntax
        working-directory: environments/${{ steps.env.outputs.environment }}
        run: |
          echo "🔍 Validating Terraform syntax for ${{ steps.env.outputs.environment }}..."
          terraform init
          terraform validate
          echo "✅ Terraform syntax is valid"

      - name: 📋 Terraform Plan
        working-directory: environments/${{ steps.env.outputs.environment }}
        run: |
          echo "📋 Running Terraform plan for ${{ steps.env.outputs.environment }}..."
          terraform plan -detailed-exitcode -var-file="team-tag-policies.tfvars"
          echo "✅ Terraform plan completed"

  deploy:
    name: Deploy to ${{ needs.validate.outputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-MCI-IAM-Deploy
          aws-region: us-east-1

      - name: 🚀 Deploy Infrastructure
        working-directory: environments/${{ needs.validate.outputs.environment }}
        run: |
          echo "🚀 Deploying to ${{ needs.validate.outputs.environment }}..."
          terraform init
          terraform apply -auto-approve -var-file="team-tag-policies.tfvars"
          echo "✅ Deployment completed successfully"

  post-deployment-tests:
    name: 🧪 Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: needs.validate.outputs.should_deploy == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-MCI-IAM-Tests
          aws-region: us-east-1

      - name: 🧪 Test IAM Policies
        run: |
          echo "🧪 Testing IAM policies existence..."
          pip install boto3
          
          python -c "
          import boto3
          iam = boto3.client('iam')
          
          policies_to_check = [
              'App-StandardBoundary',
              'Platform-Boundary',
              'MCI-Deployment-TerraformCore',
              'MCI-Deployment-S3Analytics',
              'MCI-Deployment-CloudFormation',
              'MCI-Deployment-Lambda',
              'MCI-Deployment-Logs'
          ]
          
          for policy_name in policies_to_check:
              try:
                  response = iam.get_policy(PolicyArn=f'arn:aws:iam::393209814297:policy/{policy_name}')
                  print(f'✅ Policy {policy_name} exists')
              except Exception as e:
                  print(f'❌ Policy {policy_name} not found: {e}')
          "
          echo "✅ IAM policy tests completed"

  generate-docs:
    name: 📚 Generate Documentation
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: needs.validate.outputs.should_deploy == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📚 Generate IAM Documentation
        run: |
          echo "📚 Generating IAM documentation..."
          pip install PyYAML
          python generate_docs.py
          echo "✅ Documentation generation completed"

      - name: 📤 Commit Documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add POLICIES_DOCUMENTATION.md || true
          git commit -m "docs: Auto-update IAM policies documentation [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, validate, deploy, post-deployment-tests, generate-docs]
    if: always()
    
    steps:
      - name: 📢 Deployment Notification
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🎉 Deployment to ${{ needs.validate.outputs.environment }} completed successfully!"
            echo "✅ Security scan: ${{ needs.security-scan.result }}"
            echo "✅ Code quality: ${{ needs.code-quality.result }}"
            echo "✅ Validation: ${{ needs.validate.result }}"
            echo "✅ Deployment: ${{ needs.deploy.result }}"
            echo "✅ Tests: ${{ needs.post-deployment-tests.result }}"
            echo "✅ Documentation: ${{ needs.generate-docs.result }}"
          else
            echo "❌ Deployment failed or was skipped"
            echo "🔍 Check the logs for more details"
          fi
