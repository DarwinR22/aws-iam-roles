name: 🧹 Cleanup Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to cleanup'
        required: true
        type: choice
        options:
          - dev
          - qa
      resource_pattern:
        description: 'Resource pattern to cleanup (regex)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (show what would be deleted)'
        required: false
        default: true
        type: boolean
      force:
        description: 'Force cleanup (bypass confirmations)'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: "1.6.0"

jobs:
  cleanup:
    name: 🧹 Cleanup Resources
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment }}-cleanup
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', inputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', inputs.environment)] }}
          aws-region: ${{ vars[format('AWS_REGION_{0}', inputs.environment)] || 'us-east-1' }}

      - name: 🔍 Identify Resources for Cleanup
        id: identify
        run: |
          echo "🔍 Identifying resources for cleanup in ${{ inputs.environment }}..."
          
          # Listar roles IAM que coincidan con el patrón
          if [ -n "${{ inputs.resource_pattern }}" ]; then
            pattern="${{ inputs.resource_pattern }}"
          else
            pattern="rol-.*-${{ inputs.environment }}-.*"
          fi
          
          # Encontrar roles que coincidan
          roles=$(aws iam list-roles --query "Roles[?starts_with(RoleName, 'rol-') && contains(RoleName, '${{ inputs.environment }}')].RoleName" --output text)
          
          echo "roles_to_cleanup<<EOF" >> $GITHUB_OUTPUT
          echo "$roles" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "📋 Roles found for cleanup:"
          echo "$roles" | tr '\t' '\n'

      - name: 🧹 Dry Run Cleanup
        if: inputs.dry_run == true
        run: |
          echo "🧹 DRY RUN: Resources that would be cleaned up:"
          echo "${{ steps.identify.outputs.roles_to_cleanup }}" | tr '\t' '\n' | while read role; do
            if [ -n "$role" ]; then
              echo "  - IAM Role: $role"
              
              # Mostrar políticas adjuntas
              policies=$(aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[].PolicyArn' --output text)
              if [ -n "$policies" ]; then
                echo "    Attached policies:"
                echo "$policies" | tr '\t' '\n' | sed 's/^/      - /'
              fi
              
              # Mostrar políticas inline
              inline_policies=$(aws iam list-role-policies --role-name "$role" --query 'PolicyNames' --output text)
              if [ -n "$inline_policies" ]; then
                echo "    Inline policies:"
                echo "$inline_policies" | tr '\t' '\n' | sed 's/^/      - /'
              fi
            fi
          done

      - name: ⚠️ Confirmation Required
        if: inputs.dry_run == false && inputs.force == false
        run: |
          echo "⚠️ CONFIRMATION REQUIRED"
          echo "This action will permanently delete the following resources:"
          echo "${{ steps.identify.outputs.roles_to_cleanup }}" | tr '\t' '\n'
          echo ""
          echo "To proceed, re-run this workflow with 'force: true'"
          exit 1

      - name: 🗑️ Execute Cleanup
        if: inputs.dry_run == false && inputs.force == true
        run: |
          echo "🗑️ Executing cleanup for ${{ inputs.environment }}..."
          
          echo "${{ steps.identify.outputs.roles_to_cleanup }}" | tr '\t' '\n' | while read role; do
            if [ -n "$role" ]; then
              echo "🗑️ Cleaning up role: $role"
              
              # Detach managed policies
              aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[].PolicyArn' --output text | tr '\t' '\n' | while read policy_arn; do
                if [ -n "$policy_arn" ]; then
                  echo "  Detaching policy: $policy_arn"
                  aws iam detach-role-policy --role-name "$role" --policy-arn "$policy_arn"
                fi
              done
              
              # Delete inline policies
              aws iam list-role-policies --role-name "$role" --query 'PolicyNames' --output text | tr '\t' '\n' | while read policy_name; do
                if [ -n "$policy_name" ]; then
                  echo "  Deleting inline policy: $policy_name"
                  aws iam delete-role-policy --role-name "$role" --policy-name "$policy_name"
                fi
              done
              
              # Delete the role
              echo "  Deleting role: $role"
              aws iam delete-role --role-name "$role"
              
              echo "✅ Role $role deleted successfully"
            fi
          done

      - name: 📊 Generate Cleanup Report
        if: always()
        run: |
          echo "## 🧹 Cleanup Report - ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Force**: \`${{ inputs.force }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pattern**: \`${{ inputs.resource_pattern || 'default' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### 👁️ Resources Identified (Dry Run)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🗑️ Resources Cleaned Up" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "${{ steps.identify.outputs.roles_to_cleanup }}" | tr '\t' '\n' | while read role; do
            if [ -n "$role" ]; then
              echo "- \`$role\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
