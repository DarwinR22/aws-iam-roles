name: 🤖 Auto-Generate IAM Terraform

# Prevent multiple workflows running simultaneously to avoid state lock conflicts
# Note: cancel-in-progress disabled to avoid orphaned Terraform state locks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Grant special permissions to GITHUB_TOKEN (Fixed dependencies)
permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write  # Required for OIDC authentication with AWS

on:
  push:
    branches: [main, dev]
    paths: 
      - 'definitions/**'
      - 'generators/**'
      - 'templates/**'
      - '.github/workflows/**'
      - 'modules/**'
  
  pull_request:
    branches: [main]
    paths:
      - 'definitions/**'
  
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push to protected branch (admin only)'
        required: false
        default: false
        type: boolean

jobs:
  generate-and-validate:
    name: 🚀 Generate Terraform from YAML
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for OIDC authentication
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r generators/requirements.txt

    - name: 🔍 Validate YAML Definitions
      run: |
        echo "🔍 Validating YAML definitions..."
        python generators/generate_all.py --validate-only

    - name: 🛠️ Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 🏗️ Generate Terraform Files
      run: |
        echo "🏗️ Generating Terraform from YAML definitions..."
        python generators/generate_all.py --clean
        
        echo "📋 Generated files:"
        find generated -name "*.tf" -type f | head -10
        
        echo "🔍 Checking file sizes:"
        ls -la generated/
        
    - name: 📐 Format Generated Terraform
      run: |
        cd generated
        echo "📐 Applying terraform fmt to all generated files..."
        terraform fmt -recursive .
        echo "✅ Terraform fmt applied successfully"

    - name: 🔧 Terraform Format Check
      run: |
        cd generated
        echo "🔍 Checking if files are properly formatted..."
        echo "📁 Files in generated directory:"
        find . -name "*.tf" -exec echo "  {}" \;
        
        echo "🔧 Running terraform fmt -check..."
        if terraform fmt -check=true -recursive .; then
          echo "✅ All files are properly formatted"
        else
          echo "❌ Some files need formatting. Files that need formatting:"
          terraform fmt -check=true -recursive . 2>&1 || true
          echo "🔧 Applying format automatically..."
          terraform fmt -recursive .
          echo "✅ Format applied. Re-checking..."
          terraform fmt -check=true -recursive .
        fi

    - name: 📝 Terraform Validate
      run: |
        cd generated  
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate"
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        terraform validate

    - name: 📋 Terraform Plan Preview
      id: plan
      run: |
        cd generated
        echo "## 🗂️ Terraform Plan Preview" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 What would be deployed:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Show generated files count
        echo "📁 Generated files: $(find . -name '*.tf' | wc -l) Terraform files" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run terraform plan with clean output formatting
        echo "🔍 Running Terraform Plan..."
        echo '```terraform' >> $GITHUB_STEP_SUMMARY
        
        # Capture plan output with proper formatting and console display
        if terraform plan -no-color -input=false 2>&1 | tee plan_output.txt; then
          echo "✅ Terraform plan completed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Terraform plan encountered issues - check details below" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Parse and format plan output for summary
        if grep -q "No changes" plan_output.txt; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ No changes detected - infrastructure is up to date" >> $GITHUB_STEP_SUMMARY
        elif grep -q "Plan:" plan_output.txt; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "� Plan Summary:" >> $GITHUB_STEP_SUMMARY
          grep "Plan:" plan_output.txt | tail -1 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Resource Changes Preview:" >> $GITHUB_STEP_SUMMARY
          # Show key sections of the plan
          grep -A 15 "Terraform will perform the following actions:" plan_output.txt | head -15 >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Plan Output Preview:" >> $GITHUB_STEP_SUMMARY
          head -20 plan_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo "..." >> $GITHUB_STEP_SUMMARY
          tail -10 plan_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
        fi
        
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "💾 Full detailed plan available in artifacts for complete analysis" >> $GITHUB_STEP_SUMMARY
        echo "✅ Terraform syntax and structure validated successfully" >> $GITHUB_STEP_SUMMARY

    - name: 📤 Upload Terraform Plan for Analysis
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-analysis
        path: |
          generated/plan_output.txt
          generated/*.tf
        retention-days: 7

    - name: 📊 Check for Changes
      id: changes
      run: |
        git config --global user.name "🤖 IAM Generator Bot"
        git config --global user.email "iam-generator@mci.com"
        
        if [[ -n $(git status --porcelain generated/) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "📝 Generated files have changes"
        else
          echo "changes=false" >> $GITHUB_OUTPUT  
          echo "✅ No changes in generated files"
        fi

    - name: 🚀 Commit Generated Files
      if: steps.changes.outputs.changes == 'true' && github.event_name == 'push'
      run: |
        # Configure git with PAT token for branch protection bypass
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        
        git add generated/
        git commit -m "🤖 Auto-generate Terraform from definitions
        
        Generated from commit: ${{ github.sha }}
        Definitions changed in: ${{ github.event.head_commit.message }}
        
        Files updated:
        $(git diff --cached --name-only generated/)"
        
        git push origin ${{ github.ref_name }}

    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Get list of generated files
          const { execSync } = require('child_process');
          const changedFiles = execSync('git diff --name-only generated/ || true').toString().trim();
          
          if (changedFiles) {
            const comment = `## 🤖 IAM Terraform Generation Preview
            
            This PR will generate/update the following Terraform files:
            
            \`\`\`
            ${changedFiles}
            \`\`\`
            
            ### 📋 Validation Results:
            - ✅ YAML definitions are valid
            - ✅ Generated Terraform is properly formatted
            - ✅ Terraform validation passed
            
            Once merged, these files will be automatically committed to the repository.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  terraform-plan:
    name: 📋 Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Plan
      run: |
        cd generated
        echo "🔍 Generating execution plan..."
        echo "================================================"
        
        # Create plan with detailed output
        terraform plan -out=tfplan -input=false
        
        echo "================================================"
        echo "📋 Plan Summary:"
        terraform show -no-color tfplan | head -50
        echo "..."
        echo "================================================"
        echo "✅ Plan generated successfully and saved as tfplan"
        
    - name: 📊 Upload Plan and State
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-and-state
        path: |
          generated/tfplan
          generated/.terraform/
          generated/terraform.tfstate*

  terraform-apply:
    name: 🚀 Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/dev'
    environment: 
      name: dev
      url: https://console.aws.amazon.com/iam/
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 📥 Download Plan and State
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-and-state
        path: generated/

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Apply
      run: |
        cd generated
        echo "🔍 Validating plan..."
        terraform show tfplan
        echo ""
        echo "🚀 Applying plan..."
        terraform apply tfplan
        
    - name: 📋 Show Final State
      run: |
        cd generated
        echo "📋 Final Terraform State:"
        terraform show


