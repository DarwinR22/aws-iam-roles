name: Auto-Generate IAM Terraform

# Grant special permissions to GITHUB_TOKEN
permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write  # Required for OIDC authentication with AWS

on:
  push:
    branches: [main, dev]
    paths:
      - 'definitions/**'
      - 'generators/**'
      - 'templates/**'

  pull_request:
    branches: [main]
    paths:
      - 'definitions/**'

  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push to protected branch (admin only)'
        required: false
        default: false
        type: boolean

jobs:
  generate-and-validate:
    name: Generate Terraform from YAML
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate YAML Definitions
      run: |
        echo "Validating YAML definitions..."
        python generators/generate_all.py --validate-only

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Generate Terraform Files
      run: |
        echo "Generating Terraform from YAML definitions..."
        python generators/generate_all.py

        echo "Generated files:"
        find generated -name "*.tf" -type f | head -10 || echo "No .tf files found"

        echo "Checking file sizes:"
        ls -la generated/ || echo "Generated directory not found"

    - name: Format Generated Terraform
      run: |
        cd generated
        echo "Applying terraform fmt to all generated files..."
        terraform fmt -recursive .
        echo "Terraform fmt applied successfully"

    - name: Terraform Format Check
      run: |
        cd generated
        echo "Checking if files are properly formatted..."
        echo "Files in generated directory:"
        find . -name "*.tf" -exec echo "  {}" \; || echo "No .tf files found"

        echo "Running terraform fmt -check..."
        if terraform fmt -check=true -recursive .; then
          echo "All files are properly formatted"
        else
          echo "Some files need formatting. Applying format automatically..."
          terraform fmt -recursive .
          echo "Format applied. Re-checking..."
          terraform fmt -check=true -recursive .
        fi

    - name: Validate Terraform Syntax
      run: |
        cd generated
        echo "Initializing terraform for syntax validation..."
        terraform init -backend=false
        echo "Running terraform validate..."
        terraform validate

    - name: Commit Generated Files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add generated/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate Terraform from definitions"
          
          # Use PAT if available for protected branches, otherwise use GITHUB_TOKEN
          if [ "${{ secrets.PAT_TOKEN }}" != "" ]; then
            git push origin ${{ github.ref_name }}
          else
            git push
          fi
        fi