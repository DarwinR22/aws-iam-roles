name: 🤖 Auto-Generate IAM Terraform

# Grant special permissions to GITHUB_TOKEN
permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write  # Required for OIDC authentication with AWS

on:
  push:
    branches: [main, dev]
    paths: 
      - 'definitions/**'
      - 'generators/**'
      - 'templates/**'
  
  pull_request:
    branches: [main]
    paths:
      - 'definitions/**'
  
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push to protected branch (admin only)'
        required: false
        default: false
        type: boolean

jobs:
  generate-and-validate:
    name: 🚀 Generate Terraform from YAML
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for OIDC authentication
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r generators/requirements.txt

    - name: 🔍 Validate YAML Definitions
      run: |
        echo "🔍 Validating YAML definitions..."
        python generators/generate_all.py --validate-only

    - name: 🛠️ Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 🏗️ Generate Terraform Files
      run: |
        echo "🏗️ Generating Terraform from YAML definitions..."
        python generators/generate_all.py --clean
        
        echo "📋 Generated files:"
        find generated -name "*.tf" -type f | head -10
        
        echo "🔍 Checking file sizes:"
        ls -la generated/
        
    - name: 📐 Format Generated Terraform
      run: |
        cd generated
        echo "📐 Applying terraform fmt to all generated files..."
        terraform fmt -recursive .
        echo "✅ Terraform fmt applied successfully"

    - name: 🔧 Terraform Format Check
      run: |
        cd generated
        echo "🔍 Checking if files are properly formatted..."
        echo "📁 Files in generated directory:"
        find . -name "*.tf" -exec echo "  {}" \;
        
        echo "🔧 Running terraform fmt -check..."
        if terraform fmt -check=true -recursive .; then
          echo "✅ All files are properly formatted"
        else
          echo "❌ Some files need formatting. Files that need formatting:"
          terraform fmt -check=true -recursive . 2>&1 || true
          echo "🔧 Applying format automatically..."
          terraform fmt -recursive .
          echo "✅ Format applied. Re-checking..."
          terraform fmt -check=true -recursive .
        fi

    - name: 📝 Terraform Validate
      run: |
        cd generated  
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate"
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        terraform validate

    - name: � Terraform Plan Preview
      id: plan
      run: |
        echo "## 🗂️ Terraform Plan Preview" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 What would be deployed:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cd generated
        echo '```hcl' >> $GITHUB_STEP_SUMMARY
        terraform plan -no-color -input=false 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || echo "⚠️ Plan requires AWS credentials - showing validation only" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Terraform syntax and structure validated successfully" >> $GITHUB_STEP_SUMMARY

    - name: �📊 Check for Changes
      id: changes
      run: |
        git config --global user.name "🤖 IAM Generator Bot"
        git config --global user.email "iam-generator@mci.com"
        
        if [[ -n $(git status --porcelain generated/) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "📝 Generated files have changes"
        else
          echo "changes=false" >> $GITHUB_OUTPUT  
          echo "✅ No changes in generated files"
        fi

    - name: 🚀 Commit Generated Files
      if: steps.changes.outputs.changes == 'true' && github.event_name == 'push'
      run: |
        # Configure git with PAT token for branch protection bypass
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        
        git add generated/
        git commit -m "🤖 Auto-generate Terraform from definitions
        
        Generated from commit: ${{ github.sha }}
        Definitions changed in: ${{ github.event.head_commit.message }}
        
        Files updated:
        $(git diff --cached --name-only generated/)"
        
        git push origin ${{ github.ref_name }}

    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Get list of generated files
          const { execSync } = require('child_process');
          const changedFiles = execSync('git diff --name-only generated/ || true').toString().trim();
          
          if (changedFiles) {
            const comment = `## 🤖 IAM Terraform Generation Preview
            
            This PR will generate/update the following Terraform files:
            
            \`\`\`
            ${changedFiles}
            \`\`\`
            
            ### 📋 Validation Results:
            - ✅ YAML definitions are valid
            - ✅ Generated Terraform is properly formatted
            - ✅ Terraform validation passed
            
            Once merged, these files will be automatically committed to the repository.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  terraform-plan:
    name: 📋 Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Plan
      run: |
        cd generated
        terraform plan -out=tfplan
        
    - name: 📊 Upload Plan and State
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-and-state
        path: |
          generated/tfplan
          generated/.terraform/
          generated/terraform.tfstate*

  terraform-apply:
    name: 🚀 Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/dev'
    environment: 
      name: dev
      url: https://console.aws.amazon.com/iam/
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 📥 Download Plan and State
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-and-state
        path: generated/

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Apply
      run: |
        cd generated
        echo "🔍 Validating plan..."
        terraform show tfplan
        echo ""
        echo "🚀 Applying plan..."
        terraform apply tfplan
        
    - name: 📋 Show Final State
      run: |
        cd generated
        echo "📋 Final Terraform State:"
        terraform show

  # Cleanup old policies with incorrect naming
  cleanup-old-policies:
    name: 🧹 Cleanup Old IAM Policies
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    if: github.ref == 'refs/heads/dev' && needs.terraform-apply.result == 'success'
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🛠️ Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 🔍 Discover Old Policies
      id: discover
      run: |
        echo "🔍 Searching for old policies with incorrect naming..."
        
        # Find policies with old naming pattern (with random suffixes)
        OLD_POLICIES=$(aws iam list-policies --query "Policies[?starts_with(PolicyName, 'githubactions-')].{Name:PolicyName,Arn:Arn}" --output json | jq -r '.[] | select(.Name | test("githubactions-(basepermissions|iammanagement|terraformbackend)-[0-9]+")) | .Name')
        
        echo "📋 Found old policies:"
        echo "$OLD_POLICIES"
        
        # Save to output
        echo "old_policies<<EOF" >> $GITHUB_OUTPUT
        echo "$OLD_POLICIES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Count policies
        POLICY_COUNT=$(echo "$OLD_POLICIES" | grep -c . || echo "0")
        echo "policy_count=$POLICY_COUNT" >> $GITHUB_OUTPUT

    - name: 🗑️ Delete Old Policies
      if: steps.discover.outputs.policy_count != '0'
      run: |
        echo "🗑️ Deleting old policies with incorrect naming..."
        
        # Read the old policies
        OLD_POLICIES="${{ steps.discover.outputs.old_policies }}"
        
        if [ -n "$OLD_POLICIES" ]; then
          echo "$OLD_POLICIES" | while read -r policy_name; do
            if [ -n "$policy_name" ]; then
              echo "🗑️ Deleting policy: $policy_name"
              
              # Get policy ARN
              POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='$policy_name'].Arn" --output text)
              
              if [ -n "$POLICY_ARN" ]; then
                # Check if policy is attached to any roles
                ATTACHED_ROLES=$(aws iam list-entities-for-policy --policy-arn "$POLICY_ARN" --query "PolicyRoles[].RoleName" --output text)
                
                if [ -n "$ATTACHED_ROLES" ]; then
                  echo "⚠️  Policy $policy_name is attached to roles: $ATTACHED_ROLES"
                  echo "🔓 Detaching policy from roles..."
                  
                  for role in $ATTACHED_ROLES; do
                    echo "🔓 Detaching $policy_name from role $role"
                    aws iam detach-role-policy --role-name "$role" --policy-arn "$POLICY_ARN"
                  done
                fi
                
                echo "🗑️ Deleting policy: $POLICY_ARN"
                aws iam delete-policy --policy-arn "$POLICY_ARN"
                echo "✅ Deleted: $policy_name"
              else
                echo "❌ Could not find ARN for policy: $policy_name"
              fi
            fi
          done
        else
          echo "ℹ️ No old policies found to delete"
        fi

    - name: ✅ Cleanup Summary
      run: |
        echo "## 🧹 Cleanup Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Policies Processed:" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.discover.outputs.policy_count }}" != "0" ]; then
          echo "- 🗑️ Deleted ${{ steps.discover.outputs.policy_count }} old policies with incorrect naming" >> $GITHUB_STEP_SUMMARY
          echo "### Deleted Policies:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.discover.outputs.old_policies }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "- ℹ️ No old policies found to clean up" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "### Result:" >> $GITHUB_STEP_SUMMARY
        echo "✅ Cleanup completed successfully! Only MCI-prefixed policies remain." >> $GITHUB_STEP_SUMMARY
