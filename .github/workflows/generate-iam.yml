name: Auto-Generate IAM Terraform
# Updated: 2025-09-25 - Added push trigger and ready to test policy attachments

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

on:
  push:
    branches: [dev]
    paths:
      - 'definitions/**'
      - 'generators/**'
      - 'templates/**'
  
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Apply changes to AWS (requires approval)'
        required: false
        default: false
        type: boolean

jobs:
  generate-terraform:
    name: Generate Terraform from YAML
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Terraform Files
      run: |
        echo "Starting IAM generation..."
        python generators/generate_all.py
        
        echo "Generated files:"
        find generated/ -name "*.tf" 2>/dev/null || echo "No .tf files found"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Validate Terraform
      run: |
        cd generated
        terraform fmt -check -diff || (echo "Formatting files..." && terraform fmt -recursive)
        terraform init -backend=false
        terraform validate

    - name: Show Terraform Plan (dry-run)
      run: |
        cd generated
        echo "Terraform plan (without AWS credentials):"
        terraform plan -out=plan.out 2>&1 || echo "Plan completed with expected credential warnings"

    - name: Commit Generated Files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add generated/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate Terraform from definitions"
          git push
        fi