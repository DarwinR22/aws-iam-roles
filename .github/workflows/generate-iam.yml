name: 🤖 Auto-Generate IAM Terraform

# Prevent multiple workflows running simultaneously to avoid state lock conflicts
# Note: cancel-in-progress disabled to avoid orphaned Terraform state locks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Grant special permissions to GITHUB_TOKEN (Fixed dependencies)
permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write  # Required for OIDC authentication with AWS

on:
  push:
    branches: [main, dev]
    paths: 
      - 'definitions/**'
      - 'generators/**'
      - 'templates/**'
      - '.github/workflows/**'
      - 'modules/**'
  
  pull_request:
    branches: [main]
    paths:
      - 'definitions/**'
  
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push to protected branch (admin only)'
        required: false
        default: false
        type: boolean

jobs:
  generate-and-validate:
    name: 🚀 Generate Terraform from YAML
    runs-on: ubuntu-latest
    
    # Disable verbose debug output to prevent encoded character display
    env:
      TF_LOG: ""                    # Disable terraform verbose logging
      TF_LOG_CORE: ""              # Disable terraform core logging  
      TF_LOG_PROVIDER: ""          # Disable provider logging
      RUNNER_DEBUG: "0"            # Disable GitHub Actions debug output
      ACTIONS_RUNNER_DEBUG: "0"    # Disable runner debug mode
      ACTIONS_STEP_DEBUG: "0"      # Disable step debug mode
    
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for OIDC authentication
    
    steps:
    - name: � Ensure repository up-to-date (fast-forward only)
      if: github.event_name == 'push'
      run: |
        echo "🔄 Syncing before changes..."
        git fetch origin ${GITHUB_REF_NAME}
        # Intento FF-only; si falla, abortar con mensaje claro
        if git merge-base --is-ancestor origin/${GITHUB_REF_NAME} ${GITHUB_REF_NAME}; then
          echo "✅ Local already ahead or equal; continuing"
        else
          echo "Intentando fast-forward..."
          if git pull --ff-only origin ${GITHUB_REF_NAME}; then
            echo "✅ Fast-forward aplicado"
          else
            echo "❌ No se pudo fast-forward (historial divergente). Rebase manual requerido." >&2
            exit 1
          fi
        fi
        echo "Estado después de sync:" 
        git --no-pager log --oneline -5
    - name: �📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r generators/requirements.txt

    - name: 🔍 Validate YAML Definitions
      run: |
        echo "🔍 Validating YAML definitions..."
        python generators/generate_all.py --validate-only

    - name: 🛠️ Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 🏗️ Generate Terraform Files
      run: |
        echo "🏗️ Generating Terraform from YAML definitions..."
        python generators/generate_all.py --clean
        
        echo "📋 Generated files:"
        find generated -name "*.tf" -type f | head -10
        
        echo "🔍 Checking file sizes:"
        ls -la generated/
        
    - name: 📐 Format Generated Terraform
      run: |
        cd generated
        echo "📐 Applying terraform fmt to all generated files..."
        terraform fmt -recursive .
        echo "✅ Terraform fmt applied successfully"

    - name: 🔧 Terraform Format Check
      run: |
        cd generated
        echo "🔍 Checking if files are properly formatted..."
        echo "📁 Files in generated directory:"
        find . -name "*.tf" -exec echo "  {}" \;
        
        echo "🔧 Running terraform fmt -check..."
        if terraform fmt -check=true -recursive .; then
          echo "✅ All files are properly formatted"
        else
          echo "❌ Some files need formatting. Files that need formatting:"
          terraform fmt -check=true -recursive . 2>&1 || true
          echo "🔧 Applying format automatically..."
          terraform fmt -recursive .
          echo "✅ Format applied. Re-checking..."
          terraform fmt -check=true -recursive .
        fi

    - name: 📝 Terraform Validate
      run: |
        cd generated  
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate"
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        terraform validate

    - name: 📋 Terraform Plan Preview
      id: plan
      run: |
        cd generated
        echo "## 🗂️ Terraform Plan Preview" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Run terraform plan (raw capture)
        echo "🔍 Running Terraform Plan..."
        TF_LOG="" TF_LOG_CORE="" TF_LOG_PROVIDER="" terraform plan -no-color -input=false > plan_raw.txt 2>/dev/null || true

        # Sanear salida básica
        grep -v "::debug::" plan_raw.txt | grep -v "%0A" | grep -v "^data\." | grep -v "^module\." | sed 's/%0A/\n/g' > plan_output.txt || true

        # Extraer totales (soportar formatos con y sin prefijo 'Plan:')
        plan_line=$(grep -E "^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\." plan_output.txt | tail -1 || true)
        counts_line=$(grep -E "^[0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.$" plan_output.txt | tail -1 || true)
        if [ -n "$plan_line" ]; then
          plan_display="${plan_line}"  # ya incluye 'Plan:'
        elif [ -n "$counts_line" ]; then
          plan_display="Plan: ${counts_line}"
        elif grep -q "No changes" plan_output.txt; then
          plan_display="Plan: 0 to add, 0 to change, 0 to destroy."
        else
          plan_display=""
        fi

        echo "### 📊 Totales" >> $GITHUB_STEP_SUMMARY
        if [ -n "$plan_display" ]; then
          echo "**$plan_display**" >> $GITHUB_STEP_SUMMARY
        else
          echo "No se detectaron totales (posible error de plan)." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        # Conteo de archivos generados
        echo "📁 Generated files: $(find . -name '*.tf' | wc -l) Terraform files" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Bloque de acciones
        if grep -q "Terraform will perform the following actions:" plan_output.txt; then
          awk '/Terraform will perform the following actions:/{flag=1;next}/^[0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.$/{flag=0}flag' plan_output.txt > plan_actions_block.txt || true
        else
          : > plan_actions_block.txt
        fi

        # Línea recurso -> acción normalizada
        # Mapear textos terraform a create/update/replace/destroy
        awk '/^ *# / && / will be / {print $0}' plan_output.txt | sed 's/^ *# //' > plan_changes_full.tmp || true
        : > plan_change_types.txt
        while IFS= read -r line; do
          recurso=$(echo "$line" | sed 's/ will be .*//')
          accion_raw=$(echo "$line" | sed 's/.* will be //')
          accion="$(echo "$accion_raw" | awk '{print $1$2$3$4$5}')" # fallback
          if echo "$accion_raw" | grep -q "created"; then accion="create"; fi
          if echo "$accion_raw" | grep -q "updated in-place"; then accion="update"; fi
          if echo "$accion_raw" | grep -q "destroyed"; then accion="destroy"; fi
          if echo "$accion_raw" | grep -q "replaced"; then accion="replace"; fi
          echo "$recurso -> $accion" >> plan_change_types.txt
        done < plan_changes_full.tmp

        # Agrupar por acción
        for a in create update replace destroy; do
          grep " -> $a$" plan_change_types.txt | sed "s/ -> $a$//" > "group_$a.txt" || true
        done

        # Tabla resumen (máx 40 filas)
        echo "### 🧩 Tabla de cambios por recurso" >> $GITHUB_STEP_SUMMARY
        echo "Leyenda: ➕ create | 🛠 update | ♻ replace | ❌ destroy" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Recurso | Acción |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        head -40 plan_change_types.txt | while IFS='->' read -r res act; do
          r=$(echo "$res" | xargs); a=$(echo "$act" | xargs | sed 's/^>* *//')
          case "$a" in
            create) icon="➕" ;;
            update) icon="🛠" ;;
            replace) icon="♻" ;;
            destroy) icon="❌" ;;
            *) icon="" ;;
          esac
          [ -n "$r" ] && [ -n "$a" ] && echo "| $r | $icon $a |" >> $GITHUB_STEP_SUMMARY
        done
        total_lines=$(wc -l < plan_change_types.txt 2>/dev/null || echo 0)
        if [ "$total_lines" -gt 40 ]; then
          echo "_(Truncado a 40 de $total_lines recursos)_" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        # Listas por categoría
        echo "### 📦 Cambios por tipo" >> $GITHUB_STEP_SUMMARY
        for a in create update replace destroy; do
          count=$(grep -c " -> $a$" plan_change_types.txt 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "#### $a ($count)" >> $GITHUB_STEP_SUMMARY
            grep " -> $a$" plan_change_types.txt | sed "s/ -> $a$//" | head -30 | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
            if [ "$count" -gt 30 ]; then
              echo "- ... (truncado, ver artefacto plan_change_types.txt)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        done

        # Extraer diffs de atributos (~, +, -) dentro del bloque de acciones (más flexible)
        : > plan_attribute_changes.txt
        if [ -s plan_actions_block.txt ]; then
          # Captura líneas con símbolo diff al inicio tras espacios
          grep -E '^[[:space:]]*[~+\-]' plan_actions_block.txt > plan_attribute_changes.txt || true
        fi

        if [ -s plan_attribute_changes.txt ]; then
          # Analizar y construir tabla contextual path|before|after
          : > attr_changes_parsed.tmp
          awk '
            BEGIN { ctx="" }
            /tags_all = \{/ { ctx="tags_all" }
            /tags = \{/ && $0 !~ /tags_all/ { ctx="tags" }
            /^}/ { ctx="" }
            /->/ {
              line=$0
              # eliminar prefijo símbolos dif
              gsub(/^[ \t~+\-]+/, "", line)
              # intentar key="..." -> "..."
              if (match(line, /^"[^"]+"/)) {
                key=substr(line, RSTART+1, RLENGTH-2)
                before=""; after=""
                if (match(line, /= "[^"]*" -> "[^"]*"/)) {
                  segment=substr(line, RSTART+3, RLENGTH-3)
                  split(segment, parts, " -> ")
                  if (length(parts)==2) {
                    before=parts[1]; after=parts[2]
                    gsub(/^[" ]+|[" ]+$/, "", before)
                    gsub(/^[" ]+|[" ]+$/, "", after)
                  }
                }
                path=key
                if (ctx=="tags" || ctx=="tags_all") { path=ctx "[\"" key "\"]" }
                if (after!="") { print path "|" before "|" after }
              }
            }
          ' plan_actions_block.txt > attr_changes_parsed.tmp 2>/dev/null || true

          total_attr_lines=$(wc -l < plan_attribute_changes.txt || echo 0)
          only_generated=false
          if [ -s attr_changes_parsed.tmp ]; then
            non_generated_paths=$(grep -v 'Generated' attr_changes_parsed.tmp | wc -l | xargs || echo 0)
            total_paths=$(wc -l < attr_changes_parsed.tmp | xargs || echo 0)
            if [ "$total_paths" != "0" ] && [ "$non_generated_paths" = "0" ]; then
              only_generated=true
            fi
          fi

          echo "### 🔍 Atributos cambiados" >> $GITHUB_STEP_SUMMARY
          if [ "$only_generated" = true ]; then
            echo "ℹ️ Solo cambió el timestamp generado automáticamente (tags[\"Generated\"])." >> $GITHUB_STEP_SUMMARY
            echo "No hay impacto funcional. Puedes ignorarlo o aplicar lifecycle ignore_changes." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

            # Mostrar diff crudo (truncado)
          echo "#### Diff (crudo)" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`diff' >> $GITHUB_STEP_SUMMARY
          if [ "$only_generated" = true ]; then
            grep 'Generated' plan_attribute_changes.txt | head -10 >> $GITHUB_STEP_SUMMARY || true
          else
            # Priorizar líneas con ->
            grep '->' plan_attribute_changes.txt | head -60 >> $GITHUB_STEP_SUMMARY || head -60 plan_attribute_changes.txt
          fi
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Tabla parsed
          if [ -s attr_changes_parsed.tmp ]; then
            echo "#### Tabla de valores (parsed)" >> $GITHUB_STEP_SUMMARY
            echo "| Atributo | Antes | Después |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            head -25 attr_changes_parsed.tmp | while IFS='|' read -r path before after; do
              b_esc=$(echo "$before" | sed 's/|/\\|/g')
              a_esc=$(echo "$after" | sed 's/|/\\|/g')
              echo "| $path | ${b_esc:--} | $a_esc |" >> $GITHUB_STEP_SUMMARY
            done
            total_parsed=$(wc -l < attr_changes_parsed.tmp | xargs || echo 0)
            if [ "$total_parsed" -gt 25 ]; then
              echo "_(Truncado a 25 de $total_parsed cambios de atributos)_" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Recomendación ignore_changes si solo Generated se modifica
          if [ "$only_generated" = true ]; then
            echo "> Sugerencia: añadir en el recurso terraform ->\n> lifecycle { ignore_changes = [ tags[\"Generated\"], tags_all[\"Generated\"] ] }" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        # Extracto del plan completo (truncado) para referencia
        if [ -s plan_actions_block.txt ]; then
          echo "### 🧪 Extracto del plan (truncado)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`terraform' >> $GITHUB_STEP_SUMMARY
          head -100 plan_actions_block.txt >> $GITHUB_STEP_SUMMARY || true
          pl=$(wc -l < plan_actions_block.txt || echo 0)
          if [ "$pl" -gt 100 ]; then
            echo "... ($pl líneas en total, truncado a 100)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          # Bloque colapsable más extenso
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>📜 Ver más (hasta 400 líneas del plan completo)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '\n\n\`\`\`terraform' >> $GITHUB_STEP_SUMMARY
          head -400 plan_actions_block.txt >> $GITHUB_STEP_SUMMARY || true
          if [ "$pl" -gt 400 ]; then
            echo "... ($pl líneas en total, truncado a 400)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        fi

        # Mensaje si no hay cambios
        if grep -q "No changes" plan_output.txt; then
          echo "✅ No hay cambios en la infraestructura" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload Terraform Plan for Analysis
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-analysis
        path: |
          generated/plan_output.txt
          generated/plan_raw.txt
          generated/plan_actions_block.txt
          generated/plan_changes_list.txt
          generated/plan_change_types.txt
          generated/plan_attribute_changes.txt
          generated/*.tf
        retention-days: 7

    - name: 📊 Check for Changes
      id: changes
      run: |
        git config --global user.name "🤖 IAM Generator Bot"
        git config --global user.email "iam-generator@mci.com"
        
        if [[ -n $(git status --porcelain generated/) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "📝 Generated files have changes"
        else
          echo "changes=false" >> $GITHUB_OUTPUT  
          echo "✅ No changes in generated files"
        fi

    - name: 🚀 Commit Generated Files
      if: steps.changes.outputs.changes == 'true' && github.event_name == 'push'
      run: |
        # Configure git with PAT token for branch protection bypass
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        
        git add generated/
        git commit -m "🤖 Auto-generate Terraform from definitions
        
        Generated from commit: ${{ github.sha }}
        Definitions changed in: ${{ github.event.head_commit.message }}
        
        Files updated:
        $(git diff --cached --name-only generated/)"
        
        git push origin ${{ github.ref_name }}

    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Get list of generated files
          const { execSync } = require('child_process');
          const changedFiles = execSync('git diff --name-only generated/ || true').toString().trim();
          
          if (changedFiles) {
            const comment = `## 🤖 IAM Terraform Generation Preview
            
            This PR will generate/update the following Terraform files:
            
            \`\`\`
            ${changedFiles}
            \`\`\`
            
            ### 📋 Validation Results:
            - ✅ YAML definitions are valid
            - ✅ Generated Terraform is properly formatted
            - ✅ Terraform validation passed
            
            Once merged, these files will be automatically committed to the repository.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  terraform-plan:
    name: 📋 Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: github.ref == 'refs/heads/dev'
    
    env:
      TF_LOG: ""           # Disable terraform logging to prevent debug output
      TF_LOG_CORE: ""      # Disable core terraform logging
      TF_LOG_PROVIDER: ""  # Disable provider logging
      RUNNER_DEBUG: "0"    # Disable GitHub Actions debug output
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Plan
      run: |
        cd generated
        echo "🔍 Generating execution plan..."
        echo "================================================"
        
        # Create plan with clean output (prevent encoded characters in logs)
        echo "Running terraform plan..."
        {
          terraform plan -out=tfplan -input=false -no-color
        } > plan_detailed.log 2>&1
        
        echo "================================================"
        echo "📋 Plan Results Summary:"
        
        # Parse plan results
        if grep -q "No changes" plan_detailed.log; then
          echo "✅ No changes detected - infrastructure is up to date"
        elif grep -q "Plan:" plan_detailed.log; then
          grep "Plan:" plan_detailed.log | tail -1
          echo ""
          echo "📋 Key Changes:"
          grep -A 10 "Terraform will perform the following actions:" plan_detailed.log | head -10 || echo "No detailed changes found"
        fi
        
        echo "================================================"
        echo "✅ Plan generated successfully and saved as tfplan"
        echo "📁 Full plan details saved in plan_detailed.log artifact"
        
    - name: 📊 Upload Plan and State
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-and-state
        path: |
          generated/tfplan
          generated/plan_detailed.log
          generated/.terraform/
          generated/terraform.tfstate*

  terraform-apply:
    name: 🚀 Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/dev'
    environment: 
      name: dev
      url: https://console.aws.amazon.com/iam/
    
    env:
      TF_LOG: ""           # Disable terraform logging to prevent debug output
      TF_LOG_CORE: ""      # Disable core terraform logging  
      TF_LOG_PROVIDER: ""  # Disable provider logging
      RUNNER_DEBUG: "0"    # Disable GitHub Actions debug output
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: 📥 Download Plan and State
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-and-state
        path: generated/

    - name: � Import Existing Resources
      run: |
        cd generated
        
        # Configure Terraform backend for state management
        cat > backend.tf << EOF
        terraform {
          backend "s3" {
            bucket         = "s3-data-analytics-dev-tfstate-datalake"
            key            = "iam-management/terraform.tfstate" 
            region         = "us-east-1"
            dynamodb_table = "dynamodb-db-dev-terraform-lock"
            encrypt        = true
          }
        }
        EOF
        
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # Try to import the IAM role if it exists
        echo "📦 Attempting to import existing IAM role..."
        terraform import aws_iam_role.github_actions_iam_deployment_role github-actions-iam-deployment-role || true
        
        echo "✅ Import process completed"

    - name: 🚀 Terraform Apply
      run: |
        cd generated
        echo "🔍 Validating plan..."
        terraform show tfplan
        echo ""
        echo "🚀 Applying plan..."
        terraform apply tfplan
        
    - name: 📋 Show Final State
      run: |
        cd generated
        echo "📋 Final Terraform State:"
        terraform show


