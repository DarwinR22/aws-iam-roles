name: Deploy IAM Resources

on:
  push:
    branches: [dev, qa, main]
    paths:
      - '**/*.json'
      - '**/*.tf'
      - '**/*.tfvars'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 jsonschema

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ github.event.inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              "dev") environment="dev" ;;
              "qa") environment="qa" ;;
              "main") environment="prod" ;;
              *) environment="dev" ;;
            esac
          fi
          
          echo "environment=$environment" >> $GITHUB_OUTPUT
          echo "Target Environment: $environment"

      - name: Validate Role Configurations
        run: |
          echo "Validating role configurations..."
          find gerencias -name "*.json" -type f ! -name "policy-*.json" 2>/dev/null || true

      - name: Validate Policies
        run: |
          echo "Validating policies..."
          find politicas -name "*.json" -type f 2>/dev/null || true

      - name: Terraform Format Check
        run: terraform fmt -check=true -recursive .

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref_name == 'dev' || github.ref_name == 'qa' || github.ref_name == 'main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Plan-${{ github.run_id }}

      - name: Terraform Plan
        run: |
          cd environments/dev
          
          # Initialize Terraform with clean state
          terraform init -reconfigure \
            -backend-config="bucket=s3-data-analytics-raw-dev-tfstate" \
            -backend-config="key=iam/dev/terraform.tfstate" \
            -backend-config="region=us-east-1"
          
          terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/tfplan

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, plan]
    if: github.ref_name == 'dev' || github.ref_name == 'qa' || github.ref_name == 'main'
    environment: ${{ needs.validate.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/

      - name: Terraform Apply
        run: |
          cd environments/dev
          
          # Re-initialize with clean state for apply
          terraform init -reconfigure \
            -backend-config="bucket=s3-data-analytics-raw-dev-tfstate" \
            -backend-config="key=iam/dev/terraform.tfstate" \
            -backend-config="region=us-east-1"
          
          terraform apply -auto-approve tfplan

      - name: Verify Deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Environment: ${{ needs.validate.outputs.environment }}"
          echo "Timestamp: $(date)"
