name: 🚀 Deploy IAM Resources

on:
  workflow_run:
    workflows: ["🔍 Validate IAM Resources"]
    types:
      - completed
    branches: [dev, qa, main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      force_deploy:
        description: 'Force deployment (skip some validations)'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: "1.6.0"
  PYTHON_VERSION: "3.11"

jobs:
  determine-environment:
    name: 🎯 Determine Environment
    runs-on: ubuntu-latest
    # Solo ejecutar si la validación fue exitosa o es ejecución manual
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🎯 Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              "dev")
                environment="dev"
                ;;
              "qa")
                environment="qa"
                ;;
              "main")
                environment="prod"
                ;;
              *)
                environment=""
                ;;
            esac
          fi
          
          # Verificar si hay cambios que requieren deployment
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force_deploy }}" = "true" ]; then
            should_deploy="true"
          else
            # Verificar cambios en archivos relevantes: .tf, .tfvars, .json (roles y políticas)
            changed_files=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(tf|tfvars|json)$' | wc -l)
            if [ "$changed_files" -gt 0 ]; then
              should_deploy="true"
            else
              should_deploy="false"
            fi
          fi
          
          echo "environment=$environment" >> $GITHUB_OUTPUT
          echo "should_deploy=$should_deploy" >> $GITHUB_OUTPUT
          
          echo "🎯 Target Environment: $environment"
          echo "📦 Should Deploy: $should_deploy"

  pre-deployment-validation:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should_deploy == 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔍 Run Validations
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: 🔒 Additional Security Checks for PROD
        if: needs.determine-environment.outputs.environment == 'prod'
        run: |
          echo "🔒 Running additional security checks for PROD..."
          
          # Verificar que no haya roles con permisos excesivos
          python3 scripts/validate_iam.py --role-name "rol-test-any-prod-example" || true
          
          # Verificar que todos los roles tengan alcance SOX definido para prod
          find gerencias/ -name "*.tf" -exec grep -l "ambiente.*prod" {} \; | while read file; do
            if ! grep -q "alcance_sox" "$file"; then
              echo "❌ Archivo $file no define alcance_sox para ambiente prod"
              exit 1
            fi
          done

  deploy:
    name: 🚀 Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-environment, pre-deployment-validation]
    if: needs.determine-environment.outputs.should_deploy == 'true'
    environment: 
      name: ${{ needs.determine-environment.outputs.environment }}
      url: https://console.aws.amazon.com/iam/
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: 📁 Determine Deployment Directory
        id: deployment_dir
        run: |
          environment="${{ needs.determine-environment.outputs.environment }}"
          deployment_dir="environments/$environment"
          
          echo "deployment_dir=$deployment_dir" >> $GITHUB_OUTPUT
          echo "📁 Deployment directory: $deployment_dir"

      - name: 🚀 Deploy Resources
        id: deploy
        run: |
          environment="${{ needs.determine-environment.outputs.environment }}"
          deployment_dir="${{ steps.deployment_dir.outputs.deployment_dir }}"
          
          success_count=0
          error_count=0
          
          if [ -f "$deployment_dir/main.tf" ]; then
            echo "🚀 Deploying from: $deployment_dir"
            cd "$deployment_dir"
              echo "🚀 Deploying resources in: $dir"
              cd "$dir"
              
            # Configurar backend dinámicamente
            terraform init \
              -backend-config="bucket=${{ vars[format('TERRAFORM_STATE_BUCKET_{0}', needs.determine-environment.outputs.environment)] }}" \
              -backend-config="key=iam/$environment/terraform.tfstate" \
              -backend-config="region=${{ vars[format('AWS_REGION_{0}', needs.determine-environment.outputs.environment)] || 'us-east-1' }}"
            
            # Usar tfvars específico del ambiente
            tfvars_file="../$environment.tfvars"
            if [ -f "$tfvars_file" ]; then
              echo "📄 Using tfvars file: $tfvars_file"
              plan_args="-var-file=$tfvars_file"
              apply_args="-var-file=$tfvars_file"
            else
              echo "⚠️ No specific tfvars file found, using defaults"
              plan_args=""
              apply_args=""
            fi
            
            # Plan
            if terraform plan $plan_args -out=tfplan; then
              echo "✅ Plan successful for $deployment_dir"
              
              # Apply
              if terraform apply -auto-approve tfplan; then
                echo "✅ Apply successful for $deployment_dir"
                success_count=$((success_count + 1))
              else
                echo "❌ Apply failed for $deployment_dir"
                error_count=$((error_count + 1))
              fi
            else
              echo "❌ Plan failed for $deployment_dir"
              error_count=$((error_count + 1))
            fi
            
            cd - > /dev/null
          else
            echo "❌ No main.tf found in $deployment_dir"
            error_count=$((error_count + 1))
          fi
          
          echo "success_count=$success_count" >> $GITHUB_OUTPUT
          echo "error_count=$error_count" >> $GITHUB_OUTPUT
          
          if [ $error_count -gt 0 ]; then
            echo "❌ Deployment completed with errors"
            exit 1
          else
            echo "✅ Deployment completed successfully"
          fi

      - name: 📊 Generate Deployment Report
        if: always()
        run: |
          echo "## 🚀 Deployment Report - ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ needs.determine-environment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "### ✅ Deployment Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Successful deployments**: ${{ steps.deploy.outputs.success_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed deployments**: ${{ steps.deploy.outputs.error_count }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Deployed Directory" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.deployment_dir.outputs.deployment_dir }}" >> $GITHUB_STEP_SUMMARY

  post-deployment:
    name: 📋 Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    if: always() && needs.deploy.result == 'success'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', needs.determine-environment.outputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', needs.determine-environment.outputs.environment)] }}
          aws-region: ${{ vars[format('AWS_REGION_{0}', needs.determine-environment.outputs.environment)] || 'us-east-1' }}

      - name: 🏷️ Update Resource Tags
        run: |
          echo "🏷️ Updating deployment tags..."
          # Aquí se puede agregar lógica para actualizar tags de recursos desplegados
          # con información del deployment (fecha, commit, etc.)

      - name: 📊 Generate Infrastructure Inventory
        run: |
          echo "📊 Generating infrastructure inventory..."
          # Listar roles IAM creados
          aws iam list-roles --query 'Roles[?starts_with(RoleName, `rol-`)].{RoleName:RoleName,CreateDate:CreateDate}' --output table

      - name: 🔔 Send Notification
        if: needs.determine-environment.outputs.environment == 'prod'
        run: |
          echo "🔔 Sending deployment notification for PROD..."
          # Aquí se puede integrar con Slack, Teams, email, etc.
          echo "PROD deployment completed successfully at $(date)"
