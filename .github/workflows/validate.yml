name: 🔍 Validate IAM Resources

on:
  pull_request:
    branches: [ main, dev, qa, prod ]
    paths:
      - '**/*.json'          # Detecta cualquier JSON en cualquier carpeta
      - '**/*.tf'            # Detecta cualquier Terraform
      - '**/*.tfvars'        # Detecta variables Terraform
      - 'modules/**/*.tf'    # Módulos específicos
      - 'templates/**/*.tf'  # Plantillas específicas
  
  push:
    branches: [ main, dev, qa, prod ]
    paths:
      - '**/*.json'          # Detecta cualquier JSON en cualquier carpeta
      - '**/*.tf'            # Detecta cualquier Terraform
      - '**/*.tfvars'        # Detecta variables Terraform
      - 'modules/**/*.tf'    # Módulos específicos
      - 'templates/**/*.tf'  # Plantillas específicas

  workflow_dispatch:

env:
  TF_VERSION: "1.6.0"
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: 🔍 Validate Resources
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests jsonschema

      - name: 🔍 Find and Validate Role Configurations
        run: |
          echo "🔍 Buscando archivos de configuración de roles..."
          find . -name "*.json" -type f ! -name "policy-*.json" ! -path "./.git/*" ! -path "./node_modules/*" > role_configs.txt || true
          
          if [ -s role_configs.txt ]; then
            echo "📋 Archivos de roles encontrados:"
            cat role_configs.txt
            
            while read role_file; do
              echo "✅ Validando: $role_file"
              python scripts/validate_iam.py "$role_file"
            done < role_configs.txt
          else
            echo "ℹ️  No se encontraron archivos de configuración de roles"
          fi

      - name: 🔍 Find and Validate Policy Files
        run: |
          echo "🔍 Buscando archivos de políticas..."
          find . -name "policy-*.json" -type f ! -path "./.git/*" ! -path "./node_modules/*" > policy_files.txt || true
          
          if [ -s policy_files.txt ]; then
            echo "📋 Archivos de políticas encontrados:"
            cat policy_files.txt
            
            while read policy_file; do
              echo "✅ Validando política: $policy_file"
              python scripts/validate_policy.py "$policy_file"
            done < policy_files.txt
          else
            echo "ℹ️  No se encontraron archivos de políticas"
          fi
          
      - name: 🔍 Run IAM Validations
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: 🧪 Validate Terraform Format
        run: |
          terraform fmt -check=true -recursive .

      - name: 🔧 Validate Terraform Syntax
        run: |
          find . -name "*.tf" -exec dirname {} \; | sort -u | while read dir; do
            if [ -f "$dir/main.tf" ] || [ -f "$dir/variables.tf" ]; then
              echo "Validating Terraform in: $dir"
              cd "$dir"
              terraform init -backend=false
              terraform validate
              cd - > /dev/null
            fi
          done

      - name: 🏷️ Validate Tag Examples
        run: |
          python3 scripts/validate_iam.py --tags-file scripts/tag_examples.json .

      - name: 📋 Generate Validation Report
        if: always()
        run: |
          echo "## 📊 Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Repository Structure" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tree -d -L 3 . >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Modified Files" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(tf|tfvars)$' >> $GITHUB_STEP_SUMMARY || echo "No Terraform files modified" >> $GITHUB_STEP_SUMMARY
          else
            git diff --name-only HEAD~1 HEAD | grep -E '\.(tf|tfvars)$' >> $GITHUB_STEP_SUMMARY || echo "No Terraform files modified" >> $GITHUB_STEP_SUMMARY
          fi

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: reports/results.sarif
          quiet: true
          skip_check: CKV_AWS_1,CKV_AWS_8  # Skip checks that might not apply to IAM roles

      - name: 📤 Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: reports/results.sarif

      - name: 🔒 Run TFSec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  plan:
    name: 📋 Plan Changes
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.event_name == 'pull_request'
    
    strategy:
      matrix:
        environment: [dev, qa, prod]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', matrix.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', matrix.environment)] }}
          aws-region: ${{ vars[format('AWS_REGION_{0}', matrix.environment)] || 'us-east-1' }}

      - name: 📋 Terraform Plan
        id: plan
        run: |
          # Encontrar directorios modificados que contengan archivos .tf
          changed_dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.tf$' | xargs dirname | sort -u)
          
          for dir in $changed_dirs; do
            if [ -f "$dir/main.tf" ]; then
              echo "Planning changes in: $dir"
              cd "$dir"
              
              # Configurar backend dinámicamente
              terraform init \
                -backend-config="bucket=${{ vars[format('TERRAFORM_STATE_BUCKET_{0}', matrix.environment)] }}" \
                -backend-config="key=$dir/terraform.tfstate" \
                -backend-config="region=${{ vars[format('AWS_REGION_{0}', matrix.environment)] || 'us-east-1' }}"
              
              # Usar tfvars específico del ambiente si existe
              tfvars_file="${{ matrix.environment }}.tfvars"
              if [ -f "$tfvars_file" ]; then
                terraform plan -var-file="$tfvars_file" -out=tfplan
              else
                terraform plan -out=tfplan
              fi
              
              cd - > /dev/null
            fi
          done

      - name: 💬 Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Terraform Plan - ${{ matrix.environment }}')
            );
            
            const output = `## 📋 Terraform Plan - ${{ matrix.environment }}
            
            ### 🎯 Environment: \`${{ matrix.environment }}\`
            
            #### 📊 Plan Status: ${{ steps.plan.outcome }}
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }
