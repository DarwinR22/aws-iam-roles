# ===================
# TRUST POLICY TYPES
# ===================
trust_policies:
  lambda_service: "commons.lambda_service_trust"
  ecs_service: "commons.ecs_service_trust"
  glue_service: "commons.glue_service_trust"
  step_functions_service: "commons.step_functions_service_trust"

# ===================
# PERMISSION BOUNDARIES
# ===================
