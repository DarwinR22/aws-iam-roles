      Layer: "security"
      Dominio: "dataaccess"
      Subdominio: "s3"
      Aplicacion: "abacpolicies"
      Name: "MCI-S3-TagBased-ReadOnly"
      Soporte: "darwin.lopez@claro.com.gt"
      
