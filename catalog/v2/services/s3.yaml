# 📦 S3 ABAC Policies
# ===================
# Políticas para Amazon S3 con ABAC (Attribute-Based Access Control)
# ===================

service: "s3"
description: "Amazon S3 storage policies with tag-based access control"
category: "storage"
owner: "MCI Infrastructure Team"
sox_compliance: true

policies:
