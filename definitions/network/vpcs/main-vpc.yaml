vpc:
  name: "main-vpc"
  description: "VPC principal para la infraestructura"
  
  # Network configuration
  cidr_block: "10.0.0.0/16"
  instance_tenancy: "default"
  
  # DNS settings
  enable_dns_hostnames: true
  enable_dns_support: true
  
  # Subnets configuration
  subnets:
    # Public subnets
    - name: "public-subnet-1a"
      cidr_block: "10.0.1.0/24"
      availability_zone: "us-east-1a"
      type: "public"
      map_public_ip_on_launch: true
      
    - name: "public-subnet-1b"
      cidr_block: "10.0.2.0/24"
      availability_zone: "us-east-1b"
      type: "public"
      map_public_ip_on_launch: true
      
    # Private subnets
    - name: "private-subnet-1a"
      cidr_block: "10.0.10.0/24"
      availability_zone: "us-east-1a"
      type: "private"
      map_public_ip_on_launch: false
      
    - name: "private-subnet-1b"
      cidr_block: "10.0.20.0/24"
      availability_zone: "us-east-1b"
      type: "private"
      map_public_ip_on_launch: false
      
    # Database subnets
    - name: "db-subnet-1a"
      cidr_block: "10.0.50.0/24"
      availability_zone: "us-east-1a"
      type: "database"
      map_public_ip_on_launch: false
      
    - name: "db-subnet-1b"
      cidr_block: "10.0.60.0/24"
      availability_zone: "us-east-1b"
      type: "database"
      map_public_ip_on_launch: false

  # Internet Gateway
  internet_gateway:
    enabled: true
    name: "main-igw"
    
  # NAT Gateways
  nat_gateways:
    - name: "nat-gw-1a"
      subnet: "public-subnet-1a"  # References subnet name
      
  # Route Tables
  route_tables:
    - name: "public-rt"
      type: "public"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "internet_gateway"
          
    - name: "private-rt-1a"
      type: "private"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "nat_gateway"
          nat_gateway: "nat-gw-1a"

# Environment variables
variables:
  environment:
    description: "Environment name"
    type: "string"
    default: "dev"
    
  region:
    description: "AWS region"
    type: "string"
    default: "us-east-1"
    
  account_id:
    description: "AWS Account ID"
    type: "string"
    default: "051963532279"

# Deployment configuration
deployment:
  terraform:
    create_vpc_module: true
    create_subnet_modules: true
    include_route_tables: true
    
# Tags
tags:
  Environment: "dev"
  Project: "aws-iam-roles"
  ManagedBy: "Terraform"
  Owner: "DarwinLopez"
  Purpose: "NetworkInfrastructure"