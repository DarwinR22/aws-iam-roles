vpc:
  name: "sgsi-vpc-main"
  description: "VPC principal para Sistema de Gestión de Seguridad de la Información (SGSI)"
  
  # Network Configuration
  cidr_block: "10.0.0.0/16"
  instance_tenancy: "default"
  
  # DNS Settings (Requerido para Zero Trust)
  enable_dns_hostnames: true
  enable_dns_support: true
  
  # Subnets con Segmentación por Capas de Seguridad
  subnets:
    # ===========================================
    # DMZ TIER (Public Subnets) - 10.0.0.0/20
    # ===========================================
    - name: "dmz-public-1a"
      cidr_block: "10.0.1.0/24"
      availability_zone: "us-east-1a"
      type: "public"
      tier: "dmz"
      map_public_ip_on_launch: true
      
    - name: "dmz-public-1b"
      cidr_block: "10.0.2.0/24"
      availability_zone: "us-east-1b"
      type: "public"
      tier: "dmz"
      map_public_ip_on_launch: true
      
    - name: "dmz-public-1c"
      cidr_block: "10.0.3.0/24"
      availability_zone: "us-east-1c"
      type: "public"
      tier: "dmz"
      map_public_ip_on_launch: true

    # ===========================================
    # APPLICATION TIER (Private Subnets) - 10.0.16.0/20
    # ===========================================
    - name: "app-private-1a"
      cidr_block: "10.0.16.0/24"
      availability_zone: "us-east-1a"
      type: "private"
      tier: "application"
      map_public_ip_on_launch: false
      
    - name: "app-private-1b"
      cidr_block: "10.0.17.0/24"
      availability_zone: "us-east-1b"
      type: "private"
      tier: "application"
      map_public_ip_on_launch: false
      
    - name: "app-private-1c"
      cidr_block: "10.0.18.0/24"
      availability_zone: "us-east-1c"
      type: "private"
      tier: "application"
      map_public_ip_on_launch: false

    # ===========================================
    # DATABASE TIER (Private Subnets) - 10.0.32.0/20
    # ===========================================
    - name: "db-private-1a"
      cidr_block: "10.0.32.0/24"
      availability_zone: "us-east-1a"
      type: "private"
      tier: "database"
      map_public_ip_on_launch: false
      
    - name: "db-private-1b"
      cidr_block: "10.0.33.0/24"
      availability_zone: "us-east-1b"
      type: "private"
      tier: "database"
      map_public_ip_on_launch: false
      
    - name: "db-private-1c"
      cidr_block: "10.0.34.0/24"
      availability_zone: "us-east-1c"
      type: "private"
      tier: "database"
      map_public_ip_on_launch: false

    # ===========================================
    # MANAGEMENT TIER (Private Subnets) - 10.0.48.0/20
    # ===========================================
    - name: "mgmt-private-1a"
      cidr_block: "10.0.48.0/24"
      availability_zone: "us-east-1a"
      type: "private"
      tier: "management"
      map_public_ip_on_launch: false
      
    - name: "mgmt-private-1b"
      cidr_block: "10.0.49.0/24"
      availability_zone: "us-east-1b"
      type: "private"
      tier: "management"
      map_public_ip_on_launch: false

  # Internet Gateway para conectividad externa
  internet_gateway:
    enabled: true
    name: "sgsi-igw"
    
  # NAT Gateways para salida segura de subnets privadas
  nat_gateways:
    - name: "sgsi-nat-1a"
      subnet: "dmz-public-1a"
      
    - name: "sgsi-nat-1b"
      subnet: "dmz-public-1b"
      
  # Route Tables con principios Zero Trust
  route_tables:
    # Tabla para DMZ (acceso directo a Internet)
    - name: "dmz-route-table"
      type: "public"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "internet_gateway"
          
    # Tabla para Application Tier (salida vía NAT)
    - name: "app-route-table-1a"
      type: "private"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "nat_gateway"
          nat_gateway: "sgsi-nat-1a"
          
    - name: "app-route-table-1b"
      type: "private"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "nat_gateway"
          nat_gateway: "sgsi-nat-1b"
          
    # Tabla para Database Tier (sin salida a Internet)
    - name: "db-route-table"
      type: "isolated"
      routes: []  # Sin rutas externas por seguridad
      
    # Tabla para Management Tier (salida vía NAT específico)
    - name: "mgmt-route-table"
      type: "private"
      routes:
        - cidr_block: "0.0.0.0/0"
          gateway_type: "nat_gateway"
          nat_gateway: "sgsi-nat-1a"

  # VPC Flow Logs para monitoreo y compliance
  flow_logs:
    enabled: true
    traffic_type: "ALL"  # ACCEPT, REJECT, ALL
    log_destination_type: "cloud-watch-logs"
    log_group_name: "sgsi-vpc-flow-logs"
    retention_days: 365  # Para compliance ISO 27001

# Environment Variables
variables:
  environment:
    description: "Environment name for SGSI deployment"
    type: "string"
    default: "production"
    
  region:
    description: "AWS region for SGSI infrastructure"
    type: "string"
    default: "us-east-1"
    
  account_id:
    description: "AWS Account ID"
    type: "string"
    default: "051963532279"

# Deployment Configuration
deployment:
  terraform:
    create_vpc_module: true
    create_subnet_modules: true
    create_security_groups: true
    create_nacls: true
    enable_flow_logs: true
    
# Compliance and Security Tags (ISO 27001)
tags:
  # Identificación del Activo
  "AssetID": "NET-VPC-001"
  "AssetType": "Network-Infrastructure"
  "AssetOwner": "DarwinLopez"
  "DataClassification": "Internal"
  
  # Controles ISO 27001
  "ISO27001-Control": "A.13.1.1,A.13.1.2,A.13.2.1"
  "SecurityLevel": "High"
  "ComplianceScope": "ISO27001,NIST-CSF,ZeroTrust"
  
  # Gestión del Ciclo de Vida
  "Environment": "Production"
  "Project": "SGSI-Implementation"
  "CostCenter": "Security-Infrastructure"
  "MaintenanceWindow": "Sunday-2AM-6AM"
  
  # Contactos y Responsabilidades
  "TechnicalContact": "darwin.lopez@example.com"
  "SecurityContact": "security@example.com"
  "BusinessOwner": "SGSI-Team"
  
  # Operational
  "BackupRequired": "Yes"
  "MonitoringEnabled": "Yes"
  "LoggingEnabled": "Yes"
  "ChangeManagement": "ITIL-v4"