ec2_instances:
  name: "sgsi-web-servers"
  description: "Servidores web EC2 para Layer 3 del SGSI con alta disponibilidad en múltiples AZ"
  version: "1.0.0"
  
  # =========================================
  # LAUNCH TEMPLATE
  # =========================================
  launch_template:
    name: "sgsi-web-server-template"
    description: "Template para servidores web SGSI con configuración estandarizada"
    
    # AMI Configuration
    image_id: "ami-0c55b159cbfafe1d0"  # Amazon Linux 2 AMI (actualizar según región)
    instance_type: "t3.medium"  # Balance costo/performance para dev
    
    # Key pair for SSH access
    key_name: "sgsi-keypair"
    
    # Security groups
    security_groups:
      - name: "sgsi-web-sg"
        vpc_name: "sgsi-vpc-main"
      - name: "sgsi-app-sg"  
        vpc_name: "sgsi-vpc-main"
    
    # IAM Instance Profile
    iam_instance_profile:
      name: "sgsi-web-instance-profile"
    
    # Network configuration
    network_interfaces:
      - device_index: 0
        associate_public_ip_address: false  # Privadas en subnets App
        delete_on_termination: true
        description: "Primary network interface"
    
    # Storage configuration
    block_device_mappings:
      - device_name: "/dev/xvda"
        ebs:
          volume_type: "gp3"
          volume_size: 20
          iops: 3000
          throughput: 125
          encrypted: true
          delete_on_termination: true
    
    # User data script
    user_data: |
      #!/bin/bash
      # SGSI Web Server Bootstrap Script
      yum update -y
      
      # Install web server and tools
      yum install -y httpd php mysql git htop awscli
      
      # Configure Apache
      systemctl enable httpd
      systemctl start httpd
      
      # Install CloudWatch agent
      wget https://s3.amazonaws.com/amazoncloudwatch-agent/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm
      rpm -U ./amazon-cloudwatch-agent.rpm
      
      # Create web application
      cat > /var/www/html/index.php << 'EOF'
      <?php
      $instance_id = file_get_contents("http://169.254.169.254/latest/meta-data/instance-id");
      $availability_zone = file_get_contents("http://169.254.169.254/latest/meta-data/placement/availability-zone");
      ?>
      <!DOCTYPE html>
      <html>
      <head>
          <title>SGSI Layer 3 - Web Server</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              .header { background-color: #4CAF50; color: white; padding: 20px; }
              .info { background-color: #f1f1f1; padding: 15px; margin: 10px 0; }
          </style>
      </head>
      <body>
          <div class="header">
              <h1>🛡️ SGSI Layer 3 - Compute Infrastructure</h1>
          </div>
          <div class="info">
              <h2>Server Information</h2>
              <p><strong>Instance ID:</strong> <?php echo $instance_id; ?></p>
              <p><strong>Availability Zone:</strong> <?php echo $availability_zone; ?></p>
              <p><strong>Server Time:</strong> <?php echo date('Y-m-d H:i:s'); ?></p>
              <p><strong>Layer:</strong> Layer 3 - Compute</p>
              <p><strong>Status:</strong> ✅ Active</p>
          </div>
          <div class="info">
              <h2>Health Check Endpoint</h2>
              <p><a href="/health">/health</a> - ALB Health Check</p>
              <p><a href="/api/health">/api/health</a> - API Health Check</p>
          </div>
      </body>
      </html>
      EOF
      
      # Create health check endpoints
      cat > /var/www/html/health << 'EOF'
      OK
      EOF
      
      mkdir -p /var/www/html/api
      cat > /var/www/html/api/health << 'EOF'
      {"status":"healthy","timestamp":"<?php echo time(); ?>","layer":"compute"}
      EOF
      
      # Set permissions
      chown -R apache:apache /var/www/html/
      chmod -R 644 /var/www/html/
      
      # Configure CloudWatch monitoring
      cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'EOF'
      {
        "metrics": {
          "namespace": "SGSI/Layer3",
          "metrics_collected": {
            "cpu": {
              "measurement": ["cpu_usage_idle", "cpu_usage_iowait"],
              "metrics_collection_interval": 60
            },
            "disk": {
              "measurement": ["used_percent"],
              "metrics_collection_interval": 60,
              "resources": ["*"]
            },
            "mem": {
              "measurement": ["mem_used_percent"],
              "metrics_collection_interval": 60
            }
          }
        },
        "logs": {
          "logs_collected": {
            "files": {
              "collect_list": [
                {
                  "file_path": "/var/log/httpd/access_log",
                  "log_group_name": "/sgsi/layer3/web/access",
                  "log_stream_name": "{instance_id}"
                },
                {
                  "file_path": "/var/log/httpd/error_log", 
                  "log_group_name": "/sgsi/layer3/web/error",
                  "log_stream_name": "{instance_id}"
                }
              ]
            }
          }
        }
      }
      EOF
      
      # Start CloudWatch agent
      /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
        -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
      
      # Send success signal
      echo "SGSI Web Server bootstrap completed successfully" > /var/log/sgsi-bootstrap.log

  # =========================================
  # INSTANCES CONFIGURATION
  # =========================================  
  instances:
    - name: "sgsi-web-server-1"
      launch_template: "sgsi-web-server-template"
      subnet: 
        name: "sgsi-app-subnet-us-east-1a"
        vpc_name: "sgsi-vpc-main"
      availability_zone: "us-east-1a"
      
      # Instance-specific overrides
      instance_type: "t3.medium"
      
      # Additional tags
      tags:
        "Server": "Primary"
        "AZ": "us-east-1a"
        "Role": "WebServer"
        "Environment": "Development"
    
    - name: "sgsi-web-server-2" 
      launch_template: "sgsi-web-server-template"
      subnet:
        name: "sgsi-app-subnet-us-east-1b"
        vpc_name: "sgsi-vpc-main"
      availability_zone: "us-east-1b"
      
      instance_type: "t3.medium"
      
      tags:
        "Server": "Secondary"
        "AZ": "us-east-1b" 
        "Role": "WebServer"
        "Environment": "Development"

  # =========================================
  # MONITORING Y CLOUDWATCH
  # =========================================
  monitoring:
    detailed_monitoring: true
    
    cloudwatch_alarms:
      - name: "sgsi-web-server-cpu-high"
        metric_name: "CPUUtilization"
        namespace: "AWS/EC2"
        statistic: "Average"
        threshold: 80
        comparison_operator: "GreaterThanThreshold"
        evaluation_periods: 2
        period: 300
        
      - name: "sgsi-web-server-status-check"
        metric_name: "StatusCheckFailed"
        namespace: "AWS/EC2"
        statistic: "Maximum"
        threshold: 0
        comparison_operator: "GreaterThanThreshold"
        evaluation_periods: 2
        period: 60

  # =========================================
  # TAGS ORGANIZACIONALES
  # =========================================
  tags:
    # Core organizational tags
    "Pais": "RG"
    "Gerencia": "MejoraContinuaEInformacion"
    "Area": "DevOps"
    "Ambiente": "DEV"
    "Direccion": "TICENAM"
    "Modulo": "WebServers"
    
    # Compliance and governance
    "AlcanceSOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    
    # Technical classification
    "Layer": "Compute"
    "Dominio": "BusinessIntelligence"
    "Subdominio": "WebServices"
    "Aplicacion": "SGSI"
    
    # Resource identification
    "Name": "sgsi-web-servers"
    "Tipo de Recurso": "EC2Instance"
    
    # Contact and support information
    "Soporte": "darwin.lopez@claro.com.gt"
    "Contacto": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    
    # Lifecycle management
    "Ciclo de Vida": "Desarrollo"
    "Version": "v1.0.0"
    "Fecha de Creacion": "2025-10-18"
    "Layer": "SGSI-Layer3-Compute"
    
    # Security and compliance
    "Confidencialidad": "Interno"
    "Criticidad": "Alta"
    "BackupRequired": "Yes"
    "PatchGroup": "WebServers"