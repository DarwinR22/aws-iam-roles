role:
  name: "mci-glue-service-role"
  description: "Rol de ejecución para AWS Glue Jobs con control ABAC. Acceso granular a S3 DataLake, Glue Catalog, DynamoDB y KMS basado en tags."
  service: "glue"
  version: "1.0.0"
  
  trust_policy:
    - service: "glue.amazonaws.com"
    
  policy_modules:
    - name: "mci-aws-s3-read"
      file: "mci-aws-s3-read.yaml"
      folder: "execution"
      description: "Lectura en buckets S3 DataLake con ABAC por Cuenta y Proposito"
      
    - name: "mci-aws-s3-write"
      file: "mci-aws-s3-write.yaml"
      folder: "execution"
      description: "Escritura en buckets S3 DataLake con ABAC por Cuenta y Proposito"
      
    - name: "mci-aws-glue-catalog-read"
      file: "mci-aws-glue-catalog-read.yaml"
      folder: "execution"
      description: "Lectura del catálogo Glue (databases, tables, partitions) con ABAC por Cuenta"
      
    - name: "mci-aws-glue-catalog-write"
      file: "mci-aws-glue-catalog-write.yaml"
      folder: "execution"
      description: "Escritura en catálogo Glue (create/update databases, tables, partitions) con ABAC por Cuenta"
      
    - name: "mci-aws-dynamodb-read"
      file: "mci-aws-dynamodb-read.yaml"
      folder: "execution"
      description: "Lectura en tablas DynamoDB para tracking/metadatos con ABAC por Cuenta"
      
    - name: "mci-aws-kms-decrypt"
      file: "mci-aws-kms-decrypt.yaml"
      folder: "execution"
      description: "Descifrado KMS para objetos S3 encriptados con ABAC por Cuenta"
      
    - name: "mci-aws-cloudwatch-logs"
      file: "mci-aws-cloudwatch-logs.yaml"
      folder: "execution"
      description: "Escritura de logs en CloudWatch con ABAC por Cuenta"

  # Tags ABAC - CRÍTICOS para control de acceso
  tags:
    Cuenta: "clarohn-data-analytics-dev"
    Proposito: "DataLake"
    Gerencia: "MejoraContinuaEInformacion"
    Dominio: "DataAnalytics"
    Subdominio: "ETL"
    Area: "DevOps"
    Pais: "GT"
    Direccion: "TICENAM"
    Modulo: "Glue"
    AlcanceSOX: "No"
    Propietario: "JorgeMarioRubioVidal"
    Proveedor: "INHOUSE"
    Layer: "DataProcessing"
    Aplicacion: "GLUE-ETL-SERVICE"
    Name: "mci-glue-service-role"
    Soporte: "DevOps MCI"
