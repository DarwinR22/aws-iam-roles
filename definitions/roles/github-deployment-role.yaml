# GitHub Act    version: "v1.2.0"ons Deployment Role Definition
# Main role configuration that combines all modular permissions
# Defines OIDC trust policy and references component policies

role:
  name: "github-actions-iam-deployment-role"
  description: "Rol IAM para despliegues automaticos desde GitHub Actions (repositorio: ClaroCENAM/mci-aws-iam) utilizando OIDC. Permite unicamente la creacion y administracion de recursos IAM a traves de la canalizacion (pipeline) de Terraform"
  path: "/"
  max_session_duration: 3600
  
  # Metadata for role management
  metadata:
    version: "2.2.0"
    created_by: "DevOps Team"
    created_date: "2025-09-16"
    last_updated: "2025-10-14T20:45:00"
    purpose: "GitHub Actions CI/CD deployment con políticas ABAC modulares basadas en tags"
    risk_level: "high"
    security_improvements: "v2.2.0 - Restricción a repo específico + solo rama dev (sin PRs) + protección auto-eliminación"
    
  # OIDC Trust Policy Configuration
  trust_policy:
    type: "oidc"
    
    # GitHub OIDC Provider configuration  
    oidc_config:
      provider_arn: "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
      audience: "sts.amazonaws.com"
      
      # Repository access configuration
      repositories:
        - "repo:ClaroCENAM/mci-aws-iam"  # ✅ MEJORA 1: Solo este repositorio específico
        
      # Additional OIDC conditions for security
      conditions:
        - test: "StringEquals"
          variable: "token.actions.githubusercontent.com:aud"
          values: ["sts.amazonaws.com"]
          
        - test: "StringLike"
          variable: "token.actions.githubusercontent.com:sub"
          values: ["repo:ClaroCENAM/mci-aws-iam:ref:refs/heads/dev"]  # ✅ MEJORA 2: Solo rama dev, commits directos únicamente

  # Referenced policy modules - these will be combined into the role
  policy_modules:
    - name: "github-deployment-tfstate"
      file: "github-deployment-tfstate.yaml"
      description: "S3 y DynamoDB para gestión de estado de Terraform (solo GitHub Actions)"
    
    - name: "github-deployment-lambda"
      file: "github-deployment-lambda.yaml"
      description: "Lambda con control ABAC basado en tags (solo deployment)"
      
    - name: "github-deployment-s3"
      file: "github-deployment-s3.yaml"
      description: "S3 con control ABAC basado en tags (solo deployment)"
      
    - name: "github-deployment-dynamodb"
      file: "github-deployment-dynamodb.yaml"
      description: "DynamoDB con control ABAC basado en tags (solo deployment)"
      
    - name: "github-deployment-eventbridge"
      file: "github-deployment-eventbridge.yaml"
      description: "EventBridge y Step Functions con control ABAC (solo deployment)"
      
    - name: "github-deployment-cloudwatch"
      file: "github-deployment-cloudwatch.yaml"
      description: "CloudWatch y SNS con control ABAC (solo deployment)"
      
    - name: "github-deployment-glue"
      file: "github-deployment-glue.yaml"
      description: "Glue, IAM PassRole y KMS con control ABAC (solo deployment)"
      
    - name: "github-deployment-iam"
      file: "github-deployment-iam.yaml"
      description: "Gestión completa de IAM (CreateRole, CreatePolicy, AttachRolePolicy, PassRole)"
    
    # ✅ MEJORA 3: Protección contra auto-eliminación
    - name: "github-deployment-protection"
      inline_policy:
        statements:
          - sid: "DenyDeleteSelfRole"
            effect: "Deny"
            actions:
              - "iam:DeleteRole"
              - "iam:DeleteRolePolicy"
              - "iam:DetachRolePolicy"
              - "iam:UpdateAssumeRolePolicy"
            resources:
              - "arn:aws:iam::${account_id}:role/github-actions-iam-deployment-role"
            conditions:
              - test: "StringEquals"
                variable: "aws:PrincipalArn"
                values: ["arn:aws:iam::${account_id}:role/github-actions-iam-deployment-role"]
      
    - name: "github-deployment-cloudformation"
      file: "github-deployment-cloudformation.yaml"
      description: "CloudFormation stacks y KMS encryption con ViaService conditions"

  # Organizational tags for compliance and governance
  tags:
    # Core organizational tags
    "Pais": "RG"
    "Gerencia": "MCI"
    "Area": "DevOps"
    "Ambiente": "DEV"
    "Direccion": "TIRegional"
    "Modulo": "IAM"
    
    # Compliance and governance
    "Alcance SOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    
    # Technical classification
    "Layer": "Devops"
    "Dominio": "BusinessIntelligence"
    "Subdominio": "Analytics"
    "Aplicacion": "CICD"
    
    # Resource identification
    "Name": "github-actions-iam-deployment-role"
    "Tipo de Recurso": "IAMRole"
    
    # Contact and support information
    "Soporte": "darwin.lopez@claro.com.gt"
    "Contacto": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    
    # Lifecycle management
    "Ciclo de Vida": "Actualizacion"
    "Versión": "v2.1.0"  # ABAC + Seguridad mejorada: repo específico, rama dev, protección auto-eliminación
    "Fecha de Creacion": "2025-09-16"
    "Última Actualización": "2025-10-09"

# Environment variables for multi-environment deployment
variables:
  environment:
    description: "Target environment for role deployment"
    type: "string"
    default: "dev"
    allowed_values: ["dev", "qa", "prod"]
    
  account_id:
    description: "AWS account ID where role will be created"
    type: "string"
    default: "393209814297"

# Deployment configuration
deployment:
  # Terraform generation settings
  terraform:
    generate_inline_policies: true
    separate_policy_files: false
    include_data_sources: true
    
  # Validation settings
  validation:
    check_policy_syntax: true
    validate_abac_conditions: true
    verify_oidc_configuration: true
    
  # Security settings
  security:
    enable_cloudtrail_logging: true
    require_mfa_for_sensitive_ops: false  # OIDC already provides strong auth
    session_timeout_minutes: 60