# ==============================================================================
# LAYER 4: STORAGE - DEFINITIONS
# ==============================================================================

# S3 Buckets Configuration
s3_buckets:
  - name: "sgsi-app-data"
    purpose: "application_data"
    versioning: true
    encryption:
      type: "AES256"
      kms_key_id: null
    
    lifecycle_rules:
      - id: "transition_to_ia"
        status: "Enabled"
        transitions:
          - days: 30
            storage_class: "STANDARD_IA"
          - days: 90
            storage_class: "GLACIER"
          - days: 365
            storage_class: "DEEP_ARCHIVE"
    
    public_access_block:
      block_public_acls: true
      block_public_policy: true
      ignore_public_acls: true
      restrict_public_buckets: true

  - name: "sgsi-logs"
    purpose: "audit_logs"
    versioning: true
    encryption:
      type: "AES256"
    
    lifecycle_rules:
      - id: "log_retention"
        status: "Enabled"
        expiration:
          days: 2555  # 7 años para compliance

  - name: "sgsi-backups"
    purpose: "database_backups"
    versioning: true
    encryption:
      type: "AES256"
    
    lifecycle_rules:
      - id: "backup_retention"
        status: "Enabled"
        transitions:
          - days: 30
            storage_class: "GLACIER"

# EFS Configuration
efs_file_systems:
  - name: "sgsi-shared-storage"
    creation_token: "sgsi-efs-shared"
    performance_mode: "generalPurpose"
    throughput_mode: "provisioned"
    provisioned_throughput_in_mibps: 100
    encrypted: true
    
    mount_targets:
      - subnet: "sgsi-app-1a"
        security_groups: ["sgsi-efs-sg"]
      - subnet: "sgsi-app-1b"
        security_groups: ["sgsi-efs-sg"]
      - subnet: "sgsi-app-1c"
        security_groups: ["sgsi-efs-sg"]

# AWS Backup Configuration
backup_configuration:
  backup_vault:
    name: "sgsi-backup-vault"
    kms_key_arn: null  # Will use default AWS managed key
    
  backup_plan:
    name: "sgsi-backup-plan"
    rules:
      - name: "daily_backup"
        target_vault_name: "sgsi-backup-vault"
        schedule: "cron(0 5 ? * * *)"  # 5 AM daily
        lifecycle:
          cold_storage_after: 30
          delete_after: 365
        
        recovery_point_tags:
          BackupType: "Daily"
          Automated: "true"
      
      - name: "weekly_backup"
        target_vault_name: "sgsi-backup-vault"
        schedule: "cron(0 3 ? * SUN *)"  # 3 AM Sundays
        lifecycle:
          cold_storage_after: 90
          delete_after: 2555  # 7 años

  backup_selection:
    name: "sgsi-backup-selection"
    iam_role_arn: "arn:aws:iam::051963532279:role/aws-backup-service-role"
    resources:
      - "arn:aws:rds:*:*:db:sgsi-db-primary"
      - "arn:aws:efs:*:*:file-system/*"

# Security Groups para Storage
security_groups:
  - name: "sgsi-efs-sg"
    description: "Security Group for EFS file systems"
    vpc_name: "sgsi-vpc-main"
    
    ingress_rules:
      - protocol: "tcp"
        from_port: 2049
        to_port: 2049
        source_security_group: "sgsi-web-sg"
        description: "NFS from web servers"
      
      - protocol: "tcp"
        from_port: 2049
        to_port: 2049
        source_security_group: "sgsi-app-sg"
        description: "NFS from app servers"

# Compliance y Seguridad
metadata:
  layer: "04-storage"
  iso27001_controls:
    - "A.12.3.1"  # Information backup
    - "A.10.1.1"  # Cryptographic policy
    - "A.12.1.3"  # Capacity management
  
  nist_csf_functions:
    - "Protect (PR.DS)"  # Data Security
    - "Recover (RC.RP)"  # Recovery Planning
  
  data_classification:
    - "Internal"
    - "Confidential"
    - "Restricted"

# Tags por defecto
default_tags:
  Project: "SGSI-Implementation"
  Layer: "Storage"
  SecurityLevel: "High"
  ComplianceScope: "ISO27001-A.12"
  AssetType: "Storage-Infrastructure"
  DataClassification: "Internal"
  BackupRequired: "true"
  MaintenanceWindow: "Sunday-2AM-6AM"