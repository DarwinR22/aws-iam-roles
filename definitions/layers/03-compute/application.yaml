# ==============================================================================
# LAYER 3: COMPUTE - APPLICATION INFRASTRUCTURE DEFINITIONS
# ==============================================================================

# Application Load Balancer Configuration
load_balancer:
  name: "sgsi-alb"
  type: "application"
  scheme: "internet-facing"
  ip_address_type: "ipv4"
  
  # Multi-AZ para alta disponibilidad
  subnets:
    - "sgsi-public-1a"
    - "sgsi-public-1b"
    - "sgsi-public-1c"
  
  security_groups:
    - "sgsi-alb-sg"
  
  # SSL/TLS Configuration
  listeners:
    - port: 80
      protocol: "HTTP"
      default_action:
        type: "redirect"
        redirect:
          protocol: "HTTPS"
          port: "443"
          status_code: "HTTP_301"
    
    - port: 443
      protocol: "HTTPS"
      ssl_policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
      certificate_arn: "arn:aws:acm:us-east-1:051963532279:certificate/YOUR-CERT-ID"
      default_action:
        type: "forward"
        target_group_arn: "sgsi-web-tg"

  # Target Groups
  target_groups:
    - name: "sgsi-web-tg"
      port: 8080
      protocol: "HTTP"
      target_type: "instance"
      vpc_name: "sgsi-vpc-main"
      
      health_check:
        enabled: true
        healthy_threshold: 2
        unhealthy_threshold: 3
        timeout: 5
        interval: 30
        path: "/health"
        matcher: "200"
        protocol: "HTTP"
        port: "traffic-port"

# Auto Scaling Configuration
auto_scaling:
  launch_template:
    name: "sgsi-web-lt"
    image_id: "ami-0c02fb55956c7d316"  # Amazon Linux 2
    instance_type: "t3.medium"
    key_name: "sgsi-keypair"
    
    # Security and Networking
    security_group_ids:
      - "sgsi-web-sg"
    
    # User Data Script
    user_data_base64: |
      IyEvYmluL2Jhc2gKY2QgL3RtcAp5dW0gdXBkYXRlIC15CnN1ZG8gYW1hem9uLWxpbnV4LWV4dHJhcyBpbnN0YWxsIC15IGRvY2tlcgpzdWRvIHNlcnZpY2UgZG9ja2VyIHN0YXJ0CnN1ZG8gdXNlcm1vZCAtYSAtRyBkb2NrZXIgZWMyLXVzZXI=
    
    # Storage Configuration
    block_device_mappings:
      - device_name: "/dev/xvda"
        ebs:
          volume_type: "gp3"
          volume_size: 20
          encrypted: true
          delete_on_termination: true
    
    # Instance Metadata Service v2
    metadata_options:
      http_endpoint: "enabled"
      http_tokens: "required"
      http_put_response_hop_limit: 1

  # Auto Scaling Group
  auto_scaling_group:
    name: "sgsi-web-asg"
    min_size: 2
    max_size: 10
    desired_capacity: 3
    
    # Multi-AZ deployment
    vpc_zone_identifier:
      - "sgsi-app-1a"
      - "sgsi-app-1b"
      - "sgsi-app-1c"
    
    target_group_arns:
      - "sgsi-web-tg"
    
    health_check_type: "ELB"
    health_check_grace_period: 300
    
    # Tags
    tag:
      - key: "Name"
        value: "sgsi-web-instance"
        propagate_at_launch: true

# Database Configuration (RDS)
database:
  # RDS Subnet Group
  subnet_group:
    name: "sgsi-db-subnet-group"
    subnet_ids:
      - "sgsi-db-1a"
      - "sgsi-db-1b"
      - "sgsi-db-1c"
    description: "Subnet group for SGSI database"

  # RDS Instance
  instance:
    identifier: "sgsi-db-primary"
    engine: "mysql"
    engine_version: "8.0.35"
    instance_class: "db.t3.medium"
    allocated_storage: 100
    max_allocated_storage: 1000
    storage_type: "gp3"
    storage_encrypted: true
    
    # Database Configuration
    db_name: "sgsi_app"
    username: "admin"
    manage_master_user_password: true
    
    # Network Configuration
    db_subnet_group_name: "sgsi-db-subnet-group"
    vpc_security_group_ids:
      - "sgsi-db-sg"
    
    # Backup Configuration
    backup_retention_period: 30
    backup_window: "03:00-04:00"
    maintenance_window: "sun:04:00-sun:05:00"
    
    # Multi-AZ for HA
    multi_az: true
    publicly_accessible: false
    
    # Monitoring
    monitoring_interval: 60
    performance_insights_enabled: true
    performance_insights_retention_period: 7
    
    # Deletion Protection
    deletion_protection: true
    skip_final_snapshot: false
    final_snapshot_identifier: "sgsi-db-final-snapshot"

# Lambda Functions
lambda_functions:
  - name: "sgsi-api-processor"
    runtime: "python3.11"
    handler: "lambda_function.lambda_handler"
    filename: "api_processor.zip"
    
    # VPC Configuration
    vpc_config:
      subnet_ids:
        - "sgsi-app-1a"
        - "sgsi-app-1b"
      security_group_ids:
        - "sgsi-lambda-sg"
    
    # Environment Variables
    environment:
      variables:
        DB_HOST: "${aws_db_instance.sgsi_db.address}"
        DB_NAME: "sgsi_app"
        ENVIRONMENT: "production"
    
    # Resource Configuration
    memory_size: 512
    timeout: 30
    
    # IAM Role
    role: "arn:aws:iam::051963532279:role/sgsi-lambda-role"

# Compliance y Seguridad
metadata:
  layer: "03-compute"
  iso27001_controls:
    - "A.12.6.1"  # Management of technical vulnerabilities
    - "A.13.1.1"  # Network controls
    - "A.14.1.3"  # Protecting application services transactions
  
  nist_csf_functions:
    - "Protect (PR.DS)"  # Data Security
    - "Protect (PR.AC)"  # Access Control
  
  security_features:
    - "Encrypted EBS volumes"
    - "IMDSv2 enforcement"
    - "Multi-AZ deployment"
    - "SSL/TLS termination"
    - "Database encryption at rest"

# Tags por defecto
default_tags:
  Project: "SGSI-Implementation"
  Layer: "Compute"
  SecurityLevel: "High"
  ComplianceScope: "ISO27001-A.12,A.13,A.14"
  AssetType: "Compute-Infrastructure"
  DataClassification: "Internal"
  MaintenanceWindow: "Sunday-2AM-6AM"