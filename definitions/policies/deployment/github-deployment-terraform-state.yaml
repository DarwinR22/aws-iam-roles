policy:
  name: "mci-terraform-state-management"
  description: "Gestión de estado de Terraform en S3 y locks en DynamoDB (sin ABAC - requerido para CI/CD)"
  service: "terraform"
  version: "1.0.0"
  
  statements:
    - sid: "TerraformS3StateAccess"
      effect: "Allow"
      actions:
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:DeleteObject"
        - "s3:ListBucket"
        - "s3:GetBucketVersioning"
        - "s3:GetBucketLocation"
        - "s3:ListBucketVersions"
      resources:
        - "arn:aws:s3:::*-tfstate-*"
        - "arn:aws:s3:::*-tfstate-*/*"

    - sid: "TerraformDynamoDBLockAccess"
      effect: "Allow"
      actions:
        - "dynamodb:GetItem"
        - "dynamodb:PutItem"
        - "dynamodb:DeleteItem"
        - "dynamodb:DescribeTable"
        - "dynamodb:DescribeContinuousBackups"
      resources:
        - "arn:aws:dynamodb:*:*:table/*-terraform-lock*"
        - "arn:aws:dynamodb:*:*:table/*-tfstate-lock*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"
critical: true  # Esta política es crítica para el funcionamiento de Terraform

tags:
  Service: "Terraform"
  AccessLevel: "StateManagement"
  PolicyType: "Standard"
  ManagedBy: "mci-aws-iam"
  Critical: "true"
