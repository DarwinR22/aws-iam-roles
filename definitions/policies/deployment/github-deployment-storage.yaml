policy:
  name: github-deployment-storage
  description: "GitHub Actions deployment policy for Storage infrastructure (S3, EFS, EBS, Backup)"
  policy_type: deployment
  layer: Storage
  scope: global
  version: "1.0.0"

  statements:
  # S3 Bucket Management
  - sid: S3BucketManagement
    effect: Allow
    actions:
      # Bucket Operations
      - "s3:CreateBucket"
      - "s3:DeleteBucket"
      - "s3:ListBucket"
      - "s3:ListAllMyBuckets"
      - "s3:GetBucketLocation"
      - "s3:GetBucketVersioning"
      - "s3:PutBucketVersioning"
      
      # Bucket Policy and ACL
      - "s3:GetBucketPolicy"
      - "s3:PutBucketPolicy"
      - "s3:DeleteBucketPolicy"
      - "s3:GetBucketAcl"
      - "s3:PutBucketAcl"
      
      # Bucket Configuration
      - "s3:GetBucketCors"
      - "s3:PutBucketCors"
      - "s3:GetBucketLifecycleConfiguration"
      - "s3:PutBucketLifecycleConfiguration"
      - "s3:GetBucketReplication"
      - "s3:PutBucketReplication"
      - "s3:GetBucketNotification"
      - "s3:PutBucketNotification"
      
      # Encryption Configuration
      - "s3:GetEncryptionConfiguration"
      - "s3:PutEncryptionConfiguration"
      - "s3:GetBucketPublicAccessBlock"
      - "s3:PutBucketPublicAccessBlock"
      
      # Object Operations
      - "s3:GetObject"
      - "s3:PutObject"
      - "s3:DeleteObject"
      - "s3:GetObjectVersion"
      - "s3:DeleteObjectVersion"
      - "s3:RestoreObject"
    resources:
      - "arn:aws:s3:::sgsi-*"
      - "arn:aws:s3:::sgsi-*/*"
      - "arn:aws:s3:::*-sgsi-*"
      - "arn:aws:s3:::*-sgsi-*/*"

  # EBS Volume Management
  - sid: EBSVolumeManagement
    effect: Allow
    actions:
      - "ec2:CreateVolume"
      - "ec2:DeleteVolume"
      - "ec2:DescribeVolumes"
      - "ec2:AttachVolume"
      - "ec2:DetachVolume"
      - "ec2:ModifyVolume"
      - "ec2:CreateSnapshot"
      - "ec2:DeleteSnapshot"
      - "ec2:DescribeSnapshots"
      - "ec2:CopySnapshot"
      - "ec2:ModifySnapshotAttribute"
    resources:
      - "*"

  # EFS File System Management
  - sid: EFSManagement
    effect: Allow
    actions:
      - "elasticfilesystem:CreateFileSystem"
      - "elasticfilesystem:DeleteFileSystem"
      - "elasticfilesystem:DescribeFileSystems"
      - "elasticfilesystem:CreateMountTarget"
      - "elasticfilesystem:DeleteMountTarget"
      - "elasticfilesystem:DescribeMountTargets"
      - "elasticfilesystem:ModifyMountTargetSecurityGroups"
      - "elasticfilesystem:CreateAccessPoint"
      - "elasticfilesystem:DeleteAccessPoint"
      - "elasticfilesystem:DescribeAccessPoints"
      - "elasticfilesystem:PutFileSystemPolicy"
      - "elasticfilesystem:DescribeFileSystemPolicy"
      - "elasticfilesystem:DeleteFileSystemPolicy"
    resources:
      - "*"

  # AWS Backup Management
  - sid: BackupManagement
    effect: Allow
    actions:
      - "backup:CreateBackupPlan"
      - "backup:DeleteBackupPlan"
      - "backup:GetBackupPlan"
      - "backup:ListBackupPlans"
      - "backup:UpdateBackupPlan"
      - "backup:CreateBackupSelection"
      - "backup:DeleteBackupSelection"
      - "backup:GetBackupSelection"
      - "backup:ListBackupSelections"
      - "backup:CreateBackupVault"
      - "backup:DeleteBackupVault"
      - "backup:DescribeBackupVault"
      - "backup:ListBackupVaults"
      - "backup:StartBackupJob"
      - "backup:StopBackupJob"
      - "backup:DescribeBackupJob"
      - "backup:ListBackupJobs"
      - "backup:StartRestoreJob"
      - "backup:DescribeRestoreJob"
      - "backup:ListRestoreJobs"
    resources:
      - "*"

  # FSx File Systems Management
  - sid: FSxManagement
    effect: Allow
    actions:
      - "fsx:CreateFileSystem"
      - "fsx:DeleteFileSystem"
      - "fsx:DescribeFileSystems"
      - "fsx:CreateBackup"
      - "fsx:DeleteBackup"
      - "fsx:DescribeBackups"
      - "fsx:RestoreVolumeFromSnapshot"
    resources:
      - "*"

  # KMS for Storage Encryption
  - sid: KMSForStorage
    effect: Allow
    actions:
      - "kms:CreateKey"
      - "kms:DescribeKey"
      - "kms:ListKeys"
      - "kms:ListAliases"
      - "kms:CreateAlias"
      - "kms:DeleteAlias"
      - "kms:GetKeyPolicy"
      - "kms:PutKeyPolicy"
      - "kms:EnableKey"
      - "kms:DisableKey"
      - "kms:TagResource"
      - "kms:UntagResource"
      - "kms:ListResourceTags"
    resources:
      - "*"

  # Storage Gateway Management
  - sid: StorageGatewayManagement
    effect: Allow
    actions:
      - "storagegateway:CreateGateway"
      - "storagegateway:DeleteGateway"
      - "storagegateway:DescribeGatewayInformation"
      - "storagegateway:ListGateways"
      - "storagegateway:CreateNFSFileShare"
      - "storagegateway:DeleteFileShare"
      - "storagegateway:DescribeNFSFileShares"
      - "storagegateway:UpdateNFSFileShare"
    resources:
      - "*"

  # Data Lifecycle Management
  - sid: DataLifecycleManagement
    effect: Allow
    actions:
      - "dlm:CreateLifecyclePolicy"
      - "dlm:DeleteLifecyclePolicy"
      - "dlm:GetLifecyclePolicy"
      - "dlm:GetLifecyclePolicies"
      - "dlm:UpdateLifecyclePolicy"
    resources:
      - "*"

  # Tags Management for Storage
  - sid: StorageTagging
    effect: Allow
    actions:
      - "s3:GetBucketTagging"
      - "s3:PutBucketTagging"
      - "ec2:CreateTags"
      - "ec2:DeleteTags"
      - "ec2:DescribeTags"
      - "elasticfilesystem:CreateTags"
      - "elasticfilesystem:DeleteTags"
      - "elasticfilesystem:DescribeTags"
    resources:
      - "*"

  # Resource access based on tags
  conditions:
    - condition_key: "aws:ResourceTag/Project"
      condition_operator: StringEquals
      condition_values: ["SGSI-Implementation"]
    
    - condition_key: "aws:ResourceTag/Environment"
      condition_operator: StringEquals
      condition_values: ["Development", "QA", "Production"]

    # S3 bucket encryption requirements
    - condition_key: "s3:x-amz-server-side-encryption"
      condition_operator: StringEquals
      condition_values: ["AES256", "aws:kms"]

  tags:
    PolicyType: "Deployment"
    Layer: "Storage"
    SecurityLevel: "High"
    ComplianceScope: "ISO27001,NIST-CSF"
    ReviewDate: "2025-01-19"
    CreatedBy: "SGSI-Team"