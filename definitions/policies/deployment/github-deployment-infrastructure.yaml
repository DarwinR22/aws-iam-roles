policy:
  name: "github-deployment-infrastructure"
  description: "Política consolidada para recursos de infraestructura (VPC, EC2, ALB, Auto Scaling) del SGSI - Consolidación de network + compute"
  service: "infrastructure"
  version: "2.0.0"
  
  statements:
    # ===========================================
    # VPC AND NETWORK INFRASTRUCTURE (from network)
    # ===========================================
    - sid: "VPCManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateVpc"
        - "ec2:DeleteVpc"
        - "ec2:ModifyVpcAttribute"
        - "ec2:DescribeVpcs"
        - "ec2:DescribeVpcAttribute"
        - "ec2:CreateTags"
        - "ec2:DeleteTags"
        - "ec2:DescribeTags"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "InternetGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateInternetGateway"
        - "ec2:DeleteInternetGateway"
        - "ec2:AttachInternetGateway"
        - "ec2:DetachInternetGateway"
        - "ec2:DescribeInternetGateways"
      resources:
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "SubnetManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSubnet"
        - "ec2:DeleteSubnet"
        - "ec2:ModifySubnetAttribute"
        - "ec2:DescribeSubnets"
        - "ec2:DescribeAvailabilityZones"
      resources:
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "SecurityGroupManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSecurityGroup"
        - "ec2:DeleteSecurityGroup"
        - "ec2:DescribeSecurityGroups"
        - "ec2:DescribeSecurityGroupRules"
        - "ec2:AuthorizeSecurityGroupIngress"
        - "ec2:AuthorizeSecurityGroupEgress"
        - "ec2:RevokeSecurityGroupIngress"
        - "ec2:RevokeSecurityGroupEgress"
        - "ec2:ModifySecurityGroupRules"
      resources:
        - "arn:aws:ec2:*:*:security-group/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "RouteTableManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateRouteTable"
        - "ec2:DeleteRouteTable"
        - "ec2:DescribeRouteTables"
        - "ec2:CreateRoute"
        - "ec2:DeleteRoute"
        - "ec2:ReplaceRoute"
        - "ec2:AssociateRouteTable"
        - "ec2:DisassociateRouteTable"
        - "ec2:ReplaceRouteTableAssociation"
      resources:
        - "arn:aws:ec2:*:*:route-table/*"
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:natgateway/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "NATGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateNatGateway"
        - "ec2:DeleteNatGateway"
        - "ec2:DescribeNatGateways"
        - "ec2:AllocateAddress"
        - "ec2:ReleaseAddress"
        - "ec2:DescribeAddresses"
        - "ec2:AssociateAddress"
        - "ec2:DisassociateAddress"
      resources:
        - "arn:aws:ec2:*:*:natgateway/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:elastic-ip/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    # ===========================================
    # EC2 COMPUTE INFRASTRUCTURE (from compute)
    # ===========================================
    - sid: "EC2InstanceManagement"
      effect: "Allow"
      actions:
        - "ec2:RunInstances"
        - "ec2:TerminateInstances"
        - "ec2:StartInstances"
        - "ec2:StopInstances"
        - "ec2:RebootInstances"
        - "ec2:DescribeInstances"
        - "ec2:DescribeInstanceStatus"
        - "ec2:DescribeInstanceAttribute"
        - "ec2:ModifyInstanceAttribute"
        - "ec2:GetConsoleOutput"
        - "ec2:GetConsoleScreenshot"
        - "ec2:DescribeImages"
        - "ec2:DescribeSnapshots"
        - "ec2:DescribeVolumes"
        - "ec2:AttachVolume"
        - "ec2:DetachVolume"
        - "ec2:CreateVolume"
        - "ec2:DeleteVolume"
        - "ec2:ModifyVolume"
        - "ec2:CreateSnapshot"
        - "ec2:DeleteSnapshot"
        - "ec2:DescribeKeyPairs"
        - "ec2:CreateKeyPair"
        - "ec2:DeleteKeyPair"
      resources:
        - "arn:aws:ec2:*:*:instance/*"
        - "arn:aws:ec2:*:*:volume/*"
        - "arn:aws:ec2:*:*:snapshot/*"
        - "arn:aws:ec2:*:*:image/*"
        - "arn:aws:ec2:*:*:key-pair/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:security-group/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "EC2LaunchTemplatesAndAMI"
      effect: "Allow"
      actions:
        - "ec2:CreateLaunchTemplate"
        - "ec2:CreateLaunchTemplateVersion"
        - "ec2:DeleteLaunchTemplate"
        - "ec2:DeleteLaunchTemplateVersions"
        - "ec2:DescribeLaunchTemplates"
        - "ec2:DescribeLaunchTemplateVersions"
        - "ec2:ModifyLaunchTemplate"
        - "ec2:GetLaunchTemplateData"
        - "ec2:CreateImage"
        - "ec2:DeregisterImage"
        - "ec2:CopyImage"
        - "ec2:ModifyImageAttribute"
        - "ec2:ResetImageAttribute"
        - "ec2:DescribeImageAttribute"
      resources:
        - "arn:aws:ec2:*:*:launch-template/*"
        - "arn:aws:ec2:*:*:image/*"
        - "arn:aws:ec2:*:*:instance/*"
        - "arn:aws:ec2:*:*:snapshot/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    # ===========================================
    # LOAD BALANCER MANAGEMENT (from compute)
    # ===========================================
    - sid: "LoadBalancerManagement"
      effect: "Allow"
      actions:
        - "elasticloadbalancing:CreateLoadBalancer"
        - "elasticloadbalancing:DeleteLoadBalancer"
        - "elasticloadbalancing:DescribeLoadBalancers"
        - "elasticloadbalancing:DescribeLoadBalancerAttributes"
        - "elasticloadbalancing:ModifyLoadBalancerAttributes"
        - "elasticloadbalancing:CreateTargetGroup"
        - "elasticloadbalancing:DeleteTargetGroup"
        - "elasticloadbalancing:DescribeTargetGroups"
        - "elasticloadbalancing:DescribeTargetGroupAttributes"
        - "elasticloadbalancing:ModifyTargetGroupAttributes"
        - "elasticloadbalancing:RegisterTargets"
        - "elasticloadbalancing:DeregisterTargets"
        - "elasticloadbalancing:DescribeTargetHealth"
        - "elasticloadbalancing:CreateListener"
        - "elasticloadbalancing:DeleteListener"
        - "elasticloadbalancing:DescribeListeners"
        - "elasticloadbalancing:ModifyListener"
        - "elasticloadbalancing:CreateRule"
        - "elasticloadbalancing:DeleteRule"
        - "elasticloadbalancing:DescribeRules"
        - "elasticloadbalancing:ModifyRule"
        - "elasticloadbalancing:AddTags"
        - "elasticloadbalancing:RemoveTags"
        - "elasticloadbalancing:DescribeTags"
      resources:
        - "arn:aws:elasticloadbalancing:*:*:loadbalancer/*/*"
        - "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
        - "arn:aws:elasticloadbalancing:*:*:listener/*/*"
        - "arn:aws:elasticloadbalancing:*:*:listener-rule/*/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    # ===========================================
    # AUTO SCALING MANAGEMENT (from compute)
    # ===========================================
    - sid: "AutoScalingManagement"
      effect: "Allow"
      actions:
        - "autoscaling:CreateAutoScalingGroup"
        - "autoscaling:UpdateAutoScalingGroup"
        - "autoscaling:DeleteAutoScalingGroup"
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:DescribeAutoScalingInstances"
        - "autoscaling:DescribeScalingActivities"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        - "autoscaling:CreateLaunchConfiguration"
        - "autoscaling:DeleteLaunchConfiguration"
        - "autoscaling:DescribeLaunchConfigurations"
        - "autoscaling:CreateOrUpdateTags"
        - "autoscaling:DeleteTags"
        - "autoscaling:DescribeTags"
        - "autoscaling:PutScalingPolicy"
        - "autoscaling:DeletePolicy"
        - "autoscaling:DescribePolicies"
        - "autoscaling:ExecutePolicy"
        - "autoscaling:PutNotificationConfiguration"
        - "autoscaling:DeleteNotificationConfiguration"
        - "autoscaling:DescribeNotificationConfigurations"
      resources:
        - "arn:aws:autoscaling:*:*:autoScalingGroup:*:autoScalingGroupName/*"
        - "arn:aws:autoscaling:*:*:launchConfiguration:*:launchConfigurationName/*"
        - "arn:aws:autoscaling:*:*:scalingPolicy:*:autoScalingGroupName/*:policyName/*"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    # ===========================================
    # VPC FLOW LOGS AND READ ACCESS (from compute)
    # ===========================================
    - sid: "VPCFlowLogs"
      effect: "Allow"
      actions:
        - "ec2:CreateFlowLogs"
        - "ec2:DeleteFlowLogs"
        - "ec2:DescribeFlowLogs"
        - "logs:CreateLogGroup"
        - "logs:CreateLogStream"
        - "logs:DescribeLogGroups"
        - "logs:DescribeLogStreams"
        - "logs:PutLogEvents"
        - "iam:PassRole"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:networkinterface/*"
        - "arn:aws:logs:*:*:log-group:*"
        - "arn:aws:iam::*:role/flowlogsRole"
      conditions:
        - test: "StringEquals"
          variable: "aws:RequestedRegion"
          values: ["us-east-1"]

    - sid: "EC2ReadOnlyAccess"
      effect: "Allow"
      actions:
        - "ec2:Describe*"
        - "ec2:Get*"
        - "ec2:List*"
        - "elasticloadbalancing:Describe*"
        - "autoscaling:Describe*"
      resources: ["*"]

