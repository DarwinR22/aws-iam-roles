policy:
  name: "MCI-S3-DeploymentABAC"
  description: "Gestión completa de buckets S3 con control ABAC basado en tags de gerencia"
  service: "s3"
  version: "1.0.0"
  
  statements:
    - sid: "S3BucketManagement"
      effect: "Allow"
      actions:
        - "s3:CreateBucket"
        - "s3:DeleteBucket"
        - "s3:ListBucket"
        - "s3:GetBucketLocation"
        - "s3:GetBucketVersioning"
        - "s3:PutBucketVersioning"
        - "s3:GetBucketPolicy"
        - "s3:PutBucketPolicy"
        - "s3:DeleteBucketPolicy"
        - "s3:GetBucketTagging"
        - "s3:PutBucketTagging"
        - "s3:DeleteBucketTagging"
        - "s3:GetBucketEncryption"
        - "s3:PutBucketEncryption"
        - "s3:GetEncryptionConfiguration"
        - "s3:GetBucketPublicAccessBlock"
        - "s3:PutBucketPublicAccessBlock"
        - "s3:GetBucketLifecycleConfiguration"
        - "s3:PutBucketLifecycleConfiguration"
        - "s3:DeleteBucketLifecycleConfiguration"
        - "s3:GetBucketCors"
        - "s3:PutBucketCors"
        - "s3:DeleteBucketCors"
        # Logging configuration
        - "s3:GetBucketLogging"
        - "s3:PutBucketLogging"
        # Website configuration
        - "s3:GetBucketWebsite"
        - "s3:PutBucketWebsite"
        - "s3:DeleteBucketWebsite"
        # Acceleration & Request Payment
        - "s3:GetAccelerateConfiguration"
        - "s3:PutAccelerateConfiguration"
        - "s3:GetBucketRequestPayment"
        - "s3:PutBucketRequestPayment"
        # Ownership Controls
        - "s3:GetBucketOwnershipControls"
        - "s3:PutBucketOwnershipControls"
        - "s3:DeleteBucketOwnershipControls"
        # Replication
        - "s3:GetReplicationConfiguration"
        - "s3:PutReplicationConfiguration"
        - "s3:DeleteReplicationConfiguration"
        - "s3:GetBucketReplication"
        # Notifications
        - "s3:GetBucketNotification"
        - "s3:PutBucketNotification"
        # Object Lock
        - "s3:GetBucketObjectLockConfiguration"
        - "s3:PutBucketObjectLockConfiguration"
        # Intelligent Tiering
        - "s3:GetBucketIntelligentTieringConfiguration"
        - "s3:PutBucketIntelligentTieringConfiguration"
        - "s3:DeleteBucketIntelligentTieringConfiguration"
        - "s3:ListBucketIntelligentTieringConfigurations"
        # Additional bucket operations
        - "s3:GetBucketAcl"
        - "s3:PutBucketAcl"
        
      resources:
        - "arn:aws:s3:::*"
        
      # ✅ ABAC: Solo buckets con tags coincidentes
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:RequestTag/gerencia"
          values: ["${aws:PrincipalTag/gerencia}"]

    - sid: "S3ObjectManagement"
      effect: "Allow"
      actions:
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:DeleteObject"
        - "s3:GetObjectVersion"
        - "s3:DeleteObjectVersion"
        - "s3:GetObjectTagging"
        - "s3:PutObjectTagging"
        - "s3:GetObjectAcl"
        - "s3:PutObjectAcl"
        - "s3:ListMultipartUploadParts"
        - "s3:AbortMultipartUpload"
        
      resources:
        - "arn:aws:s3:::*/*"
        
      # ✅ ABAC: Solo objetos en buckets con tags coincidentes
      abac_conditions:
        - test: "StringEquals"
          variable: "s3:ExistingObjectTag/gerencia"
          values: ["${aws:PrincipalTag/gerencia}"]

    - sid: "S3ListAllBuckets"
      effect: "Allow"
      actions:
        - "s3:ListAllMyBuckets"
        - "s3:GetBucketLocation"
      resources:
        - "*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"

tags:
  Service: "S3"
  AccessLevel: "FullManagement"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
