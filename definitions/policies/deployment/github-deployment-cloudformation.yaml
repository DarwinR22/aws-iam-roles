policy:
  name: "github-deployment-cloudformation"
  description: "Permisos para despliegues con CloudFormation, KMS encryption y servicios adicionales"
  service: "cloudformation"
  version: "1.0.2"
  
  statements:
    - sid: "CloudFormationFullAccess"
      effect: "Allow"
      actions:
        - "cloudformation:CreateStack"
        - "cloudformation:UpdateStack"
        - "cloudformation:DeleteStack"
        - "cloudformation:DescribeStacks"
        - "cloudformation:DescribeStackEvents"
        - "cloudformation:DescribeStackResources"
        - "cloudformation:GetTemplate"
        - "cloudformation:ListStacks"
        - "cloudformation:ValidateTemplate"
        - "cloudformation:CreateChangeSet"
        - "cloudformation:DeleteChangeSet"
        - "cloudformation:DescribeChangeSet"
        - "cloudformation:ExecuteChangeSet"
        - "cloudformation:ListChangeSets"
        - "cloudformation:TagResource"
        - "cloudformation:UntagResource"
        - "cloudformation:ListStackResources"
      resources:
        - "arn:aws:cloudformation:*:*:stack/*"
        - "arn:aws:cloudformation:*:*:changeSet/*"

    - sid: "CloudFormationListOperations"
      effect: "Allow"
      actions:
        - "cloudformation:ListStacks"
        - "cloudformation:ListExports"
        - "cloudformation:ListImports"
        - "cloudformation:DescribeAccountLimits"
      resources:
        - "*"

    - sid: "KMSEncryptionForServices"
      effect: "Allow"
      actions:
        - "kms:Decrypt"
        - "kms:Encrypt"
        - "kms:GenerateDataKey"
        - "kms:GenerateDataKeyWithoutPlaintext"
        - "kms:ReEncrypt*"
        - "kms:DescribeKey"
        - "kms:CreateGrant"
        - "kms:ListGrants"
        - "kms:RevokeGrant"
      resources:
        - "arn:aws:kms:*:*:key/*"
      # Condición: Solo via S3 y DynamoDB
      conditions:
        - test: "StringEquals"
          variable: "kms:ViaService"
          values:
            - "s3.us-east-1.amazonaws.com"
            - "dynamodb.us-east-1.amazonaws.com"

    - sid: "KMSListKeys"
      effect: "Allow"
      actions:
        - "kms:ListKeys"
        - "kms:ListAliases"
      resources:
        - "*"

    - sid: "STSGetCallerIdentity"
      effect: "Allow"
      actions:
        - "sts:GetCallerIdentity"
      resources:
        - "*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"
critical: true  # Esta política es crítica para despliegues con CloudFormation

tags:
  Service: "CloudFormation"
  AccessLevel: "Deployment"
  PolicyType: "Standard"
  ManagedBy: "mci-aws-iam"
  Critical: "true"
