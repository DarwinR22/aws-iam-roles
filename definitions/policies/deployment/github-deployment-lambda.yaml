policy:
  name: "github-deployment-lambda"
  description: "Despliegue completo de funciones Lambda sin restricciones ABAC para CI/CD"
  service: "lambda"
  version: "1.0.0"
  
  statements:
    - sid: "LambdaFullDeployment"
      effect: "Allow"
      actions:
        - "lambda:CreateFunction"
        - "lambda:UpdateFunctionCode"
        - "lambda:UpdateFunctionConfiguration"
        - "lambda:DeleteFunction"
        - "lambda:GetFunction"
        - "lambda:GetFunctionConfiguration"
        - "lambda:ListFunctions"
        - "lambda:PublishVersion"
        - "lambda:CreateAlias"
        - "lambda:UpdateAlias"
        - "lambda:DeleteAlias"
        - "lambda:GetAlias"
        - "lambda:ListAliases"
        - "lambda:AddPermission"
        - "lambda:RemovePermission"
        - "lambda:GetPolicy"
        - "lambda:TagResource"
        - "lambda:UntagResource"
        - "lambda:ListTags"
        - "lambda:InvokeFunction"
        
      resources:
        - "arn:aws:lambda:*:*:function:*"

    - sid: "LambdaLayersManagement"
      effect: "Allow"
      actions:
        - "lambda:PublishLayerVersion"
        - "lambda:DeleteLayerVersion"
        - "lambda:GetLayerVersion"
        - "lambda:ListLayers"
        - "lambda:ListLayerVersions"
      resources:
        - "arn:aws:lambda:*:*:layer:*"

    - sid: "LambdaEventSourceMapping"
      effect: "Allow"
      actions:
        - "lambda:CreateEventSourceMapping"
        - "lambda:DeleteEventSourceMapping"
        - "lambda:UpdateEventSourceMapping"
        - "lambda:GetEventSourceMapping"
        - "lambda:ListEventSourceMappings"
      resources:
        - "*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"

tags:
  Service: "Lambda"
  AccessLevel: "FullDeployment"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
