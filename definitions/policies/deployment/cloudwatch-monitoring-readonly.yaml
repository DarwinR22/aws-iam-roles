name: mci-cloudwatch-monitoring-readonly
description: "Política de solo lectura para CloudWatch: métricas, alarmas, logs y dashboards para monitoreo y debugging"
version: "1.0.0"

statements:
  - sid: CloudWatchMetricsRead
    effect: Allow
    actions:
      - cloudwatch:GetMetricStatistics
      - cloudwatch:ListMetrics
      - cloudwatch:GetMetricData
      - cloudwatch:GetMetricWidgetImage
    resources:
      - "*"

  - sid: CloudWatchAlarmsRead
    effect: Allow
    actions:
      - cloudwatch:DescribeAlarms
      - cloudwatch:DescribeAlarmsForMetric
      - cloudwatch:DescribeAlarmHistory
    resources:
      - "*"

  - sid: CloudWatchLogsRead
    effect: Allow
    actions:
      - logs:DescribeLogGroups
      - logs:DescribeLogStreams
      - logs:GetLogEvents
      - logs:FilterLogEvents
      - logs:DescribeQueries
    resources:
      - "*"

  - sid: CloudWatchInsightsRead
    effect: Allow
    actions:
      - logs:StartQuery
      - logs:GetQueryResults
      - cloudwatch:GetInsightRuleReport
    resources:
      - "*"

  - sid: CloudWatchDashboardsRead
    effect: Allow
    actions:
      - cloudwatch:GetDashboard
      - cloudwatch:ListDashboards
    resources:
      - "*"

tags:
  ManagedBy: "mci-aws-iam"
  Environment: "all"
  Service: "CloudWatch"
  Type: "Monitoring"
  Access: "ReadOnly"
