# CloudWatch Logs Policy for GitHub Actions
# Allows reading CloudWatch logs for monitoring and debugging

policy:
  name: "cloudwatch-logs-readonly"
  description: "Permite lectura de logs de CloudWatch para monitoreo y debugging de deployments"
  path: "/"
  
  # Metadata for policy management
  metadata:
    version: "1.0.0"
    created_by: "DevOps Team"
    created_date: "2025-10-01"
    purpose: "CloudWatch Logs read access for CI/CD monitoring"
    risk_level: "low"
  
  # Policy statements
  statements:
    - sid: "CloudWatchLogsReadAccess"
      effect: "Allow"
      actions:
        - "logs:DescribeLogGroups"
        - "logs:DescribeLogStreams"
        - "logs:GetLogEvents"
        - "logs:FilterLogEvents"
        - "logs:StartQuery"
        - "logs:StopQuery"
        - "logs:DescribeQueries"
        - "logs:GetQueryResults"
      resources: 
        - "arn:aws:logs:*:*:log-group:/aws/github-actions/*"
        - "arn:aws:logs:*:*:log-group:/aws/lambda/*"
    
    - sid: "CloudWatchMetricsReadAccess"
      effect: "Allow"
      actions:
        - "cloudwatch:GetMetricStatistics"
        - "cloudwatch:ListMetrics"
        - "cloudwatch:GetMetricData"
      resources:
        - "*"

  # Organizational tags
  tags:
    "Pais": "rg"
    "Gerencia": "MCI"
    "Area": "DevOps"
    "Ambiente": "dev"
    "Tipo de Recurso": "IAMPolicy"
    "Propietario": "DarwinLopez"
    "Creado Por": "DarwinLopez"
    "Versión": "v1.0.0"
    "Fecha de Creacion": "2025-09-29"