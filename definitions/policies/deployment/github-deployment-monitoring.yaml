policy:
  name: "github-deployment-monitoring"
  description: "Gestión de servicios de monitoreo y seguridad del SGSI (CloudTrail, Config, GuardDuty, Security Hub)"
  service: "monitoring"
  version: "2.0.0"
  
  statements:
    # ===========================================
    # CLOUDTRAIL MANAGEMENT
    # ===========================================
    - sid: "CloudTrailManagement"
      effect: "Allow"
      actions:
        - "cloudtrail:CreateTrail"
        - "cloudtrail:DeleteTrail"
        - "cloudtrail:DescribeTrails"
        - "cloudtrail:GetTrailStatus"
        - "cloudtrail:StartLogging"
        - "cloudtrail:StopLogging"
        - "cloudtrail:UpdateTrail"
        - "cloudtrail:PutEventSelectors"
        - "cloudtrail:GetEventSelectors"
        - "cloudtrail:PutInsightSelectors"
        - "cloudtrail:GetInsightSelectors"
        - "cloudtrail:CreateEventDataStore"
        - "cloudtrail:DeleteEventDataStore"
        - "cloudtrail:GetEventDataStore"
        - "cloudtrail:ListEventDataStores"
        - "cloudtrail:AddTags"
        - "cloudtrail:RemoveTags"
        - "cloudtrail:ListTags"
      resources: ["*"]

    # ===========================================
    # AWS CONFIG MANAGEMENT
    # ===========================================
    - sid: "ConfigManagement"
      effect: "Allow"
      actions:
        - "config:PutConfigurationRecorder"
        - "config:DeleteConfigurationRecorder"
        - "config:DescribeConfigurationRecorders"
        - "config:PutDeliveryChannel"
        - "config:DeleteDeliveryChannel"
        - "config:DescribeDeliveryChannels"
        - "config:StartConfigurationRecorder"
        - "config:StopConfigurationRecorder"
        - "config:PutConfigRule"
        - "config:DeleteConfigRule"
        - "config:DescribeConfigRules"
        - "config:GetComplianceDetailsByConfigRule"
        - "config:GetComplianceSummaryByConfigRule"
        - "config:PutRemediationConfigurations"
        - "config:DeleteRemediationConfiguration"
        - "config:DescribeRemediationConfigurations"
        - "config:PutOrganizationConfigRule"
        - "config:DeleteOrganizationConfigRule"
      resources: ["*"]

    # ===========================================
    # SECURITY MONITORING SERVICES
    # ===========================================
    - sid: "SecurityMonitoring"
      effect: "Allow"
      actions:
        # GuardDuty
        - "guardduty:CreateDetector"
        - "guardduty:DeleteDetector"
        - "guardduty:GetDetector"
        - "guardduty:ListDetectors"
        - "guardduty:UpdateDetector"
        - "guardduty:CreateIPSet"
        - "guardduty:DeleteIPSet"
        - "guardduty:GetIPSet"
        - "guardduty:ListIPSets"
        - "guardduty:UpdateIPSet"
        - "guardduty:CreateThreatIntelSet"
        - "guardduty:DeleteThreatIntelSet"
        - "guardduty:GetThreatIntelSet"
        - "guardduty:ListThreatIntelSets"
        - "guardduty:UpdateThreatIntelSet"
        - "guardduty:CreateFilter"
        - "guardduty:DeleteFilter"
        - "guardduty:GetFilter"
        - "guardduty:ListFilters"
        - "guardduty:UpdateFilter"
        - "guardduty:CreatePublishingDestination"
        - "guardduty:DeletePublishingDestination"
        - "guardduty:DescribePublishingDestination"
        - "guardduty:ListPublishingDestinations"
        # Security Hub
        - "securityhub:EnableSecurityHub"
        - "securityhub:DisableSecurityHub"
        - "securityhub:GetEnabledStandards"
        - "securityhub:BatchEnableStandards"
        - "securityhub:BatchDisableStandards"
        - "securityhub:UpdateStandardsControl"
        - "securityhub:CreateInsight"
        - "securityhub:DeleteInsight"
        - "securityhub:GetInsights"
        - "securityhub:UpdateInsight"
        - "securityhub:CreateCustomAction"
        - "securityhub:DeleteCustomAction"
        - "securityhub:GetCustomActions"
        - "securityhub:UpdateCustomAction"
        - "securityhub:EnableImportFindingsForProduct"
        - "securityhub:DisableImportFindingsForProduct"
        - "securityhub:ListEnabledProductsForImport"
      resources: ["*"]

    # ===========================================
    # COMPLIANCE AND ASSESSMENT TOOLS
    # ===========================================
    - sid: "ComplianceTools"
      effect: "Allow"
      actions:
        # Inspector
        - "inspector2:EnableInspector"
        - "inspector2:DisableInspector"
        - "inspector2:GetConfiguration"
        - "inspector2:UpdateConfiguration"
        - "inspector2:CreateFilter"
        - "inspector2:DeleteFilter"
        - "inspector2:GetFilter"
        - "inspector2:ListFilters"
        - "inspector2:UpdateFilter"
        - "inspector:CreateAssessmentTarget"
        - "inspector:DeleteAssessmentTarget"
        - "inspector:DescribeAssessmentTargets"
        - "inspector:CreateAssessmentTemplate"
        - "inspector:DeleteAssessmentTemplate"
        - "inspector:DescribeAssessmentTemplates"
        - "inspector:StartAssessmentRun"
        - "inspector:StopAssessmentRun"
        - "inspector:DescribeAssessmentRuns"
        # Systems Manager Compliance
        - "ssm:PutComplianceItems"
        - "ssm:ListComplianceItems"
        - "ssm:ListComplianceSummary"
        - "ssm:GetComplianceSummary"
        - "ssm:CreateAssociation"
        - "ssm:DeleteAssociation"
        - "ssm:DescribeAssociations"
        - "ssm:UpdateAssociation"
        - "ssm:CreateDocument"
        - "ssm:DeleteDocument"
        - "ssm:DescribeDocument"
        - "ssm:ListDocuments"
        - "ssm:UpdateDocument"
        # Trusted Advisor
        - "support:DescribeTrustedAdvisorChecks"
        - "support:DescribeTrustedAdvisorCheckResult"
        - "support:RefreshTrustedAdvisorCheck"
        # Well-Architected Tool
        - "wellarchitected:CreateWorkload"
        - "wellarchitected:DeleteWorkload"
        - "wellarchitected:GetWorkload"
        - "wellarchitected:ListWorkloads"
        - "wellarchitected:UpdateWorkload"
        - "wellarchitected:CreateLensReview"
        - "wellarchitected:DeleteLensReview"
        - "wellarchitected:GetLensReview"
        - "wellarchitected:UpdateLensReview"
      resources: ["*"]

    # ===========================================
    # EVENT MANAGEMENT
    # ===========================================
    - sid: "EventBridgeManagement"
      effect: "Allow"
      actions:
        - "events:CreateRule"
        - "events:DeleteRule"
        - "events:DescribeRule"
        - "events:ListRules"
        - "events:PutRule"
        - "events:PutTargets"
        - "events:RemoveTargets"
        - "events:EnableRule"
        - "events:DisableRule"
      resources: ["*"]

