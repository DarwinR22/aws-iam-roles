policy:
  name: "github-deployment-application"
  description: "Política consolidada de servicios de aplicación (Lambda, S3, DynamoDB, EventBridge) para GitHub Actions deployment con control ABAC basado en tags"
  service: "application"
  version: "1.0.0"
  
  statements:
    # ===========================================
    # LAMBDA PERMISSIONS (from github-deployment-lambda)
    # ===========================================
    - sid: "LambdaManagementWithABAC"
      effect: "Allow"
      actions:
        # Core Lambda function management
        - "lambda:CreateFunction"
        - "lambda:UpdateFunctionCode"
        - "lambda:UpdateFunctionConfiguration"
        - "lambda:DeleteFunction"
        - "lambda:GetFunction"
        - "lambda:GetFunctionConfiguration"
        - "lambda:ListFunctions"
        - "lambda:ListVersionsByFunction"
        - "lambda:PublishVersion"
        # Lambda versioning and aliases
        - "lambda:CreateAlias"
        - "lambda:UpdateAlias"
        - "lambda:DeleteAlias"
        - "lambda:GetAlias"
        - "lambda:ListAliases"
        # Lambda event source mappings
        - "lambda:CreateEventSourceMapping"
        - "lambda:UpdateEventSourceMapping"
        - "lambda:DeleteEventSourceMapping"
        - "lambda:GetEventSourceMapping"
        - "lambda:ListEventSourceMappings"
        # Lambda permissions and policies
        - "lambda:AddPermission"
        - "lambda:RemovePermission"
        - "lambda:GetPolicy"
        # Lambda tags and metadata
        - "lambda:TagResource"
        - "lambda:UntagResource"
        - "lambda:ListTags"
      resources: ["*"]

    # ===========================================
    # S3 PERMISSIONS (from github-deployment-s3)
    # ===========================================
    - sid: "S3BucketManagementWithABAC"
      effect: "Allow"
      actions:
        # Bucket lifecycle management
        - "s3:CreateBucket"
        - "s3:DeleteBucket"
        - "s3:ListBucket"
        - "s3:ListAllMyBuckets"
        - "s3:GetBucketLocation"
        # Bucket configuration
        - "s3:GetBucketVersioning"
        - "s3:PutBucketVersioning"
        - "s3:GetBucketEncryption"
        - "s3:PutBucketEncryption"
        - "s3:GetBucketPublicAccessBlock"
        - "s3:PutBucketPublicAccessBlock"
        - "s3:GetBucketNotification"
        - "s3:PutBucketNotification"
        # Bucket policies and ACLs
        - "s3:GetBucketPolicy"
        - "s3:PutBucketPolicy"
        - "s3:DeleteBucketPolicy"
        - "s3:GetBucketAcl"
        - "s3:PutBucketAcl"
        # Bucket tags
        - "s3:GetBucketTagging"
        - "s3:PutBucketTagging"
      resources: 
        - "arn:aws:s3:::mci-*"
        - "arn:aws:s3:::github-*"  
        - "arn:aws:s3:::sgsi-*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "S3ObjectManagementWithABAC"
      effect: "Allow"
      actions:
        # Object lifecycle management
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:DeleteObject"
        - "s3:GetObjectVersion"
        - "s3:DeleteObjectVersion"
        # Object metadata and attributes
        - "s3:GetObjectAttributes"
        - "s3:GetObjectAcl"
        - "s3:PutObjectAcl"
        # Object tags
        - "s3:GetObjectTagging"
        - "s3:PutObjectTagging"
        - "s3:DeleteObjectTagging"
      resources:
        - "arn:aws:s3:::mci-*/*"
        - "arn:aws:s3:::github-*/*"
        - "arn:aws:s3:::sgsi-*/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # DYNAMODB PERMISSIONS (from github-deployment-dynamodb)
    # ===========================================
    - sid: "DynamoDBManagementWithABAC"
      effect: "Allow"
      actions:
        # Table lifecycle management
        - "dynamodb:CreateTable"
        - "dynamodb:DeleteTable"
        - "dynamodb:DescribeTable"
        - "dynamodb:ListTables"
        - "dynamodb:UpdateTable"
        # Table configuration and settings
        - "dynamodb:DescribeTimeToLive"
        - "dynamodb:UpdateTimeToLive"
        - "dynamodb:DescribeBackup"
        - "dynamodb:CreateBackup"
        - "dynamodb:DeleteBackup"
        - "dynamodb:ListBackups"
        - "dynamodb:RestoreTableFromBackup"
        # Point-in-time recovery
        - "dynamodb:DescribeContinuousBackups"
        - "dynamodb:UpdateContinuousBackups"
        # Table tags
        - "dynamodb:TagResource"
        - "dynamodb:UntagResource"
        - "dynamodb:ListTagsOfResource"
        # Global tables (if needed)
        - "dynamodb:CreateGlobalTable"
        - "dynamodb:UpdateGlobalTable"
        - "dynamodb:DescribeGlobalTable"
        - "dynamodb:ListGlobalTables"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"
        StringLike:
          "dynamodb:TableName":
            - "mci-*"
            - "github-*"
            - "sgsi-*"

    # ===========================================
    # ELASTIC LOAD BALANCING PERMISSIONS (ALB/NLB)
    # ===========================================
    - sid: "ELBManagementWithABAC"
      effect: "Allow"
      actions:
        # Load Balancer lifecycle
        - "elasticloadbalancing:CreateLoadBalancer"
        - "elasticloadbalancing:DeleteLoadBalancer"
        - "elasticloadbalancing:DescribeLoadBalancers"
        - "elasticloadbalancing:DescribeLoadBalancerAttributes"
        - "elasticloadbalancing:ModifyLoadBalancerAttributes"
        - "elasticloadbalancing:SetLoadBalancerPoliciesOfListener"
        # Target Groups
        - "elasticloadbalancing:CreateTargetGroup"
        - "elasticloadbalancing:DeleteTargetGroup"
        - "elasticloadbalancing:DescribeTargetGroups"
        - "elasticloadbalancing:DescribeTargetGroupAttributes"
        - "elasticloadbalancing:ModifyTargetGroup"
        - "elasticloadbalancing:ModifyTargetGroupAttributes"
        - "elasticloadbalancing:DescribeTargetHealth"
        - "elasticloadbalancing:RegisterTargets"
        - "elasticloadbalancing:DeregisterTargets"
        # Listeners
        - "elasticloadbalancing:CreateListener"
        - "elasticloadbalancing:DeleteListener"
        - "elasticloadbalancing:DescribeListeners"
        - "elasticloadbalancing:ModifyListener"
        - "elasticloadbalancing:DescribeListenerCertificates"
        - "elasticloadbalancing:AddListenerCertificates"
        - "elasticloadbalancing:RemoveListenerCertificates"
        # Listener Rules
        - "elasticloadbalancing:CreateRule"
        - "elasticloadbalancing:DeleteRule"
        - "elasticloadbalancing:DescribeRules"
        - "elasticloadbalancing:ModifyRule"
        - "elasticloadbalancing:SetRulePriorities"
        # SSL/TLS Certificates
        - "elasticloadbalancing:DescribeSSLPolicies"
        # Tags
        - "elasticloadbalancing:AddTags"
        - "elasticloadbalancing:RemoveTags"
        - "elasticloadbalancing:DescribeTags"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # Auto Scaling permissions for ASG integration with ALB
    - sid: "AutoScalingWithABAC"
      effect: "Allow"
      actions:
        # Auto Scaling Group lifecycle
        - "autoscaling:CreateAutoScalingGroup"
        - "autoscaling:UpdateAutoScalingGroup"
        - "autoscaling:DeleteAutoScalingGroup"
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:DescribeAutoScalingInstances"
        # Launch Templates and Configurations
        - "autoscaling:CreateLaunchConfiguration"
        - "autoscaling:DeleteLaunchConfiguration"
        - "autoscaling:DescribeLaunchConfigurations"
        # Scaling Policies
        - "autoscaling:PutScalingPolicy"
        - "autoscaling:DeletePolicy"
        - "autoscaling:DescribePolicies"
        - "autoscaling:ExecutePolicy"
        # Scheduled Actions
        - "autoscaling:PutScheduledUpdateGroupAction"
        - "autoscaling:DeleteScheduledAction"
        - "autoscaling:DescribeScheduledActions"
        # Lifecycle Hooks
        - "autoscaling:PutLifecycleHook"
        - "autoscaling:DeleteLifecycleHook"
        - "autoscaling:DescribeLifecycleHooks"
        - "autoscaling:CompleteLifecycleAction"
        # Instance Management
        - "autoscaling:AttachInstances"
        - "autoscaling:DetachInstances"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:SetInstanceHealth"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        # Load Balancer Integration
        - "autoscaling:AttachLoadBalancers"
        - "autoscaling:DetachLoadBalancers"
        - "autoscaling:AttachLoadBalancerTargetGroups"
        - "autoscaling:DetachLoadBalancerTargetGroups"
        - "autoscaling:DescribeLoadBalancers"
        - "autoscaling:DescribeLoadBalancerTargetGroups"
        # Tags
        - "autoscaling:CreateOrUpdateTags"
        - "autoscaling:DeleteTags"
        - "autoscaling:DescribeTags"
        # Notifications
        - "autoscaling:PutNotificationConfiguration"
        - "autoscaling:DeleteNotificationConfiguration"
        - "autoscaling:DescribeNotificationConfigurations"
        # Metrics
        - "autoscaling:EnableMetricsCollection"
        - "autoscaling:DisableMetricsCollection"
        - "autoscaling:DescribeMetricCollectionTypes"
        # Instance Refresh
        - "autoscaling:StartInstanceRefresh"
        - "autoscaling:CancelInstanceRefresh"
        - "autoscaling:DescribeInstanceRefreshes"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # EC2 Launch Template permissions for ASG
    - sid: "EC2LaunchTemplateManagement"
      effect: "Allow"
      actions:
        # Launch Templates
        - "ec2:CreateLaunchTemplate"
        - "ec2:CreateLaunchTemplateVersion"
        - "ec2:DeleteLaunchTemplate"
        - "ec2:DeleteLaunchTemplateVersions"
        - "ec2:DescribeLaunchTemplates"
        - "ec2:DescribeLaunchTemplateVersions"
        - "ec2:GetLaunchTemplateData"
        - "ec2:ModifyLaunchTemplate"
        # Instance Types and AMIs
        - "ec2:DescribeImages"
        - "ec2:DescribeInstanceTypes"
        - "ec2:DescribeInstanceAttribute"
        - "ec2:DescribeInstances"
        # Security and Networking for Launch Templates
        - "ec2:DescribeSecurityGroups"
        - "ec2:DescribeSubnets"
        - "ec2:DescribeVpcs"
        # Key Pairs
        - "ec2:DescribeKeyPairs"
        # Tags
        - "ec2:CreateTags"
        - "ec2:DeleteTags"
        - "ec2:DescribeTags"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # IAM PassRole for EC2 instances and Auto Scaling
    - sid: "IAMPassRoleForEC2AndASG"
      effect: "Allow"
      actions:
        - "iam:PassRole"
      resources:
        - "arn:aws:iam::*:role/sgsi-*"
        - "arn:aws:iam::*:role/mci-*"
        - "arn:aws:iam::*:role/github-*"
      conditions:
        StringEquals:
          "iam:PassedToService":
            - "ec2.amazonaws.com"
            - "autoscaling.amazonaws.com"

    # ===========================================
    # EVENTBRIDGE PERMISSIONS (from github-deployment-eventbridge)
    # ===========================================
    - sid: "EventBridgeManagementWithABAC"
      effect: "Allow"
      actions:
        # EventBridge rules and targets
        - "events:PutRule"
        - "events:DeleteRule"
        - "events:DescribeRule"
        - "events:ListRules"
        - "events:PutTargets"
        - "events:RemoveTargets"
        - "events:ListTargetsByRule"
        # Custom event buses
        - "events:CreateEventBus"
        - "events:DeleteEventBus"
        - "events:DescribeEventBus"
        - "events:ListEventBuses"
        # EventBridge connections and destinations
        - "events:CreateConnection"
        - "events:UpdateConnection"
        - "events:DeleteConnection"
        - "events:DescribeConnection"
        - "events:ListConnections"
        # EventBridge permissions
        - "events:PutPermission"
        - "events:RemovePermission"
        - "events:DescribeEventSource"
        - "events:ListEventSources"
        # EventBridge tags
        - "events:TagResource"
        - "events:UntagResource"
        - "events:ListTagsForResource"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"
        StringLike:
          "events:RuleName":
            - "mci-*"
            - "github-*"
            - "sgsi-*"

    # Step Functions permissions (related to EventBridge workflows)
    - sid: "StepFunctionsManagementWithABAC"
      effect: "Allow"
      actions:
        # State machine lifecycle
        - "states:CreateStateMachine"
        - "states:UpdateStateMachine"
        - "states:DeleteStateMachine"
        - "states:DescribeStateMachine"
        - "states:ListStateMachines"
        # State machine execution
        - "states:StartExecution"
        - "states:StopExecution"
        - "states:DescribeExecution"
        - "states:ListExecutions"
        - "states:GetExecutionHistory"
        # State machine tags
        - "states:TagResource"
        - "states:UntagResource"
        - "states:ListTagsForResource"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"
        StringLike:
          "states:StateMachineName":
            - "mci-*"
            - "github-*"  
            - "sgsi-*"

  # Organizational tags for compliance and governance
  tags:
    # Core organizational tags
    "Pais": "RG"
    "Gerencia": "MejoraContinuaEInformacion"
    "Area": "DevOps"
    "Ambiente": "DEV"
    "Direccion": "TICENAM"
    "Modulo": "Application"
    
    # Compliance and governance
    "AlcanceSOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    
    # Technical classification
    "Layer": "Application"
    "Dominio": "BusinessIntelligence"
    "Subdominio": "Analytics"
    "Aplicacion": "CICD"
    
    # Resource identification
    "Name": "github-deployment-application"
    "Tipo de Recurso": "IAMPolicy"
    
    # Contact and support information
    "Soporte": "darwin.lopez@claro.com.gt"
    "Contacto": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    
    # Lifecycle management
    "Ciclo de Vida": "Consolidacion"
    "Version": "v1.0.0"
    "Fecha de Creacion": "2025-10-18"
    "Consolidates": "Lambda-S3-DynamoDB-EventBridge"