policy:
  name: "github-deployment-glue"
  description: "Gestión de Glue, IAM PassRole y KMS para despliegue de infraestructura con ABAC"
  service: "glue"
  version: "1.0.0"
  
  statements:
    - sid: "GlueFullManagement"
      effect: "Allow"
      actions:
        - "glue:CreateDatabase"
        - "glue:DeleteDatabase"
        - "glue:GetDatabase"
        - "glue:GetDatabases"
        - "glue:UpdateDatabase"
        - "glue:CreateTable"
        - "glue:DeleteTable"
        - "glue:GetTable"
        - "glue:GetTables"
        - "glue:UpdateTable"
        - "glue:CreatePartition"
        - "glue:DeletePartition"
        - "glue:GetPartition"
        - "glue:GetPartitions"
        - "glue:UpdatePartition"
        - "glue:BatchCreatePartition"
        - "glue:BatchDeletePartition"
        - "glue:BatchGetPartition"
        - "glue:BatchUpdatePartition"
        - "glue:CreateJob"
        - "glue:DeleteJob"
        - "glue:GetJob"
        - "glue:GetJobs"
        - "glue:UpdateJob"
        - "glue:StartJobRun"
        - "glue:StopJobRun"
        - "glue:GetJobRun"
        - "glue:GetJobRuns"
        - "glue:GetJobBookmark"
        - "glue:ResetJobBookmark"
        - "glue:CreateCrawler"
        - "glue:DeleteCrawler"
        - "glue:GetCrawler"
        - "glue:GetCrawlers"
        - "glue:UpdateCrawler"
        - "glue:StartCrawler"
        - "glue:StopCrawler"
        - "glue:GetCrawlerMetrics"
        - "glue:CreateTrigger"
        - "glue:DeleteTrigger"
        - "glue:GetTrigger"
        - "glue:GetTriggers"
        - "glue:UpdateTrigger"
        - "glue:StartTrigger"
        - "glue:StopTrigger"
        - "glue:CreateWorkflow"
        - "glue:DeleteWorkflow"
        - "glue:GetWorkflow"
        - "glue:UpdateWorkflow"
        - "glue:TagResource"
        - "glue:UntagResource"
        - "glue:GetTags"
        
      resources:
        - "arn:aws:glue:*:*:catalog"
        - "arn:aws:glue:*:*:database/*"
        - "arn:aws:glue:*:*:table/*"
        - "arn:aws:glue:*:*:job/*"
        - "arn:aws:glue:*:*:crawler/*"
        - "arn:aws:glue:*:*:trigger/*"
        - "arn:aws:glue:*:*:workflow/*"
        
      # ✅ Sin restricción ABAC: Roles de deployment deben crear Glue jobs para cualquier gerencia

    - sid: "IAMPassRoleForServices"
      effect: "Allow"
      actions:
        - "iam:PassRole"
      resources:
        - "arn:aws:iam::*:role/*"
      conditions:
        - test: "StringEquals"
          variable: "iam:PassedToService"
          values:
            - "lambda.amazonaws.com"
            - "glue.amazonaws.com"
            - "states.amazonaws.com"
            - "events.amazonaws.com"

    - sid: "IAMReadOnlyForInfra"
      effect: "Allow"
      actions:
        - "iam:GetRole"
        - "iam:GetRolePolicy"
        - "iam:GetPolicy"
        - "iam:GetPolicyVersion"
        - "iam:ListAttachedRolePolicies"
        - "iam:ListRolePolicies"
        - "iam:ListPolicyVersions"
      resources:
        - "arn:aws:iam::*:role/*"
        - "arn:aws:iam::*:policy/*"

    - sid: "KMSFullAccess"
      effect: "Allow"
      actions:
        - "kms:Decrypt"
        - "kms:Encrypt"
        - "kms:DescribeKey"
        - "kms:GenerateDataKey"
        - "kms:GenerateDataKeyWithoutPlaintext"
        - "kms:CreateGrant"
        - "kms:ListGrants"
        - "kms:ListKeys"
        - "kms:ListAliases"
        - "kms:ReEncrypt"
      resources:
        - "*"

    - sid: "STSAssumeRole"
      effect: "Allow"
      actions:
        - "sts:AssumeRole"
        - "sts:GetCallerIdentity"
      resources:
        - "*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"

tags:
  Service: "Glue-IAM-KMS"
  AccessLevel: "FullManagement"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
