# CloudWatch and Monitoring Read-Only Policy
# Provides read-only access to CloudWatch metrics and logs for monitoring purposes

policy:
  name: "github-actions-monitoring-readonly"
  description: "Read-only access to CloudWatch metrics and logs for CI/CD monitoring"
  path: "/"
  
  # Metadata for policy management
  metadata:
    version: "1.0.0"
    created_by: "DevOps Team"
    created_date: "2025-10-01"
    purpose: "Enable CloudWatch monitoring access for CI/CD pipelines"
    risk_level: "low"

  # Policy statements
  statements:
    - sid: "CloudWatchMetricsReadOnly"
      effect: "Allow"
      actions:
        - "cloudwatch:DescribeAlarms"
        - "cloudwatch:GetMetricData"
        - "cloudwatch:GetMetricStatistics"
        - "cloudwatch:ListMetrics"
      resources:
        - "*"
    
    - sid: "CloudWatchLogsReadOnly"
      effect: "Allow"
      actions:
        - "logs:DescribeLogGroups"
        - "logs:DescribeLogStreams"
        - "logs:GetLogEvents"
        - "logs:FilterLogEvents"
      resources:
        - "*"

  # Tags for compliance and governance
  tags:
    "Pais": "rg"
    "Gerencia": "MCI"
    "Area": "DevOps"
    "Ambiente": "dev"
    "Direccion": "TIRegional"
    "Modulo": "Monitoring"
    "Alcance SOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    "Layer": "Devops"
    "Dominio": "Observability"
    "Aplicacion": "CICD"
    "Name": "github-actions-monitoring-readonly"
    "Tipo de Recurso": "IAMPolicy"
    "Soporte": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    "Ciclo de Vida": "Creacion"
    "Versión": "v1.0.0"
    "Fecha de Creacion": "2025-10-01"
