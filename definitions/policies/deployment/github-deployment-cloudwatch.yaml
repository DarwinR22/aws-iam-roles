policy:
  name: "github-deployment-cloudwatch"
  description: "Gestión completa de CloudWatch Logs, Métricas, Alarmas y SNS con ABAC"
  service: "cloudwatch"
  version: "1.0.0"
  
  statements:
    - sid: "CloudWatchLogsManagement"
      effect: "Allow"
      actions:
        - "logs:CreateLogGroup"
        - "logs:DeleteLogGroup"
        - "logs:DescribeLogGroups"
        - "logs:PutRetentionPolicy"
        - "logs:DeleteRetentionPolicy"
        - "logs:CreateLogStream"
        - "logs:DeleteLogStream"
        - "logs:DescribeLogStreams"
        - "logs:PutLogEvents"
        - "logs:GetLogEvents"
        - "logs:FilterLogEvents"
        - "logs:PutMetricFilter"
        - "logs:DeleteMetricFilter"
        - "logs:DescribeMetricFilters"
        - "logs:TagLogGroup"
        - "logs:UntagLogGroup"
        - "logs:ListTagsLogGroup"
        
      resources:
        - "arn:aws:logs:*:*:log-group:*"
        - "arn:aws:logs:*:*:log-group:*:log-stream:*"
        
      # ✅ ABAC: Solo log groups con tags coincidentes
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:RequestTag/Gerencia"
          values: ["${aws:PrincipalTag/Gerencia}"]

    - sid: "CloudWatchMetricsAndAlarms"
      effect: "Allow"
      actions:
        - "cloudwatch:PutMetricData"
        - "cloudwatch:GetMetricData"
        - "cloudwatch:GetMetricStatistics"
        - "cloudwatch:ListMetrics"
        - "cloudwatch:PutMetricAlarm"
        - "cloudwatch:DeleteAlarms"
        - "cloudwatch:DescribeAlarms"
        - "cloudwatch:DescribeAlarmsForMetric"
        - "cloudwatch:DescribeAlarmHistory"
        - "cloudwatch:SetAlarmState"
        - "cloudwatch:TagResource"
        - "cloudwatch:UntagResource"
        - "cloudwatch:ListTagsForResource"
        
      resources:
        - "arn:aws:cloudwatch:*:*:alarm:*"
        - "*"

    - sid: "CloudWatchDashboards"
      effect: "Allow"
      actions:
        - "cloudwatch:PutDashboard"
        - "cloudwatch:GetDashboard"
        - "cloudwatch:DeleteDashboards"
        - "cloudwatch:ListDashboards"
      resources:
        - "*"

    - sid: "SNSFullManagement"
      effect: "Allow"
      actions:
        - "sns:CreateTopic"
        - "sns:DeleteTopic"
        - "sns:GetTopicAttributes"
        - "sns:SetTopicAttributes"
        - "sns:ListTopics"
        - "sns:Subscribe"
        - "sns:Unsubscribe"
        - "sns:ListSubscriptions"
        - "sns:ListSubscriptionsByTopic"
        - "sns:Publish"
        - "sns:AddPermission"
        - "sns:RemovePermission"
        - "sns:TagResource"
        - "sns:UntagResource"
        - "sns:ListTagsForResource"
        
      resources:
        - "arn:aws:sns:*:*:*"
        
      # ✅ ABAC: Solo topics con tags coincidentes
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:RequestTag/Gerencia"
          values: ["${aws:PrincipalTag/Gerencia}"]

    - sid: "SNSPlatformEndpoints"
      effect: "Allow"
      actions:
        - "sns:CreatePlatformApplication"
        - "sns:DeletePlatformApplication"
        - "sns:GetPlatformApplicationAttributes"
        - "sns:SetPlatformApplicationAttributes"
        - "sns:ListPlatformApplications"
        - "sns:CreatePlatformEndpoint"
        - "sns:DeleteEndpoint"
        - "sns:GetEndpointAttributes"
        - "sns:SetEndpointAttributes"
      resources:
        - "arn:aws:sns:*:*:app/*"
        - "arn:aws:sns:*:*:endpoint/*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"

tags:
  Service: "CloudWatch-SNS"
  AccessLevel: "FullManagement"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
