policy:
  name: "github-deployment-compute"
  description: "Gestión de recursos de cómputo del SGSI (EC2, ALB, Auto Scaling, Launch Templates)"

  service: "compute"  service: "compute"

  version: "2.0.0"  version: "1.0.0"

    

  statements:  statements:

    # ===========================================    # ===========================================

    # EC2 COMPUTE INFRASTRUCTURE    # VPC AND NETWORK INFRASTRUCTURE

    # ===========================================    # ===========================================

    - sid: "EC2InstanceManagement"    - sid: "VPCManagement"

      effect: "Allow"      effect: "Allow"

      actions:      actions:

        - "ec2:RunInstances"        - "ec2:CreateVpc"

        - "ec2:TerminateInstances"        - "ec2:DeleteVpc"

        - "ec2:StartInstances"        - "ec2:ModifyVpcAttribute"

        - "ec2:StopInstances"        - "ec2:DescribeVpcs"

        - "ec2:RebootInstances"        - "ec2:DescribeVpcAttribute"

        - "ec2:DescribeInstances"        - "ec2:CreateTags"

        - "ec2:DescribeInstanceStatus"        - "ec2:DeleteTags"

        - "ec2:DescribeInstanceAttribute"        - "ec2:DescribeTags"

        - "ec2:ModifyInstanceAttribute"      resources:

        - "ec2:GetConsoleOutput"        - "arn:aws:ec2:*:*:vpc/*"

        - "ec2:GetConsoleScreenshot"      conditions:

        - "ec2:DescribeImages"        StringEquals:

        - "ec2:DescribeSnapshots"          "aws:RequestedRegion": "us-east-1"

        - "ec2:DescribeVolumes"

        - "ec2:AttachVolume"    - sid: "InternetGatewayManagement"

        - "ec2:DetachVolume"      effect: "Allow"

        - "ec2:CreateVolume"      actions:

        - "ec2:DeleteVolume"        - "ec2:CreateInternetGateway"

        - "ec2:ModifyVolume"        - "ec2:DeleteInternetGateway"

        - "ec2:CreateSnapshot"        - "ec2:AttachInternetGateway"

        - "ec2:DeleteSnapshot"        - "ec2:DetachInternetGateway"

        - "ec2:DescribeKeyPairs"        - "ec2:DescribeInternetGateways"

        - "ec2:CreateKeyPair"      resources:

        - "ec2:DeleteKeyPair"        - "arn:aws:ec2:*:*:internet-gateway/*"

      resources:        - "arn:aws:ec2:*:*:vpc/*"

        - "arn:aws:ec2:*:*:instance/*"      conditions:

        - "arn:aws:ec2:*:*:volume/*"        StringEquals:

        - "arn:aws:ec2:*:*:snapshot/*"          "aws:RequestedRegion": "us-east-1"

        - "arn:aws:ec2:*:*:image/*"

        - "arn:aws:ec2:*:*:key-pair/*"    - sid: "SubnetManagement"

        - "arn:aws:ec2:*:*:subnet/*"      effect: "Allow"

        - "arn:aws:ec2:*:*:security-group/*"      actions:

      conditions:        - "ec2:CreateSubnet"

        - test: "StringEquals"        - "ec2:DeleteSubnet"

          variable: "aws:RequestedRegion"        - "ec2:ModifySubnetAttribute"

          values: ["us-east-1"]        - "ec2:DescribeSubnets"

        - "ec2:DescribeAvailabilityZones"

    - sid: "EC2LaunchTemplatesAndAMI"      resources:

      effect: "Allow"        - "arn:aws:ec2:*:*:subnet/*"

      actions:        - "arn:aws:ec2:*:*:vpc/*"

        - "ec2:CreateLaunchTemplate"      conditions:

        - "ec2:CreateLaunchTemplateVersion"        StringEquals:

        - "ec2:DeleteLaunchTemplate"          "aws:RequestedRegion": "us-east-1"

        - "ec2:DeleteLaunchTemplateVersions"

        - "ec2:DescribeLaunchTemplates"    - sid: "SecurityGroupManagement"

        - "ec2:DescribeLaunchTemplateVersions"      effect: "Allow"

        - "ec2:ModifyLaunchTemplate"      actions:

        - "ec2:GetLaunchTemplateData"        - "ec2:CreateSecurityGroup"

        - "ec2:CreateImage"        - "ec2:DeleteSecurityGroup"

        - "ec2:DeregisterImage"        - "ec2:AuthorizeSecurityGroupIngress"

        - "ec2:CopyImage"        - "ec2:AuthorizeSecurityGroupEgress"

        - "ec2:ModifyImageAttribute"        - "ec2:RevokeSecurityGroupIngress"

        - "ec2:ResetImageAttribute"        - "ec2:RevokeSecurityGroupEgress"

        - "ec2:DescribeImageAttribute"        - "ec2:DescribeSecurityGroups"

      resources:        - "ec2:DescribeSecurityGroupRules"

        - "arn:aws:ec2:*:*:launch-template/*"      resources:

        - "arn:aws:ec2:*:*:image/*"        - "arn:aws:ec2:*:*:security-group/*"

        - "arn:aws:ec2:*:*:instance/*"        - "arn:aws:ec2:*:*:vpc/*"

        - "arn:aws:ec2:*:*:snapshot/*"      conditions:

      conditions:        StringEquals:

        - test: "StringEquals"          "aws:RequestedRegion": "us-east-1"

          variable: "aws:RequestedRegion"

          values: ["us-east-1"]    - sid: "RouteTableManagement"

      effect: "Allow"

    # ===========================================      actions:

    # LOAD BALANCER MANAGEMENT        - "ec2:CreateRouteTable"

    # ===========================================        - "ec2:DeleteRouteTable"

    - sid: "LoadBalancerManagement"        - "ec2:AssociateRouteTable"

      effect: "Allow"        - "ec2:DisassociateRouteTable"

      actions:        - "ec2:CreateRoute"

        - "elasticloadbalancing:CreateLoadBalancer"        - "ec2:DeleteRoute"

        - "elasticloadbalancing:DeleteLoadBalancer"        - "ec2:ReplaceRoute"

        - "elasticloadbalancing:DescribeLoadBalancers"        - "ec2:DescribeRouteTables"

        - "elasticloadbalancing:DescribeLoadBalancerAttributes"      resources:

        - "elasticloadbalancing:ModifyLoadBalancerAttributes"        - "arn:aws:ec2:*:*:route-table/*"

        - "elasticloadbalancing:CreateTargetGroup"        - "arn:aws:ec2:*:*:subnet/*"

        - "elasticloadbalancing:DeleteTargetGroup"        - "arn:aws:ec2:*:*:vpc/*"

        - "elasticloadbalancing:DescribeTargetGroups"        - "arn:aws:ec2:*:*:internet-gateway/*"

        - "elasticloadbalancing:DescribeTargetGroupAttributes"        - "arn:aws:ec2:*:*:nat-gateway/*"

        - "elasticloadbalancing:ModifyTargetGroupAttributes"      conditions:

        - "elasticloadbalancing:RegisterTargets"        StringEquals:

        - "elasticloadbalancing:DeregisterTargets"          "aws:RequestedRegion": "us-east-1"

        - "elasticloadbalancing:DescribeTargetHealth"

        - "elasticloadbalancing:CreateListener"    - sid: "NATGatewayManagement"

        - "elasticloadbalancing:DeleteListener"      effect: "Allow"

        - "elasticloadbalancing:DescribeListeners"      actions:

        - "elasticloadbalancing:ModifyListener"        - "ec2:CreateNatGateway"

        - "elasticloadbalancing:CreateRule"        - "ec2:DeleteNatGateway"

        - "elasticloadbalancing:DeleteRule"        - "ec2:DescribeNatGateways"

        - "elasticloadbalancing:DescribeRules"        - "ec2:AllocateAddress"

        - "elasticloadbalancing:ModifyRule"        - "ec2:ReleaseAddress"

        - "elasticloadbalancing:AddTags"        - "ec2:DescribeAddresses"

        - "elasticloadbalancing:RemoveTags"      resources:

        - "elasticloadbalancing:DescribeTags"        - "arn:aws:ec2:*:*:nat-gateway/*"

      resources:        - "arn:aws:ec2:*:*:subnet/*"

        - "arn:aws:elasticloadbalancing:*:*:loadbalancer/*/*"        - "arn:aws:ec2:*:*:elastic-ip/*"

        - "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"      conditions:

        - "arn:aws:elasticloadbalancing:*:*:listener/*/*"        StringEquals:

        - "arn:aws:elasticloadbalancing:*:*:listener-rule/*/*"          "aws:RequestedRegion": "us-east-1"

      conditions:

        - test: "StringEquals"    # ===========================================

          variable: "aws:RequestedRegion"    # EC2 COMPUTE PERMISSIONS

          values: ["us-east-1"]    # ===========================================

    - sid: "EC2InstanceManagement"

    # ===========================================      effect: "Allow"

    # AUTO SCALING MANAGEMENT      actions:

    # ===========================================        # Instance lifecycle

    - sid: "AutoScalingManagement"        - "ec2:RunInstances"

      effect: "Allow"        - "ec2:TerminateInstances"

      actions:        - "ec2:StopInstances"

        - "autoscaling:CreateAutoScalingGroup"        - "ec2:StartInstances"

        - "autoscaling:UpdateAutoScalingGroup"        - "ec2:RebootInstances"

        - "autoscaling:DeleteAutoScalingGroup"        - "ec2:DescribeInstances"

        - "autoscaling:DescribeAutoScalingGroups"        - "ec2:DescribeInstanceStatus"

        - "autoscaling:DescribeAutoScalingInstances"        - "ec2:DescribeInstanceAttribute"

        - "autoscaling:DescribeScalingActivities"        - "ec2:ModifyInstanceAttribute"

        - "autoscaling:SetDesiredCapacity"        # Instance metadata and monitoring

        - "autoscaling:TerminateInstanceInAutoScalingGroup"        - "ec2:DescribeInstanceTypes"

        - "autoscaling:CreateLaunchConfiguration"        - "ec2:GetConsoleOutput"

        - "autoscaling:DeleteLaunchConfiguration"        - "ec2:GetPasswordData"

        - "autoscaling:DescribeLaunchConfigurations"        - "ec2:MonitorInstances"

        - "autoscaling:CreateOrUpdateTags"        - "ec2:UnmonitorInstances"

        - "autoscaling:DeleteTags"        # Instance tags

        - "autoscaling:DescribeTags"        - "ec2:CreateTags"

        - "autoscaling:PutScalingPolicy"        - "ec2:DeleteTags"

        - "autoscaling:DeletePolicy"        - "ec2:DescribeTags"

        - "autoscaling:DescribePolicies"      resources: ["*"]

        - "autoscaling:ExecutePolicy"      conditions:

        - "autoscaling:PutNotificationConfiguration"        StringEquals:

        - "autoscaling:DeleteNotificationConfiguration"          "aws:RequestedRegion": "us-east-1"

        - "autoscaling:DescribeNotificationConfigurations"        StringLike:

      resources:          "ec2:InstanceProfile":

        - "arn:aws:autoscaling:*:*:autoScalingGroup:*:autoScalingGroupName/*"            - "arn:aws:iam::*:instance-profile/sgsi-*"

        - "arn:aws:autoscaling:*:*:launchConfiguration:*:launchConfigurationName/*"            - "arn:aws:iam::*:instance-profile/mci-*"

        - "arn:aws:autoscaling:*:*:scalingPolicy:*:autoScalingGroupName/*:policyName/*"

      conditions:    # ===========================================

        - test: "StringEquals"    # EC2 LAUNCH TEMPLATES & AMI

          variable: "aws:RequestedRegion"    # ===========================================

          values: ["us-east-1"]    - sid: "EC2LaunchTemplatesAndAMI"

      effect: "Allow"

    - sid: "EC2ReadOnlyAccess"      actions:

      effect: "Allow"        # Launch Templates

      actions:        - "ec2:CreateLaunchTemplate"

        - "ec2:Describe*"        - "ec2:CreateLaunchTemplateVersion"

        - "ec2:Get*"        - "ec2:DeleteLaunchTemplate"

        - "ec2:List*"        - "ec2:DeleteLaunchTemplateVersions"

        - "elasticloadbalancing:Describe*"        - "ec2:DescribeLaunchTemplates"

        - "autoscaling:Describe*"        - "ec2:DescribeLaunchTemplateVersions"

      resources: ["*"]        - "ec2:ModifyLaunchTemplate"

        # AMI Management

# Organizational tags for compliance and governance        - "ec2:DescribeImages"

tags:        - "ec2:DescribeImageAttribute"

  # Core organizational tags        # Key Pairs

  "Pais": "RG"        - "ec2:CreateKeyPair"

  "Gerencia": "MejoraContinuaEInformacion"        - "ec2:DeleteKeyPair"

  "Area": "DevOps"        - "ec2:DescribeKeyPairs"

  "Ambiente": "DEV"        - "ec2:ImportKeyPair"

  "Direccion": "TICENAM"      resources: ["*"]

  "Modulo": "Compute"      conditions:

          StringEquals:

  # Compliance and governance          "aws:RequestedRegion": "us-east-1"

  "AlcanceSOX": "No"

  "Propietario": "DarwinLopez"    # ===========================================

  "Proveedor": "InHouse"    # APPLICATION LOAD BALANCER

      # ===========================================

  # Technical classification    - sid: "LoadBalancerManagement"

  "Layer": "Compute"      effect: "Allow"

  "Dominio": "BusinessIntelligence"      actions:

  "Subdominio": "Analytics"        # ALB Lifecycle

  "Aplicacion": "CICD"        - "elasticloadbalancing:CreateLoadBalancer"

          - "elasticloadbalancing:DeleteLoadBalancer"

  # Resource identification        - "elasticloadbalancing:DescribeLoadBalancers"

  "Name": "github-deployment-compute"        - "elasticloadbalancing:DescribeLoadBalancerAttributes"

  "Tipo de Recurso": "IAMPolicy"        - "elasticloadbalancing:ModifyLoadBalancerAttributes"

          # Target Groups

  # Contact and support information        - "elasticloadbalancing:CreateTargetGroup"

  "Soporte": "darwin.lopez@claro.com.gt"        - "elasticloadbalancing:DeleteTargetGroup"

  "Contacto": "darwin.lopez@claro.com.gt"        - "elasticloadbalancing:DescribeTargetGroups"

  "Creado Por": "DarwinLopez"        - "elasticloadbalancing:DescribeTargetGroupAttributes"

          - "elasticloadbalancing:ModifyTargetGroup"

  # Lifecycle management        - "elasticloadbalancing:ModifyTargetGroupAttributes"

  "Ciclo de Vida": "Optimizacion"        # Target Health and Registration

  "Version": "v2.0.0"        - "elasticloadbalancing:RegisterTargets"

  "Fecha de Creacion": "2025-10-19"        - "elasticloadbalancing:DeregisterTargets"

  "OptimizedFor": "AWS-Size-Limits"        - "elasticloadbalancing:DescribeTargetHealth"
        # Listeners and Rules
        - "elasticloadbalancing:CreateListener"
        - "elasticloadbalancing:DeleteListener"
        - "elasticloadbalancing:DescribeListeners"
        - "elasticloadbalancing:ModifyListener"
        - "elasticloadbalancing:CreateRule"
        - "elasticloadbalancing:DeleteRule"
        - "elasticloadbalancing:DescribeRules"
        - "elasticloadbalancing:ModifyRule"
        # Tags
        - "elasticloadbalancing:AddTags"
        - "elasticloadbalancing:RemoveTags"
        - "elasticloadbalancing:DescribeTags"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # AUTO SCALING
    # ===========================================
    - sid: "AutoScalingManagement"
      effect: "Allow"
      actions:
        # Auto Scaling Groups
        - "autoscaling:CreateAutoScalingGroup"
        - "autoscaling:DeleteAutoScalingGroup"
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:UpdateAutoScalingGroup"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        # Launch Configurations
        - "autoscaling:CreateLaunchConfiguration"
        - "autoscaling:DeleteLaunchConfiguration"
        - "autoscaling:DescribeLaunchConfigurations"
        # Scaling Policies
        - "autoscaling:PutScalingPolicy"
        - "autoscaling:DeletePolicy"
        - "autoscaling:DescribePolicies"
        - "autoscaling:ExecutePolicy"
        # Lifecycle Hooks
        - "autoscaling:PutLifecycleHook"
        - "autoscaling:DeleteLifecycleHook"
        - "autoscaling:DescribeLifecycleHooks"
        - "autoscaling:CompleteLifecycleAction"
        # Tags
        - "autoscaling:CreateOrUpdateTags"
        - "autoscaling:DeleteTags"
        - "autoscaling:DescribeTags"
        # Notifications
        - "autoscaling:PutNotificationConfiguration"
        - "autoscaling:DeleteNotificationConfiguration"
        - "autoscaling:DescribeNotificationConfigurations"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # APPLICATION AUTO SCALING
    # ===========================================
    - sid: "ApplicationAutoScalingManagement"
      effect: "Allow"
      actions:
        # Application Auto Scaling
        - "application-autoscaling:RegisterScalableTarget"
        - "application-autoscaling:DeregisterScalableTarget"
        - "application-autoscaling:DescribeScalableTargets"
        - "application-autoscaling:PutScalingPolicy"
        - "application-autoscaling:DeleteScalingPolicy"
        - "application-autoscaling:DescribeScalingPolicies"
        - "application-autoscaling:DescribeScalingActivities"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # VPC FLOW LOGS (Para monitoreo SGSI)
    # ===========================================
    - sid: "VPCFlowLogs"
      effect: "Allow"
      actions:
        - "ec2:CreateFlowLogs"
        - "ec2:DeleteFlowLogs"
        - "ec2:DescribeFlowLogs"
        - "logs:CreateLogGroup"
        - "logs:DescribeLogGroups"
        - "logs:PutRetentionPolicy"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:network-interface/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:logs:*:*:log-group:*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # READ-ONLY PERMISSIONS (Para validaciones)
    # ===========================================
    - sid: "EC2ReadOnlyAccess"
      effect: "Allow"
      actions:
        - "ec2:DescribeRegions"
        - "ec2:DescribeAccountAttributes"
        - "ec2:DescribeVpcEndpoints"
        - "ec2:DescribeNetworkAcls"
        - "ec2:DescribeVpcClassicLink"
        - "ec2:DescribeVpcClassicLinkDnsSupport"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

  # Organizational tags for compliance and governance
  tags:
    # Core organizational tags
    "Pais": "RG"
    "Gerencia": "MejoraContinuaEInformacion"
    "Area": "DevOps"
    "Ambiente": "DEV"
    "Direccion": "TICENAM"
    "Modulo": "Compute"
    
    # Compliance and governance
    "AlcanceSOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    
    # Technical classification
    "Layer": "Compute"
    "Dominio": "BusinessIntelligence"
    "Subdominio": "Analytics"
    "Aplicacion": "CICD"
    
    # Resource identification
    "Name": "github-deployment-compute"
    "Tipo de Recurso": "IAMPolicy"
    
    # Contact and support information
    "Soporte": "darwin.lopez@claro.com.gt"
    "Contacto": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    
    # Lifecycle management
    "Ciclo de Vida": "Desarrollo"
    "Version": "v1.0.0"
    "Fecha de Creacion": "2025-10-18"
    "Layer": "SGSI-Layer3-Compute"