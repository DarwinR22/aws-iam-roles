policy:
  name: "github-deployment-compute"
  description: "Política consolidada para recursos de cómputo (EC2, ALB, Auto Scaling) del SGSI Layer 3"
  service: "compute"
  version: "1.0.0"
  
  statements:
    # ===========================================
    # VPC AND NETWORK INFRASTRUCTURE
    # ===========================================
    - sid: "VPCManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateVpc"
        - "ec2:DeleteVpc"
        - "ec2:ModifyVpcAttribute"
        - "ec2:DescribeVpcs"
        - "ec2:DescribeVpcAttribute"
        - "ec2:CreateTags"
        - "ec2:DeleteTags"
        - "ec2:DescribeTags"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "InternetGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateInternetGateway"
        - "ec2:DeleteInternetGateway"
        - "ec2:AttachInternetGateway"
        - "ec2:DetachInternetGateway"
        - "ec2:DescribeInternetGateways"
      resources:
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "SubnetManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSubnet"
        - "ec2:DeleteSubnet"
        - "ec2:ModifySubnetAttribute"
        - "ec2:DescribeSubnets"
        - "ec2:DescribeAvailabilityZones"
      resources:
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "SecurityGroupManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSecurityGroup"
        - "ec2:DeleteSecurityGroup"
        - "ec2:AuthorizeSecurityGroupIngress"
        - "ec2:AuthorizeSecurityGroupEgress"
        - "ec2:RevokeSecurityGroupIngress"
        - "ec2:RevokeSecurityGroupEgress"
        - "ec2:DescribeSecurityGroups"
        - "ec2:DescribeSecurityGroupRules"
      resources:
        - "arn:aws:ec2:*:*:security-group/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "RouteTableManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateRouteTable"
        - "ec2:DeleteRouteTable"
        - "ec2:AssociateRouteTable"
        - "ec2:DisassociateRouteTable"
        - "ec2:CreateRoute"
        - "ec2:DeleteRoute"
        - "ec2:ReplaceRoute"
        - "ec2:DescribeRouteTables"
      resources:
        - "arn:aws:ec2:*:*:route-table/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:nat-gateway/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    - sid: "NATGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateNatGateway"
        - "ec2:DeleteNatGateway"
        - "ec2:DescribeNatGateways"
        - "ec2:AllocateAddress"
        - "ec2:ReleaseAddress"
        - "ec2:DescribeAddresses"
      resources:
        - "arn:aws:ec2:*:*:nat-gateway/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:elastic-ip/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # EC2 COMPUTE PERMISSIONS
    # ===========================================
    - sid: "EC2InstanceManagement"
      effect: "Allow"
      actions:
        # Instance lifecycle
        - "ec2:RunInstances"
        - "ec2:TerminateInstances"
        - "ec2:StopInstances"
        - "ec2:StartInstances"
        - "ec2:RebootInstances"
        - "ec2:DescribeInstances"
        - "ec2:DescribeInstanceStatus"
        - "ec2:DescribeInstanceAttribute"
        - "ec2:ModifyInstanceAttribute"
        # Instance metadata and monitoring
        - "ec2:DescribeInstanceTypes"
        - "ec2:GetConsoleOutput"
        - "ec2:GetPasswordData"
        - "ec2:MonitorInstances"
        - "ec2:UnmonitorInstances"
        # Instance tags
        - "ec2:CreateTags"
        - "ec2:DeleteTags"
        - "ec2:DescribeTags"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"
        StringLike:
          "ec2:InstanceProfile":
            - "arn:aws:iam::*:instance-profile/sgsi-*"
            - "arn:aws:iam::*:instance-profile/mci-*"

    # ===========================================
    # EC2 LAUNCH TEMPLATES & AMI
    # ===========================================
    - sid: "EC2LaunchTemplatesAndAMI"
      effect: "Allow"
      actions:
        # Launch Templates
        - "ec2:CreateLaunchTemplate"
        - "ec2:CreateLaunchTemplateVersion"
        - "ec2:DeleteLaunchTemplate"
        - "ec2:DeleteLaunchTemplateVersions"
        - "ec2:DescribeLaunchTemplates"
        - "ec2:DescribeLaunchTemplateVersions"
        - "ec2:ModifyLaunchTemplate"
        # AMI Management
        - "ec2:DescribeImages"
        - "ec2:DescribeImageAttribute"
        # Key Pairs
        - "ec2:CreateKeyPair"
        - "ec2:DeleteKeyPair"
        - "ec2:DescribeKeyPairs"
        - "ec2:ImportKeyPair"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # APPLICATION LOAD BALANCER
    # ===========================================
    - sid: "LoadBalancerManagement"
      effect: "Allow"
      actions:
        # ALB Lifecycle
        - "elasticloadbalancing:CreateLoadBalancer"
        - "elasticloadbalancing:DeleteLoadBalancer"
        - "elasticloadbalancing:DescribeLoadBalancers"
        - "elasticloadbalancing:DescribeLoadBalancerAttributes"
        - "elasticloadbalancing:ModifyLoadBalancerAttributes"
        # Target Groups
        - "elasticloadbalancing:CreateTargetGroup"
        - "elasticloadbalancing:DeleteTargetGroup"
        - "elasticloadbalancing:DescribeTargetGroups"
        - "elasticloadbalancing:DescribeTargetGroupAttributes"
        - "elasticloadbalancing:ModifyTargetGroup"
        - "elasticloadbalancing:ModifyTargetGroupAttributes"
        # Target Health and Registration
        - "elasticloadbalancing:RegisterTargets"
        - "elasticloadbalancing:DeregisterTargets"
        - "elasticloadbalancing:DescribeTargetHealth"
        # Listeners and Rules
        - "elasticloadbalancing:CreateListener"
        - "elasticloadbalancing:DeleteListener"
        - "elasticloadbalancing:DescribeListeners"
        - "elasticloadbalancing:ModifyListener"
        - "elasticloadbalancing:CreateRule"
        - "elasticloadbalancing:DeleteRule"
        - "elasticloadbalancing:DescribeRules"
        - "elasticloadbalancing:ModifyRule"
        # Tags
        - "elasticloadbalancing:AddTags"
        - "elasticloadbalancing:RemoveTags"
        - "elasticloadbalancing:DescribeTags"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # AUTO SCALING
    # ===========================================
    - sid: "AutoScalingManagement"
      effect: "Allow"
      actions:
        # Auto Scaling Groups
        - "autoscaling:CreateAutoScalingGroup"
        - "autoscaling:DeleteAutoScalingGroup"
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:UpdateAutoScalingGroup"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        # Launch Configurations
        - "autoscaling:CreateLaunchConfiguration"
        - "autoscaling:DeleteLaunchConfiguration"
        - "autoscaling:DescribeLaunchConfigurations"
        # Scaling Policies
        - "autoscaling:PutScalingPolicy"
        - "autoscaling:DeletePolicy"
        - "autoscaling:DescribePolicies"
        - "autoscaling:ExecutePolicy"
        # Lifecycle Hooks
        - "autoscaling:PutLifecycleHook"
        - "autoscaling:DeleteLifecycleHook"
        - "autoscaling:DescribeLifecycleHooks"
        - "autoscaling:CompleteLifecycleAction"
        # Tags
        - "autoscaling:CreateOrUpdateTags"
        - "autoscaling:DeleteTags"
        - "autoscaling:DescribeTags"
        # Notifications
        - "autoscaling:PutNotificationConfiguration"
        - "autoscaling:DeleteNotificationConfiguration"
        - "autoscaling:DescribeNotificationConfigurations"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # APPLICATION AUTO SCALING
    # ===========================================
    - sid: "ApplicationAutoScalingManagement"
      effect: "Allow"
      actions:
        # Application Auto Scaling
        - "application-autoscaling:RegisterScalableTarget"
        - "application-autoscaling:DeregisterScalableTarget"
        - "application-autoscaling:DescribeScalableTargets"
        - "application-autoscaling:PutScalingPolicy"
        - "application-autoscaling:DeleteScalingPolicy"
        - "application-autoscaling:DescribeScalingPolicies"
        - "application-autoscaling:DescribeScalingActivities"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # VPC FLOW LOGS (Para monitoreo SGSI)
    # ===========================================
    - sid: "VPCFlowLogs"
      effect: "Allow"
      actions:
        - "ec2:CreateFlowLogs"
        - "ec2:DeleteFlowLogs"
        - "ec2:DescribeFlowLogs"
        - "logs:CreateLogGroup"
        - "logs:DescribeLogGroups"
        - "logs:PutRetentionPolicy"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:network-interface/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:logs:*:*:log-group:*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

    # ===========================================
    # READ-ONLY PERMISSIONS (Para validaciones)
    # ===========================================
    - sid: "EC2ReadOnlyAccess"
      effect: "Allow"
      actions:
        - "ec2:DescribeRegions"
        - "ec2:DescribeAccountAttributes"
        - "ec2:DescribeVpcEndpoints"
        - "ec2:DescribeNetworkAcls"
        - "ec2:DescribeVpcClassicLink"
        - "ec2:DescribeVpcClassicLinkDnsSupport"
      resources: ["*"]
      conditions:
        StringEquals:
          "aws:RequestedRegion": "us-east-1"

  # Organizational tags for compliance and governance
  tags:
    # Core organizational tags
    "Pais": "RG"
    "Gerencia": "MejoraContinuaEInformacion"
    "Area": "DevOps"
    "Ambiente": "DEV"
    "Direccion": "TICENAM"
    "Modulo": "Compute"
    
    # Compliance and governance
    "AlcanceSOX": "No"
    "Propietario": "DarwinLopez"
    "Proveedor": "InHouse"
    
    # Technical classification
    "Layer": "Compute"
    "Dominio": "BusinessIntelligence"
    "Subdominio": "Analytics"
    "Aplicacion": "CICD"
    
    # Resource identification
    "Name": "github-deployment-compute"
    "Tipo de Recurso": "IAMPolicy"
    
    # Contact and support information
    "Soporte": "darwin.lopez@claro.com.gt"
    "Contacto": "darwin.lopez@claro.com.gt"
    "Creado Por": "DarwinLopez"
    
    # Lifecycle management
    "Ciclo de Vida": "Desarrollo"
    "Version": "v1.0.0"
    "Fecha de Creacion": "2025-10-18"
    "Layer": "SGSI-Layer3-Compute"