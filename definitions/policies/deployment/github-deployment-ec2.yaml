policy:
  name: "github-deployment-ec2"
  description: "Permisos EC2 y VPC para GitHub Actions deployment con SGSI"
  service: "ec2"
  version: "1.0.0"
  
  statements:
    # =========================================
    # VPC MANAGEMENT
    # =========================================
    - sid: "VPCManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateVpc"
        - "ec2:DeleteVpc"
        - "ec2:ModifyVpcAttribute"
        - "ec2:DescribeVpcs"
        - "ec2:DescribeVpcAttribute"
        - "ec2:CreateTags"
        - "ec2:DeleteTags"
        - "ec2:DescribeTags"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # INTERNET GATEWAY MANAGEMENT  
    # =========================================
    - sid: "InternetGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateInternetGateway"
        - "ec2:DeleteInternetGateway"
        - "ec2:AttachInternetGateway"
        - "ec2:DetachInternetGateway"
        - "ec2:DescribeInternetGateways"
      resources:
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # SUBNET MANAGEMENT
    # =========================================
    - sid: "SubnetManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSubnet"
        - "ec2:DeleteSubnet"
        - "ec2:ModifySubnetAttribute"
        - "ec2:DescribeSubnets"
        - "ec2:DescribeAvailabilityZones"
      resources:
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # SECURITY GROUP MANAGEMENT
    # =========================================
    - sid: "SecurityGroupManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateSecurityGroup"
        - "ec2:DeleteSecurityGroup"
        - "ec2:AuthorizeSecurityGroupIngress"
        - "ec2:AuthorizeSecurityGroupEgress"
        - "ec2:RevokeSecurityGroupIngress"
        - "ec2:RevokeSecurityGroupEgress"
        - "ec2:DescribeSecurityGroups"
        - "ec2:DescribeSecurityGroupRules"
      resources:
        - "arn:aws:ec2:*:*:security-group/*"
        - "arn:aws:ec2:*:*:vpc/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # ROUTE TABLE MANAGEMENT
    # =========================================
    - sid: "RouteTableManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateRouteTable"
        - "ec2:DeleteRouteTable"
        - "ec2:AssociateRouteTable"
        - "ec2:DisassociateRouteTable"
        - "ec2:CreateRoute"
        - "ec2:DeleteRoute"
        - "ec2:ReplaceRoute"
        - "ec2:DescribeRouteTables"
      resources:
        - "arn:aws:ec2:*:*:route-table/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:internet-gateway/*"
        - "arn:aws:ec2:*:*:nat-gateway/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # NAT GATEWAY MANAGEMENT
    # =========================================
    - sid: "NATGatewayManagement"
      effect: "Allow"
      actions:
        - "ec2:CreateNatGateway"
        - "ec2:DeleteNatGateway"
        - "ec2:DescribeNatGateways"
        - "ec2:AllocateAddress"
        - "ec2:ReleaseAddress"
        - "ec2:DescribeAddresses"
      resources:
        - "arn:aws:ec2:*:*:nat-gateway/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:ec2:*:*:elastic-ip/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # VPC FLOW LOGS (Para monitoreo SGSI)
    # =========================================
    - sid: "VPCFlowLogs"
      effect: "Allow"
      actions:
        - "ec2:CreateFlowLogs"
        - "ec2:DeleteFlowLogs"
        - "ec2:DescribeFlowLogs"
        - "logs:CreateLogGroup"
        - "logs:DescribeLogGroups"
        - "logs:PutRetentionPolicy"
      resources:
        - "arn:aws:ec2:*:*:vpc/*"
        - "arn:aws:ec2:*:*:network-interface/*"
        - "arn:aws:ec2:*:*:subnet/*"
        - "arn:aws:logs:*:*:log-group:*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

    # =========================================
    # READ-ONLY PERMISSIONS (Para validaciones)
    # =========================================
    - sid: "EC2ReadOnlyAccess"
      effect: "Allow"
      actions:
        - "ec2:DescribeRegions"
        - "ec2:DescribeAccountAttributes"
        - "ec2:DescribeVpcEndpoints"
        - "ec2:DescribeNetworkAcls"
        - "ec2:DescribeVpcClassicLink"
        - "ec2:DescribeVpcClassicLinkDnsSupport"
      resources:
        - "*"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"
critical: true

tags:
  Service: "EC2"
  AccessLevel: "NetworkManagement" 
  PolicyType: "SGSI-Infrastructure"
  ManagedBy: "aws-iam-roles"
  ComplianceScope: "ISO27001-A.13"
  ZeroTrustLayer: "Network-Infrastructure"