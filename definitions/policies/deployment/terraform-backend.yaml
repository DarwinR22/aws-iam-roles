# GitHub Actions Terraform Backend Permissions
# Provides access to S3, DynamoDB and KMS for Terraform state management
# These permissions are essential for Terraform operations in CI/CD pipelines

policy:
  name: "GithubActions-TerraformBackend" 
  description: "Terraform state backend access for S3, DynamoDB and KMS"
  service: "terraform-backend"
  category: "infrastructure"
  
  # Metadata for policy management
  metadata:
    version: "1.0.0"
    created_by: "DevOps Team"
    last_updated: "2025-09-25"
    purpose: "Terraform state management operations"
    
  # Policy statements for backend access
  statements:
    - sid: "TerraformS3StateAccess"
      effect: "Allow"
      actions:
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:DeleteObject"
        - "s3:ListBucket"
        - "s3:GetBucketVersioning"
        - "s3:GetBucketLocation"
      resources:
        - "arn:aws:s3:::${s3_bucket_name}"
        - "arn:aws:s3:::${s3_bucket_name}/*"
      description: "Full access to Terraform state bucket"
      
    - sid: "TerraformDynamoDBLockAccess"
      effect: "Allow"
      actions:
        - "dynamodb:GetItem"
        - "dynamodb:PutItem"
        - "dynamodb:DeleteItem"
        - "dynamodb:DescribeTable"
      resources:
        - "arn:aws:dynamodb:${aws_region}:${account_id}:table/${dynamodb_table_name}"
      description: "Access to Terraform state locking table"
      
    - sid: "TerraformKMSAccess"
      effect: "Allow"
      actions:
        - "kms:Decrypt"
        - "kms:DescribeKey"
        - "kms:Encrypt"
        - "kms:GenerateDataKey*"
        - "kms:ReEncrypt*"
        - "kms:CreateGrant"
      resources:
        - "arn:aws:kms:${aws_region}:${account_id}:key/${kms_key_id}"
      description: "KMS access for state encryption"
      
      # Conditional KMS access only via S3 and DynamoDB
      conditions:
        - test: "StringEquals"
          variable: "kms:ViaService"
          values:
            - "s3.${aws_region}.amazonaws.com"
            - "dynamodb.${aws_region}.amazonaws.com"

  # ABAC conditions for organizational compliance  
  abac_conditions:
    - test: "StringEquals"
      variable: "aws:PrincipalTag/Gerencia"
      values: ["MCI"]
      description: "Ensure principal belongs to MCI"
      
    - test: "StringEquals" 
      variable: "aws:PrincipalTag/Ambiente"
      values: ["${environment}"]
      description: "Restrict to specific environment"

# Variables for environment customization
variables:
  environment:
    description: "Target environment for backend access"
    type: "string"
    default: "dev"
    allowed_values: ["dev", "qa", "prod"]
    
  aws_region:
    description: "AWS region where resources are located"
    type: "string"
    default: "us-east-1"
    
  account_id:
    description: "AWS account ID"
    type: "string"
    default: "393209814297"
    
  s3_bucket_name:
    description: "S3 bucket name for Terraform state"
    type: "string"
    default: "s3-data-analytics-${environment}-tfstate-datalake"
    
  dynamodb_table_name:
    description: "DynamoDB table name for state locking"
    type: "string" 
    default: "dynamodb-db-${environment}-terraform-lock"
    
  kms_key_id:
    description: "KMS key ID for encryption"
    type: "string"
    default: "fe44eac8-0501-4620-bba9-b0155ed1b1a1"