policy:
  name: "github-deployment-sts-permissions"
  description: "Permisos STS necesarios para GitHub Actions OIDC"
  
  # Metadata
  metadata:
    version: "1.0.0" 
    created_by: "DevOps Team"
    created_date: "2025-10-18"
    purpose: "STS permissions for GitHub Actions OIDC authentication"
    
  # Policy document
  policy_document:
    Version: "2012-10-17"
    Statement:
      - Sid: "STSAssumeRoleWithWebIdentity"
        Effect: "Allow"
        Action:
          - "sts:AssumeRoleWithWebIdentity"
          - "sts:GetCallerIdentity"
          - "sts:TagSession"
        Resource: "*"
        
      - Sid: "AssumeOtherRoles"
        Effect: "Allow"
        Action:
          - "sts:AssumeRole"
        Resource: "arn:aws:iam::${account_id}:role/*"
        Condition:
          StringEquals:
            "aws:RequestedRegion": ["us-east-1"]
  
  # Common tags
  tags:
    Purpose: "GitHub Actions STS"
    Component: "OIDC Authentication"
    ManagedBy: "Terraform"