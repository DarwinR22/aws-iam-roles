policy:
  name: "github-deployment-sts"
  description: "Permisos STS necesarios para GitHub Actions OIDC"
  service: "sts"
  version: "1.0.0"
  
  statements:
    - sid: "STSAssumeRoleWithWebIdentity"
      effect: "Allow"
      actions:
        - "sts:AssumeRoleWithWebIdentity"
        - "sts:GetCallerIdentity"
        - "sts:TagSession"
      resources:
        - "*"
        
    - sid: "AssumeOtherRoles"
      effect: "Allow"
      actions:
        - "sts:AssumeRole"
      resources:
        - "arn:aws:iam::*:role/*"
      conditions:
        StringEquals:
          "aws:RequestedRegion": ["us-east-1"]

# Metadata
environments: ["dev", "qa", "prod"]
owner: "Infrastructure Team"
critical: true

tags:
  Service: "STS"
  AccessLevel: "AssumeRole"
  PolicyType: "Standard"
  ManagedBy: "aws-iam-roles"
  Purpose: "GitHubActions"