policy:
  name: "mci-aws-glue-catalog-read"
  description: "Permite lectura del Glue Data Catalog con control ABAC por Cuenta. Política genérica reutilizable."
  service: "glue"
  version: "1.0.0"
  
  statements:
    - sid: "ReadGlueCatalogWithABAC"
      effect: "Allow"
      actions:
        - "glue:GetDatabase"
        - "glue:GetDatabases"
        - "glue:GetTable"
        - "glue:GetTables"
        - "glue:GetPartition"
        - "glue:GetPartitions"
        - "glue:BatchGetPartition"
        - "glue:GetTableVersion"
        - "glue:GetTableVersions"
        - "glue:SearchTables"
      resources:
        - "arn:aws:glue:*:*:catalog"
        - "arn:aws:glue:*:*:database/*"
        - "arn:aws:glue:*:*:table/*/*"
      
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Cuenta"
          values: ["${aws:ResourceTag/Cuenta}"]
          note: "Solo puede leer bases de datos/tablas de su misma Cuenta (dev/qa/prod)"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "DevOps Team"
critical: false
note: "Política genérica para lectura del catálogo Glue. Incluye permisos para leer databases, tables, partitions."

tags:
  Service: "Glue"
  AccessLevel: "Read"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
  ABACEnabled: "true"
  Reusable: "true"
