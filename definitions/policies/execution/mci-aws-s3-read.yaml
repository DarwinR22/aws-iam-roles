policy:
  name: "mci-aws-s3-read"
  description: "Permite lectura en buckets S3 con control ABAC por Cuenta y Proposito. Política genérica reutilizable para cualquier rol."
  service: "s3"
  version: "1.0.0"
  
  statements:
    - sid: "ListBucketsWithABAC"
      effect: "Allow"
      actions:
        - "s3:ListBucket"
        - "s3:GetBucketLocation"
        - "s3:GetBucketVersioning"
      resources:
        - "arn:aws:s3:::*"
      
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Cuenta"
          values: ["${aws:ResourceTag/Cuenta}"]
          note: "Solo puede listar buckets de su misma Cuenta (dev/qa/prod)"
        
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Proposito"
          values: ["${aws:ResourceTag/Proposito}"]
          note: "Solo puede listar buckets del mismo Proposito (DataLake, Reporting, etc)"
    
    - sid: "ReadObjectsWithABAC"
      effect: "Allow"
      actions:
        - "s3:GetObject"
        - "s3:GetObjectVersion"
        - "s3:GetObjectMetadata"
        - "s3:GetObjectAttributes"
      resources:
        - "arn:aws:s3:::*/*"
      
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Cuenta"
          values: ["${aws:ResourceTag/Cuenta}"]
          note: "Solo puede leer objetos de buckets con su misma Cuenta"
        
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Proposito"
          values: ["${aws:ResourceTag/Proposito}"]
          note: "Solo puede leer objetos de buckets con su mismo Proposito"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "DevOps Team"
critical: false
note: "Política genérica para lectura S3. Funciona para Lambda, Glue, ECS, cualquier servicio que necesite leer S3."

tags:
  Service: "S3"
  AccessLevel: "Read"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
  ABACEnabled: "true"
  Reusable: "true"
