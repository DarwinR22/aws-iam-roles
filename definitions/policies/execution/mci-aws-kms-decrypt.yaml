policy:
  name: "mci-aws-kms-decrypt"
  description: "Permite descifrar objetos con KMS con control ABAC por Cuenta. Necesario para S3 encriptado. Política genérica reutilizable."
  service: "kms"
  version: "1.0.0"
  
  statements:
    - sid: "DecryptWithKMSAndABAC"
      effect: "Allow"
      actions:
        - "kms:Decrypt"
        - "kms:DescribeKey"
        - "kms:GenerateDataKey"
      resources:
        - "arn:aws:kms:*:*:key/*"
      
      abac_conditions:
        - test: "StringEquals"
          variable: "aws:PrincipalTag/Cuenta"
          values: ["${aws:ResourceTag/Cuenta}"]
          note: "Solo puede usar KMS keys de su misma Cuenta (dev/qa/prod)"

# Metadata
environments: ["dev", "qa", "prod"]
owner: "DevOps Team"
critical: false
note: "Política genérica para descifrado KMS. Necesaria para leer/escribir objetos S3 encriptados con KMS."

tags:
  Service: "KMS"
  AccessLevel: "Decrypt"
  PolicyType: "ABAC"
  ManagedBy: "mci-aws-iam"
  ABACEnabled: "true"
  Reusable: "true"
