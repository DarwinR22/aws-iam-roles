repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        exclude: ^modules/
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: local
    hooks:
      - id: iam-validation
        name: IAM Validation
        entry: python3 scripts/validate_iam.py
        language: system
        files: \.tf$
        pass_filenames: true
        
      - id: role-naming-validation
        name: Role Naming Validation
        entry: bash -c 'find . -name "*.tf" -exec grep -l "rol-" {} \; | xargs python3 scripts/validate_iam.py'
        language: system
        files: \.tf$
        pass_filenames: false
