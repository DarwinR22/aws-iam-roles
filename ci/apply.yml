# ci/apply.yml
# =======================================
# ENTERPRISE TERRAFORM APPLY PIPELINE
# =======================================

name: 'Enterprise IAM Terraform Apply'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      confirm_apply:
        description: 'Type "APPLY" to confirm deployment'
        required: true
        type: string
      reason:
        description: 'Reason for deployment'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 393209814297
  TF_VERSION: '1.6.0'

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  # ===================
  # VALIDATION STAGE
  # ===================
  validate-inputs:
    name: 'Validate Deployment Inputs'
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate Apply Confirmation
      run: |
        if [[ "${{ github.event.inputs.confirm_apply }}" != "APPLY" ]]; then
          echo "❌ ERROR: Must type 'APPLY' to confirm deployment"
          echo "You entered: '${{ github.event.inputs.confirm_apply }}'"
          exit 1
        fi
        echo "✅ Apply confirmation validated"

    - name: Validate Reason
      run: |
        if [[ ${#REASON} -lt 10 ]]; then
          echo "❌ ERROR: Deployment reason must be at least 10 characters"
          echo "Reason: '${{ github.event.inputs.reason }}'"
          exit 1
        fi
        echo "✅ Deployment reason validated"
      env:
        REASON: ${{ github.event.inputs.reason }}

  # ===================
  # ENVIRONMENT SPECIFIC PROTECTIONS
  # ===================
  production-protection:
    name: 'Production Protection'
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: github.event.inputs.environment == 'prod'
    environment: 
      name: production
      url: https://console.aws.amazon.com/iam/
    
    steps:
    - name: Production Deployment Gate
      run: |
        echo "🔒 PRODUCTION DEPLOYMENT GATE"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Reason: ${{ github.event.inputs.reason }}"
        echo "Actor: ${{ github.actor }}"
        echo ""
        echo "⚠️  This deployment will affect PRODUCTION IAM resources"
        echo "✅ Manual approval required from authorized personnel"

  qa-protection:
    name: 'QA Protection'
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: github.event.inputs.environment == 'qa'
    environment: 
      name: qa
      url: https://console.aws.amazon.com/iam/
    
    steps:
    - name: QA Deployment Gate
      run: |
        echo "🔐 QA DEPLOYMENT GATE"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Reason: ${{ github.event.inputs.reason }}"
        echo "✅ QA deployment approved"

  # ===================
  # TERRAFORM APPLY
  # ===================
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: [validate-inputs, production-protection, qa-protection]
    if: always() && needs.validate-inputs.result == 'success' && 
        (needs.production-protection.result == 'success' || needs.production-protection.result == 'skipped') &&
        (needs.qa-protection.result == 'success' || needs.qa-protection.result == 'skipped')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::393209814297:role/github-actions-oidc
        role-session-name: terraform-apply-${{ github.event.inputs.environment }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Download Plan Artifact
      uses: actions/download-artifact@v3
      with:
        name: terraform-plan-${{ github.event.inputs.environment }}
        path: environments/${{ github.event.inputs.environment }}/

    - name: Terraform Init
      id: init
      run: |
        cd environments/${{ github.event.inputs.environment }}
        terraform init
        echo "::notice::✅ Terraform init completed"

    - name: Terraform Apply
      id: apply
      run: |
        cd environments/${{ github.event.inputs.environment }}
        
        echo "🚀 Starting Terraform Apply"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Reason: ${{ github.event.inputs.reason }}"
        echo "Actor: ${{ github.actor }}"
        echo ""
        
        # Apply with the pre-approved plan
        terraform apply -input=false tfplan
        
        echo "::notice::✅ Terraform apply completed successfully"

    - name: Terraform State Summary
      id: summary
      run: |
        cd environments/${{ github.event.inputs.environment }}
        
        echo "📊 Deployment Summary"
        echo "===================="
        
        # Get state summary
        terraform state list | wc -l | xargs echo "Total Resources:"
        echo ""
        
        # Count by resource type
        echo "Resource Breakdown:"
        terraform state list | cut -d'.' -f1 | sort | uniq -c | sort -nr
        
        echo "::notice::✅ State summary generated"

    - name: Verify IAM Resources
      id: verify
      run: |
        echo "🔍 Verifying IAM Resources"
        echo "========================="
        
        # List created roles
        echo "IAM Roles:"
        aws iam list-roles --query 'Roles[?contains(RoleName, `mci`) || contains(RoleName, `bi-`) || contains(RoleName, `data-`)].{RoleName:RoleName,CreateDate:CreateDate}' --output table
        
        # List managed policies
        echo ""
        echo "Managed Policies:"
        aws iam list-policies --scope Local --query 'Policies[?contains(PolicyName, `MCI-`)].{PolicyName:PolicyName,CreateDate:CreateDate}' --output table
        
        echo "::notice::✅ IAM resources verified"

  # ===================
  # POST-DEPLOYMENT
  # ===================
  post-deployment:
    name: 'Post-Deployment Tasks'
    runs-on: ubuntu-latest
    needs: terraform-apply
    
    steps:
    - name: Create Deployment Record
      uses: actions/github-script@v6
      with:
        script: |
          const title = `✅ Deployment Completed: ${process.env.ENVIRONMENT}`;
          const body = `## Deployment Summary
          
          **Environment**: ${process.env.ENVIRONMENT}
          **Date**: ${new Date().toISOString()}
          **Actor**: ${process.env.GITHUB_ACTOR}
          **Commit**: ${process.env.GITHUB_SHA}
          **Reason**: ${process.env.REASON}
          
          **Status**: ✅ Success
          
          **Applied Changes**:
          - IAM roles and policies updated
          - ABAC security controls enforced
          - Permission boundaries applied
          - Canonical tags validated
          
          **Next Steps**:
          - Monitor CloudTrail for IAM activity
          - Verify application access patterns
          - Review any alerts in security monitoring
          
          /cc @seguridad-cloud`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['deployment', 'completed', process.env.ENVIRONMENT]
          });
      env:
        ENVIRONMENT: ${{ github.event.inputs.environment }}
        REASON: ${{ github.event.inputs.reason }}

    - name: Notify Teams Channel
      run: |
        echo "📢 Deployment notification sent"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Status: Success"
        # Here you would integrate with Teams/Slack webhook if configured
        
  # ===================
  # DRIFT DETECTION
  # ===================
  schedule-drift-check:
    name: 'Schedule Drift Detection'
    runs-on: ubuntu-latest
    needs: terraform-apply
    
    steps:
    - name: Trigger Drift Detection
      uses: actions/github-script@v6
      with:
        script: |
          // Schedule a drift detection workflow run for tomorrow
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          
          console.log(`Drift detection scheduled for: ${tomorrow.toISOString()}`);
          console.log(`Environment: ${process.env.ENVIRONMENT}`);
          
          // This would trigger the drift detection workflow
          // github.rest.actions.createWorkflowDispatch({...})
      env:
        ENVIRONMENT: ${{ github.event.inputs.environment }}