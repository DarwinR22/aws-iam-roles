# ci/terraform.yml
# ========================================
# ENTERPRISE TERRAFORM CI/CD PIPELINE
# ========================================

name: 'Enterprise IAM Terraform CI'

on:
  push:
    branches: [ main, dev, qa ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'policy_lib/**'
      - 'catalog/**'
      - 'guardrails/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'policy_lib/**'
      - 'catalog/**'
      - 'guardrails/**'

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 393209814297
  TF_VERSION: '1.6.0'
  TFLINT_VERSION: 'v0.48.0'
  CONFTEST_VERSION: '0.46.0'
  CHECKOV_VERSION: '3.0.0'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  # ===================
  # VALIDATION STAGE
  # ===================
  terraform-validation:
    name: 'Terraform Validation'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, qa, prod]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::393209814297:role/github-actions-oidc
        role-session-name: terraform-validation-${{ matrix.environment }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      id: fmt
      run: |
        cd environments/${{ matrix.environment }}
        terraform fmt -check -recursive
        echo "::notice::✅ Terraform format check passed for ${{ matrix.environment }}"

    - name: Terraform Init
      id: init
      run: |
        cd environments/${{ matrix.environment }}
        terraform init
        echo "::notice::✅ Terraform init completed for ${{ matrix.environment }}"

    - name: Terraform Validate
      id: validate
      run: |
        cd environments/${{ matrix.environment }}
        terraform validate
        echo "::notice::✅ Terraform validate passed for ${{ matrix.environment }}"

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: ${{ env.TFLINT_VERSION }}

    - name: TFLint Check
      id: tflint
      run: |
        cd environments/${{ matrix.environment }}
        tflint --init
        tflint --format compact
        echo "::notice::✅ TFLint check passed for ${{ matrix.environment }}"

  # ===================
  # SECURITY STAGE
  # ===================
  security-validation:
    name: 'Security Validation'
    runs-on: ubuntu-latest
    needs: terraform-validation
    strategy:
      matrix:
        environment: [dev, qa, prod]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::393209814297:role/github-actions-oidc
        role-session-name: security-validation-${{ matrix.environment }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Generate Terraform Plan
      id: plan
      run: |
        cd environments/${{ matrix.environment }}
        terraform init
        terraform plan -out=tfplan -input=false
        terraform show -json tfplan > tfplan.json
        echo "::notice::✅ Terraform plan generated for ${{ matrix.environment }}"

    - name: Setup Conftest
      run: |
        curl -L https://github.com/open-policy-agent/conftest/releases/download/v${{ env.CONFTEST_VERSION }}/conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz | tar xz
        sudo mv conftest /usr/local/bin
        echo "::notice::✅ Conftest installed"

    - name: Run Conftest (OPA) Validation
      id: conftest
      run: |
        cd environments/${{ matrix.environment }}
        conftest verify --policy ../../guardrails/conftest
        conftest test --policy ../../guardrails/conftest tfplan.json
        echo "::notice::✅ Conftest (OPA) validation passed for ${{ matrix.environment }}"

    - name: Setup Checkov
      run: |
        pip install checkov==${{ env.CHECKOV_VERSION }}
        echo "::notice::✅ Checkov installed"

    - name: Run Checkov Scan
      id: checkov
      run: |
        cd environments/${{ matrix.environment }}
        checkov --config-file ../../guardrails/checkov/.checkov.yaml \
                --framework terraform_plan \
                --file tfplan.json \
                --output cli \
                --output sarif \
                --output-file-path ./checkov-results.sarif
        echo "::notice::✅ Checkov scan completed for ${{ matrix.environment }}"

    - name: Upload Checkov SARIF results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: environments/${{ matrix.environment }}/checkov-results.sarif
        category: checkov-${{ matrix.environment }}

    - name: AWS IAM Access Analyzer Validation
      id: access-analyzer
      run: |
        cd environments/${{ matrix.environment }}
        
        # Extract policy documents from plan and validate each one
        for policy_file in $(jq -r '.resource_changes[] | select(.type == "aws_iam_policy") | .change.after.policy' tfplan.json | grep -v null); do
          echo "Validating policy: $policy_file"
          
          # Create temporary policy file
          echo "$policy_file" > temp_policy.json
          
          # Validate with Access Analyzer
          aws accessanalyzer validate-policy \
            --policy-document file://temp_policy.json \
            --policy-type IDENTITY_POLICY \
            --region ${{ env.AWS_REGION }} || exit 1
            
          rm temp_policy.json
        done
        
        echo "::notice::✅ AWS IAM Access Analyzer validation passed for ${{ matrix.environment }}"

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan-${{ matrix.environment }}
        path: environments/${{ matrix.environment }}/tfplan
        retention-days: 30

  # ===================
  # COMMENT ON PR
  # ===================
  comment-pr:
    name: 'Comment on PR'
    runs-on: ubuntu-latest
    needs: [terraform-validation, security-validation]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        script: |
          const output = `#### 🚀 Enterprise IAM Terraform CI Results
          
          | Environment | Validation | Security | Status |
          |-------------|------------|----------|--------|
          | dev         | ✅ Passed   | ✅ Passed | Ready  |
          | qa          | ✅ Passed   | ✅ Passed | Ready  |
          | prod        | ✅ Passed   | ✅ Passed | Ready  |
          
          #### 🔒 Security Validations Completed:
          - ✅ **Conftest (OPA)**: IAM security guardrails validated
          - ✅ **Checkov**: Infrastructure security scan passed
          - ✅ **AWS Access Analyzer**: Policy validation successful
          - ✅ **Permission Boundaries**: All roles have boundaries attached
          - ✅ **Canonical Tags**: All 23 required tags present
          - ✅ **ABAC Conditions**: Tag-based access controls validated
          
          #### 📋 Next Steps:
          - Review the security scan results above
          - Ensure all required approvals from @seguridad-cloud team
          - Plans are ready for manual deployment via \`Apply\` workflow
          
          *This PR follows enterprise security standards and ABAC architecture.*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

  # ===================
  # NOTIFY SECURITY TEAM
  # ===================
  notify-security:
    name: 'Notify Security Team'
    runs-on: ubuntu-latest
    needs: [terraform-validation, security-validation]
    if: contains(github.event.head_commit.message, 'policy_lib') || contains(github.event.head_commit.message, 'guardrails')
    
    steps:
    - name: Create Security Review Issue
      uses: actions/github-script@v6
      with:
        script: |
          const title = `🔒 Security Review Required: ${context.payload.head_commit.message}`;
          const body = `## Security Review Required
          
          **Commit**: ${context.sha}
          **Author**: ${context.payload.head_commit.author.name}
          **Branch**: ${context.ref}
          
          **Changed Components**:
          - Policy Library updates detected
          - Guardrails modifications detected
          
          **Required Actions**:
          - [ ] Review policy changes for ABAC compliance
          - [ ] Validate guardrails are not weakened
          - [ ] Approve changes if security standards are met
          
          **Security Team**: @seguridad-cloud
          
          /cc @seguridad-cloud`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['security-review', 'high-priority'],
            assignees: []
          });