# ci/drift-detection.yml
# =====================================
# ENTERPRISE DRIFT DETECTION PIPELINE
# =====================================

name: 'Drift Detection'

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check for drift'
        required: false
        type: choice
        options:
          - all
          - dev
          - qa
          - prod
        default: 'all'

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 393209814297
  TF_VERSION: '1.6.0'

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift-detection:
    name: 'Drift Detection'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, qa, prod]
      fail-fast: false
    
    steps:
    - name: Skip if environment not selected
      if: github.event.inputs.environment != 'all' && github.event.inputs.environment != matrix.environment
      run: |
        echo "Skipping ${{ matrix.environment }} - not selected"
        exit 0

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::393209814297:role/github-actions-oidc
        role-session-name: drift-detection-${{ matrix.environment }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: |
        cd environments/${{ matrix.environment }}
        terraform init

    - name: Drift Detection
      id: drift
      run: |
        cd environments/${{ matrix.environment }}
        
        echo "🔍 Checking for configuration drift in ${{ matrix.environment }}"
        
        # Run refresh-only plan to detect drift
        terraform plan -refresh-only -detailed-exitcode -out=drift-plan
        PLAN_EXIT_CODE=$?
        
        echo "Terraform plan exit code: $PLAN_EXIT_CODE"
        
        if [ $PLAN_EXIT_CODE -eq 0 ]; then
          echo "✅ No drift detected in ${{ matrix.environment }}"
          echo "has_drift=false" >> $GITHUB_OUTPUT
        elif [ $PLAN_EXIT_CODE -eq 2 ]; then
          echo "⚠️ DRIFT DETECTED in ${{ matrix.environment }}"
          echo "has_drift=true" >> $GITHUB_OUTPUT
          
          # Show the drift details
          terraform show drift-plan
        else
          echo "❌ Error running drift detection"
          exit 1
        fi

    - name: Generate Drift Report
      if: steps.drift.outputs.has_drift == 'true'
      run: |
        cd environments/${{ matrix.environment }}
        
        echo "📋 Generating drift report for ${{ matrix.environment }}"
        
        # Create detailed drift report
        terraform show -json drift-plan > drift-report.json
        
        # Extract drifted resources
        jq -r '.resource_drift[]? | select(.change.actions[] | contains("update")) | "Resource: " + .address + "\nType: " + .type + "\nChanges: " + (.change.after | tostring) + "\n---"' drift-report.json > drift-summary.txt
        
        echo "Drift report generated"

    - name: Create Drift Issue
      if: steps.drift.outputs.has_drift == 'true'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          let driftSummary = '';
          try {
            driftSummary = fs.readFileSync(`environments/${{ matrix.environment }}/drift-summary.txt`, 'utf8');
          } catch (error) {
            driftSummary = 'Unable to read drift summary file';
          }
          
          const title = `🚨 Configuration Drift Detected: ${{ matrix.environment }}`;
          const body = `## Configuration Drift Alert
          
          **Environment**: ${{ matrix.environment }}
          **Detection Date**: ${new Date().toISOString()}
          **Detection Method**: Automated nightly scan
          
          ### 📊 Drift Summary
          
          Configuration drift has been detected in the ${{ matrix.environment }} environment. This means the actual AWS resources differ from the Terraform configuration.
          
          ### 🔍 Drifted Resources
          
          \`\`\`
          ${driftSummary}
          \`\`\`
          
          ### 🛠️ Recommended Actions
          
          1. **Review Changes**: Examine what has changed outside of Terraform
          2. **Identify Cause**: Determine if changes were:
             - Manual modifications in AWS console
             - Changes made by other tools/scripts
             - AWS service updates
             - Security remediation
          
          3. **Choose Resolution**:
             - **Import Changes**: Update Terraform configuration to match AWS reality
             - **Revert Changes**: Apply Terraform to restore original configuration
             - **Accept Drift**: Document and exclude from drift monitoring if intentional
          
          ### ⚠️ Security Implications
          
          Configuration drift in IAM resources can have security implications:
          - Role permissions may have been modified
          - Trust policies might have changed
          - Permission boundaries could be bypassed
          - Tags required for ABAC may be missing
          
          ### 👥 Required Actions
          
          **Security Team** (@seguridad-cloud): Please review for security impact
          **DevOps Team**: Investigate root cause and plan remediation
          
          /cc @seguridad-cloud`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['drift-detected', 'security-review', 'high-priority', `env-${{ matrix.environment }}`]
          });

    - name: Upload Drift Artifacts
      if: steps.drift.outputs.has_drift == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: drift-report-${{ matrix.environment }}
        path: |
          environments/${{ matrix.environment }}/drift-plan
          environments/${{ matrix.environment }}/drift-report.json
          environments/${{ matrix.environment }}/drift-summary.txt
        retention-days: 30

  drift-summary:
    name: 'Drift Detection Summary'
    runs-on: ubuntu-latest
    needs: drift-detection
    if: always()
    
    steps:
    - name: Summarize Results
      uses: actions/github-script@v6
      with:
        script: |
          const results = {
            dev: '${{ needs.drift-detection.result }}',
            qa: '${{ needs.drift-detection.result }}', 
            prod: '${{ needs.drift-detection.result }}'
          };
          
          console.log('Drift Detection Summary:');
          console.log('========================');
          
          for (const [env, result] of Object.entries(results)) {
            const status = result === 'success' ? '✅ No Drift' : 
                          result === 'failure' ? '❌ Error' : 
                          '⚠️ Drift Detected';
            console.log(`${env.toUpperCase()}: ${status}`);
          }
          
          // Set overall status
          const hasFailures = Object.values(results).some(r => r === 'failure');
          const hasDrift = false; // This would be determined by checking step outputs
          
          if (hasFailures) {
            core.setFailed('Drift detection failed for one or more environments');
          } else if (hasDrift) {
            core.warning('Configuration drift detected - check issues for details');
          } else {
            console.log('✅ All environments are in sync');
          }